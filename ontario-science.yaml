  - code: B
    title: Matter, Chemical Trends, and Chemical Bonding
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the properties of commonly
        used chemical substances and their effects on human health and the environment, and propose ways
        to lessen their impact'
      specific:
      - code: B1.1
        text: analyse, on the basis of research, the properties of a commonly used but potentially harmful
          chemical substance (e.g., fertilizer, pesticide, a household cleaning product, materials used
          in electronics and batteries) and how that substance affects the environment, and propose ways
          to lessen the harmfulness of the substance (e.g., by reducing the amount used, by modifying
          one of its chemical components) or identify alternative substances that could be used for the
          same purpose [IP, PR, AI, C]
      - code: B1.2
        text: evaluate the risks and benefits to human health of some commonly used chemical substances
          (e.g., chemical additives in foods; pharmaceuticals; cosmetics and perfumes; household cleaning
          products) [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate physical and chemical properties
        of elements and compounds, and use various methods to visually represent them'
      specific:
