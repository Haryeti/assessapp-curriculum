        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., laser optics researcher, geoscientist, photonics researcher, aerospace engineer) and
          the education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Elizabeth MacGill,
          Pierre Coulombe, Allan Carswell, Gerhard Herzberg), to the fields under study
  - code: B
    title: Dynamics
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: analyse technological devices
        that apply the principles of the dynamics of motion, and assess the technologies’ social and environmental
        impact'
      specific:
      - code: B1.1
        text: analyse a technological device that applies the principles of linear or circular motion
          (e.g., a slingshot, a rocket launcher, a race car, a trebuchet) [AI, C]
      - code: B1.2
        text: assess the impact on society and the environment of technological devices that use linear
          or circular motion (e.g., projectile weapons, centrifuges, elevators) [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate, in qualitative and quantitative
        terms, forces involved in uniform circular motion and motion in a plane, and solve related problems'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to dynamics, including, but not limited to: inertial
          and non-inertial frames of reference, components, centripetal, period, frequency, static friction,
          and kinetic friction [C]'
      - code: B2.2
        text: solve problems related to motion, including projectile and relative motion, by adding and
          subtracting two-dimensional vector quantities, using vector diagrams, vector components, and
          algebraic methods [PR, AI, C]
      - code: B2.3
        text: analyse, in qualitative and quantitative terms, the relationships between the force of gravity,
          normal force, applied force, force of friction, coefficient of static friction, and coefficient
          of kinetic friction, and solve related two-dimensional problems using free-body diagrams, vector
          components, and algebraic equations (e.g., calculate the acceleration of a block sliding along
          an inclined plane or the force acting on a vehicle navigating a curve) [AI, C]
      - code: B2.4
        text: predict, in qualitative and quantitative terms, the forces acting on systems of objects
          (e.g., masses in a vertical pulley system [a “dumb waiter”], a block sliding off an accelerating
          vehicle, masses in an inclined-plane pulley system), and plan and conduct an inquiry to test
          their predictions [IP, PR, AI]
      - code: B2.5
        text: analyse, in qualitative and quantitative terms, the relationships between the motion of
          a system and the forces involved (e.g., a block sliding on an inclined plane, acceleration of
          a pulley system), and use free-body diagrams and algebraic equations to solve related problems
          [AI, C]
      - code: B2.6
        text: analyse, in qualitative and quantitative terms, the forces acting on and the acceleration
          experienced by an object in uniform circular motion in horizontal and vertical planes, and use
          free-body diagrams and algebraic equations to solve related problems [AI, C]
      - code: B2.7
        text: conduct inquiries into the uniform circular motion of an object (e.g., using video analysis
          of an amusement park ride, measuring the forces and period of a tether ball), and analyse, in
          qualitative and quantitative terms, the relationships between centripetal acceleration, centripetal
          force, radius of orbit, period, frequency, mass, and speed [PR, AI]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the forces involved in uniform
        circular motion and motion in a plane'
      specific:
      - code: B3.1
        text: distinguish between reference systems (inertial and non-inertial) with respect to the real
          and apparent forces acting within such systems (e.g., apparent force in a rotating frame, apparent
          gravitational force in a vertically accelerating frame, real force pulling on the elastic of
          a ball-and-paddle toy)
      - code: B3.2
        text: explain the advantages and disadvantages of static and kinetic friction in situations involving
          various planes (e.g., a horizontal plane, a variety of inclined planes)
      - code: B3.3
        text: explain the derivation of equations for uniform circular motion that involve the variables
          frequency, period, radius speed, and mass
  - code: C
    title: Energy and Momentum
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse, and propose ways to
        improve, technologies or procedures that apply principles related to energy and momentum, and
        assess the social and environmental impact of these technologies or procedures'
      specific:
      - code: C1.1
        text: analyse, with reference to the principles of energy and momentum, and propose practical
          ways to improve, a technology or procedure that applies these principles (e.g., fireworks, rocket
          propulsion, protective equipment, forensic analysis of vehicle crashes, demolition of buildings)
          [AI, C]
      - code: C1.2
        text: assess the impact on society and the environment of technologies or procedures that apply
          the principles of energy and momentum (e.g., crumple zones, safety restraints, strategic building
          implosion) [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate, in qualitative and quantitative
        terms, through laboratory inquiry or computer simulation, the relationship between the laws of
        conservation of energy and conservation of momentum, and solve related problems'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to energy and momentum, including, but not limited
          to: work, work–energy theorem, kinetic energy, gravitational potential energy, elastic potential
          energy, thermal energy, impulse, change in momentum–impulse theorem, elastic collision, and
          inelastic collision [C]'
      - code: C2.2
        text: analyse, in qualitative and quantitative terms, the relationship between work and energy,
          using the work–energy theorem and the law of conservation of energy, and solve related problems
          in one and two dimensions [PR, AI]
      - code: C2.3
        text: use an inquiry process to analyse, in qualitative and quantitative terms, situations involving
          work, gravitational potential energy, kinetic energy, thermal energy, and elastic potential
          energy, in one and two dimensions (e.g., a block sliding along an inclined plane with friction;
          a cart rising and falling on a roller coaster track; an object, such as a mass attached to a
          spring pendulum, that undergoes simple harmonic motion), and use the law of conservation of
          energy to solve related problems [PR, AI]
      - code: C2.4
        text: conduct a laboratory inquiry or computer simulation to test the law of conservation of energy
          during energy transformations that involve gravitational potential energy, kinetic energy, thermal
          energy, and elastic potential energy (e.g., using a bouncing ball, a simple pendulum, a computer
          simulation of a bungee jump) [PR, AI]
      - code: C2.5
        text: analyse, in qualitative and quantitative terms, the relationships between mass, velocity,
          kinetic energy, momentum, and impulse for a system of objects moving in one and two dimensions
          (e.g., an off-centre collision of two masses on an air table, two carts recoiling from opposite
          ends of a released spring), and solve problems involving these concepts [PR, AI]
      - code: C2.6
        text: analyse, in qualitative and quantitative terms, elastic and inelastic collisions in one
          and two dimensions, using the laws of conservation of momentum and conservation of energy, and
          solve related problems [PR, AI]
      - code: C2.7
        text: conduct laboratory inquiries or computer simulations involving collisions and explosions
          in one and two dimensions (e.g., interactions between masses on an air track, the collision
          of two pucks on an air table, collisions between spheres of similar and different masses) to
          test the laws of conservation of momentum and conservation of energy [PR, AI]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of work, energy, momentum, and
        the laws of conservation of energy and conservation of momentum, in one and two dimensions'
      specific:
      - code: C3.1
        text: describe and explain Hooke’s law, and explain the relationships between that law, work,
          and elastic potential energy in a system of objects
      - code: C3.2
        text: describe and explain the simple harmonic motion (SHM) of an object, and explain the relationship
          between SHM, Hooke’s law, and uniform circular motion
      - code: C3.3
        text: distinguish between elastic and inelastic collisions
      - code: C3.4
        text: explain the implications of the laws of conservation of energy and conservation of momentum
          with reference to mechanical systems (e.g., damped harmonic motion in shock absorbers, the impossibility
          of developing a perpetual motion machine)
      - code: C3.5
        text: explain how the laws of conservation of energy and conservation of momentum were used to
          predict the existence and properties of the neutrino
  - code: D
    title: Gravitational, Electric, and Magnetic Fields
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the operation of technologies
        that use gravitational, electric, or magnetic fields, and assess the technologies’ social and
        environmental impact'
      specific:
      - code: D1.1
        text: analyse the operation of a technological system that uses gravitational, electric, or magnetic
          fields (e.g., a home entertainment system, a computer, magnetic strips on credit cards) [AI,
          C]
      - code: D1.2
        text: assess the impact on society and the environment of technologies that use gravitational,
          electric, or magnetic fields (e.g., satellites used in surveillance or storm tracking, particle
          accelerators that provide high-energy particles for medical imaging) [AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate, in qualitative and quantitative
        terms, gravitational, electric, and magnetic fields, and solve related problems'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to fields, including, but not limited to: forces, potential
          energies, potential, and exchange particles [C]'
      - code: D2.2
        text: analyse, and solve problems relating to, Newton’s law of universal gravitation and circular
          motion (e.g., with respect to satellite orbits, black holes, dark matter) [AI]
      - code: D2.3
        text: analyse, and solve problems involving, electric force, field strength, potential energy,
          and potential as they apply to uniform and non-uniform electric fields (e.g., the fields produced
          by a parallel plate and by point charges) [AI]
      - code: D2.4
        text: analyse, and solve problems involving, the force on charges moving in a uniform magnetic
          field (e.g., the force on a current-carrying conductor or a free electron) [AI]
      - code: D2.5
        text: conduct a laboratory inquiry or computer simulation to examine the behaviour of a particle
          in a field (e.g., test Coulomb’s law; replicate Millikan’s experiment or Rutherford’s scattering
          experiment; use a bubble or cloud chamber) [PR]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the concepts, properties, principles,
        and laws related to gravitational, electric, and magnetic fields and their interactions with matter'
      specific:
      - code: D3.1
        text: identify, and compare the properties of, fundamental forces that are associated with different
          theories and models of physics (e.g., the theory of general relativity and the standard model
          of particle physics)
      - code: D3.2
        text: compare and contrast the corresponding properties of gravitational, electric, and magnetic
          fields (e.g., the strength of each field; the relationship between charge in electric fields
          and mass in gravitational fields)
      - code: D3.3
        text: use field diagrams to explain differences in the sources and directions of fields, including,
          but not limited to, differences between near-Earth and distant fields, parallel plates and point
          charges, straight line conductors and solenoids
  - code: E
    title: The Wave Nature of Light
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: analyse technologies that use
        the wave nature of light, and assess their impact on society and the environment'
      specific:
      - code: E1.1
        text: analyse, with reference to the principles related to the wave nature of light, a technology
          that uses these principles (e.g., Xeon lights, spectroscopes, polarized sunglasses) [AI, C]
      - code: E1.2
        text: assess the impact on society and the environment of technologies that use the wave nature
          of light (e.g., DVDs, polarized lenses, night vision goggles, wireless networks) [AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate, in qualitative and quantitative
        terms, the properties of waves and light, and solve related problems'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to the wave nature of light, including, but not limited
          to: diffraction, dispersion, wave interference, nodal line, phase, oscillate, polarization,
          and electro- magnetic radiation [C]'
      - code: E2.2
        text: conduct inquiries involving the diffraction and interference of waves, using ripple tanks
          or computer simulations [PR]
      - code: E2.3
        text: conduct inquiries involving the diffraction, refraction, polarization, and interference
          of light waves (e.g., shine lasers through single, double, and multiple slits; observe a computer
          simulation of Young’s double-slit experiment; measure the index of refraction of different materials;
          observe the effect of crossed polarizing filters on transmitted light) [PR]
      - code: E2.4
        text: analyse diffraction and interference of water waves and light waves (e.g., with reference
          to two-point source interference in a ripple tank, thin-film interference, multiple-slit interference),
          and solve related problems [PR, AI]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the properties of waves and
        light in relation to diffraction, refraction, interference, and polarization'
      specific:
      - code: E3.1
        text: describe and explain the diffraction and interference of water waves in two dimensions
      - code: E3.2
        text: describe and explain the diffraction, refraction, polarization, and interference of light
          waves (e.g., reduced resolution caused by diffraction, mirages caused by refraction, polarization
          caused by reflection and filters, thin-film interference in soap films and air wedges, interference
          of light on CDs)
      - code: E3.3
        text: use the concepts of refraction, diffraction, polarization, and wave interference to explain
          the separation of light into colours in various situations (e.g., light travelling through a
          prism; light contacting thin film, soap film, stressed plastic between two polarizing filters)
      - code: E3.4
        text: describe, in qualitative terms, the production of electromagnetic radiation by an oscillating
          electric dipole (e.g., a radio transmitter, a microwave emitter, an X-ray emitter, electron
          energy transitions in an atom)
  - code: F
    title: 'Revolutions in Modern Physics: Quantum Mechanics and Special Relativity'
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: analyse, with reference to
        quantum mechanics and relativity, how the introduction of new conceptual models and theories can
        influence and/or change scientific thought and lead to the development of new technologies'
      specific:
      - code: F1.1
        text: analyse the development of the two major revolutions in modern physics (e.g., the impact
          of the discovery of the photoelectric effect on the development of quantum mechanics; the impact
          of thought experiments on the development of the theory of relativity), and assess how they
          changed scientific thought [AI, C]
      - code: F1.2
        text: assess the importance of relativity and quantum mechanics to the development of various
          technologies (e.g., nuclear power; light sensors; diagnostic tools such as magnetic resonance
          imaging [MRI], computerized axial tomography [CAT], positron emission tomography [PET]) [AI,
          C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate special relativity and
        quantum mechanics, and solve related problems'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to quantum mechanics and special relativity, including,
          but not limited to: quantum theory, photoelectric effect, matter waves, time dilation, and mass–energy
          transformation [C]'
      - code: F2.2
        text: solve problems related to the photoelectric effect, the Compton effect, and de Broglie’s
          matter waves [PR, AI]
      - code: F2.3
        text: solve problems related to Einstein’s theory of special relativity in order to calculate
          the effects of relativistic motion on time, length, and mass (e.g., the half-life of cosmic
          ray muons, how far into the future a fast space ship would travel, the magnetic field strength
          necessary to keep protons in the Large Hadron Collider) [PR, AI]
      - code: F2.4
        text: conduct a laboratory inquiry or computer simulation to analyse data (e.g., on emission spectra,
          the photoelectric effect, relativistic momentum in accelerators) that support a scientific theory
          related to relativity or quantum mechanics [PR, AI]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the evidence that supports
        the basic concepts of quantum mechanics and Einstein’s theory of special relativity'
      specific:
      - code: F3.1
        text: describe the experimental evidence that supports a particle model of light (e.g., the photoelectric
          effect, the Compton effect, pair creation, de Broglie’s matter waves)
      - code: F3.2
        text: describe the experimental evidence that supports a wave model of matter (e.g., electron
          diffraction)
      - code: F3.3
        text: identify Einstein’s two postulates for the theory of special relativity, and describe the
          evidence supporting the theory (e.g., thought experiments, half lives of elementary particles,
          relativistic momentum in accelerators, the conversion of matter into energy in a nuclear power
          plant)
      - code: F3.4
        text: describe the standard model of elementary particles in terms of the characteristics of quarks,
          hadrons, and field particles
- course: SPH4C
  title: Physics, Grade 12, College Preparation
  grade: 12
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate relevant scientific questions about observed relationships, ideas, problems, or
          issues, make informed predictions, and/or formulate educated hypotheses to focus inquiries or
          research
      - code: A1.2
        text: select appropriate instruments (e.g., electronic probes, pendulums, cylinders) and materials
          (e.g., motion carts, magnets, simple machines), and identify appropriate methods, techniques,
          and procedures, for each inquiry
      - code: A1.3
        text: identify and locate a variety of print and electronic sources that enable them to address
          research topics fully and appropriately
      - code: A1.4
        text: apply knowledge and understanding of safe laboratory practices and procedures when planning
          investigations by correctly interpreting Workplace Hazardous Materials Information System (WHMIS)
          symbols; by using appropriate techniques for handling and storing laboratory equipment and materials
          and disposing of laboratory materials; and by using appropriate personal protection (e.g., personal
          protective equipment when carrying out fluids experiments)
      - code: A1.5
        text: conduct inquiries, controlling relevant variables, adapting or extending procedures as required,
          and using appropriate materials and equipment safely, accurately, and effectively, to collect
          observations and data
      - code: A1.6
        text: compile accurate data from laboratory and other sources, and organize and record the data,
          using appropriate formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from a variety of appropriate
          sources, including electronic, print, and/or human sources, using suitable formats and an accepted
          form of academic documentation
      - code: A1.8
        text: synthesize, analyse, interpret, and evaluate qualitative and/or quantitative data; solve
          problems using quantitative data; determine whether the evidence supports or refutes the initial
          prediction or hypothesis and whether it is consistent with scientific theory; identify sources
          of bias and/or error; and suggest improvements to the inquiry to reduce the likelihood of error
      - code: A1.9
        text: analyse the information gathered from research sources for logic, accuracy, reliability,
          adequacy, and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
          with reference to scientific knowledge
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric (e.g., SI and imperial units), symbolic, and graphic modes of representation
          (e.g., free-body diagrams, algebraic equations)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places or significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers related to the fields of science under
        study, and describe the contributions of scientists, including Canadians, to those fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., alternative energy advocate, sustainable energy technician, electrician, mechanic) and
          the education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Elijah McCoy, Jaisel
          Vadgama, Gerald Vincent Bull, Elizabeth Cannon, Richard Marceau, Normand C. Beaulieu), to the
          fields under study
  - code: B
    title: Motion and its Applications
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: analyse selected technologies
        that are used to move objects or track their motion, and evaluate their impact on society and
        the environment, including their contribution to scientific knowledge'
      specific:
      - code: B1.1
        text: analyse the design and uses of a transportation technology (e.g., snowmobiles, automobiles,
          motorized personal water craft), and evaluate its social and environmental impact, including
          the impact on risk behaviour and accident rates [AI, C]
      - code: B1.2
        text: analyse how technologies are used to track the motion of objects, and outline various kinds
          of scientific knowledge gained through the use of such technologies (e.g., data on animal populations
          and migrations, on changes in ocean currents related to global warming, on the behaviour of
          celestial objects) [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate, in qualitative and quantitative
        terms, the linear uniform and non-uniform motion of objects, and solve related problems'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to motion, including, but not limited to: distance,
          displacement, position, speed, acceleration, instantaneous, force, and net force [C]'
      - code: B2.2
        text: plan and conduct investigations to measure distance and speed for objects moving in one
          dimension in uniform motion [IP, PR]
      - code: B2.3
        text: plan and conduct investigations to measure constant acceleration for objects moving in one
          dimension [IP, PR]
      - code: B2.4
        text: draw distance–time graphs, and use the graphs to calculate average speed and instantaneous
          speed of objects moving in one dimension [PR, AI, C]
      - code: B2.5
        text: draw speed–time graphs, and use the graphs to calculate average acceleration and distance
          of objects moving in one dimension [PR, AI, C]
      - code: B2.6
        text: solve simple problems involving one-dimensional average speed (vav), distance (Δd), and
          elapsed time (Δt), using the algebraic equation vav = Δd/Δt [AI]
      - code: B2.7
        text: solve simple problems involving one-dimensional average acceleration (aav), change in speed
          (Δv), and elapsed time (Δt) using the algebraic equation aav = Δv/Δt [AI]
      - code: B2.8
        text: plan and conduct an inquiry to determine the relationship between the net force acting on
          an object and its acceleration in one dimension [IP, PR, AI]
      - code: B2.9
        text: analyse, in quantitative terms, the forces acting on an object, and use free-body diagrams
          to determine net force and acceleration of the object in one dimension [AI, C]
      - code: B2.10
        text: conduct an inquiry to measure gravitational acceleration, and calculate the percentage error
          of the experimental value [PR, AI, C]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of different kinds of motion and
        the relationships between speed, acceleration, displacement, and distance'
      specific:
      - code: B3.1
        text: distinguish between constant, instantaneous, and average speed, and give examples of each
          involving uniform and non-uniform motion
      - code: B3.2
        text: describe the relationship between one-dimensional average speed (vav), distance (Δd), and
          elapsed time (Δt)
      - code: B3.3
        text: describe, in quantitative terms, the relationship between one-dimensional average acceleration
          (aav), change in speed (Δv), and elapsed time (Δt)
      - code: B3.4
        text: state Newton’s laws, and apply them qualitatively and quantitatively to explain the motion
          of an object in one dimension
      - code: B3.5
        text: explain the relationship between the acceleration of an object and the net unbalanced force
          acting on that object
  - code: C
    title: Mechanical Systems
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse common mechanical systems
        that use friction and applied forces, and evaluate their effectiveness in meeting social or environmental
        challenges'
      specific:
      - code: C1.1
        text: analyse advantages and disadvantages of friction within mechanical systems in real-world
          situations, as well as methods used to increase or reduce friction in these systems (e.g., advantages
          of, and methods for increasing, friction on the surface of car tires and the soles of hiking
          boots; disadvantages of, and methods for reducing, friction between moving parts of artificial
          joints) [AI, C]
      - code: C1.2
        text: evaluate, on the basis of research, the effectiveness of a common mechanical system in addressing
          a social or environmental challenge (e.g., prosthetic devices, bathtub lifts, high-efficiency
          heating and cooling systems) [IP, PR, AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate forces, torque, work, coefficients
        of friction, simple machines, and mechanical advantage, and interpret related data'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to mechanical systems, including, but not limited to:
          coefficients of friction, torque, mechanical advantage, work input, and work output [C]'
      - code: C2.2
        text: analyse, in qualitative and quantitative terms, the forces (e.g., gravitational, frictional,
          and normal forces; tension) acting on an object in one dimension, and describe the resulting
          motion of the object [AI, C]
      - code: C2.3
        text: use an inquiry process to determine the factors affecting static and kinetic friction, and
          to determine the corresponding coefficient of friction between an everyday object and the surface
          with which it is in contact [PR, AI]
      - code: C2.4
        text: use an inquiry process to determine the relationships between force, distance, and torque
          for the load arm and effort arm of levers [IP, PR, AI]
      - code: C2.5
        text: solve problems involving torque, force, load-arm length, and effort-arm length as they relate
          to the three classes of levers [AI]
      - code: C2.6
        text: investigate, in quantitative terms, common machines (e.g., a bicycle, a can opener, a piano)
          with respect to input and output forces and mechanical advantage [PR]
      - code: C2.7
        text: construct a simple or compound machine, and determine its mechanical advantage (e.g., a
          pulley, a mobile, a can crusher, a trebuchet) [PR, AI]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of concepts related to forces
        and mechanical advantage in relation to mechanical systems'
      specific:
      - code: C3.1
        text: identify and describe, in quantitative and qualitative terms, applications of various types
          of simple machines (e.g., wedges, screws, levers, pulleys, gears, wheels and axles)
      - code: C3.2
        text: explain the operation and mechanical advantage of compound machines and biomechanical systems
          (e.g., block-and-tackle, winch, chain-and-sprocket systems; the human leg, arm)
      - code: C3.3
        text: explain, with reference to force and displacement, the conditions necessary for work to
          be done
      - code: C3.4
        text: explain the concept of mechanical advantage
  - code: D
    title: Electricity and Magnetism
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the development of
        selected electrical and electromagnetic technologies, and evaluate their impact on society and
        the environment'
      specific:
      - code: D1.1
        text: evaluate, on the basis of research, the impact on society and the environment of the evolution
          of an electrical technology (e.g., electric cars or buses, electric appliances) [IP, PR, AI,
          C]
      - code: D1.2
        text: assess the impact of an electromagnetic technology that is used for the benefit of society
          or the environment (e.g., devices for diagnosing and treating diseases, technologies for treating
          seeds to increase the rate of germination) [AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate real and simulated mixed
        direct current circuits and the nature of magnetism and electromagnetism, and analyse related
        data'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to electricity and magnetism, including, but not limited
          to: direct current, alternating current, electrical potential difference, resistance, power,
          energy, permanent magnet, electromagnet, magnetic field, motor principle, and electric motor
          [C]'
      - code: D2.2
        text: construct real and simulated mixed direct current (DC) circuits (i.e., parallel, series,
          and mixed circuits), and analyse them in quantitative terms to test Kirchhoff’s laws [PR, AI]
      - code: D2.3
        text: analyse, in quantitative terms, real or simulated DC circuits and circuit diagrams, using
          Ohm’s law and Kirchhoff’s laws [AI]
      - code: D2.4
        text: conduct an inquiry to determine the magnetic fields produced by a permanent magnet, a straight
          current-carrying conductor, and a solenoid, and illustrate their findings [PR, AI, C]
      - code: D2.5
        text: conduct an inquiry to determine the direction of the magnetic field of a straight current-carrying
          conductor or solenoid [PR, AI]
      - code: D2.6
        text: conduct an inquiry to determine the direction of the forces on a straight current-carrying
          conductor that is placed in a uniform magnetic field [PR, AI]
      - code: D2.7
        text: construct, or deconstruct and explain the components of, a basic electric device (e.g.,
          a DC motor, a water-level detector) [PR, C]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the basic principles of electricity
        and magnetism'
      specific:
      - code: D3.1
        text: compare and contrast the behaviour and functions of series, parallel, and mixed DC circuits
      - code: D3.2
        text: state Kirchhoff’s laws and Ohm’s law, and use them to explain, in quantitative terms, direct
          current, potential difference, and resistance in mixed circuit diagrams
      - code: D3.3
        text: identify and explain safety precautions related to electrical circuits in the school, home,
          and workplace (e.g., the importance of turning off the current before performing electrical
          repairs; the reasons for grounding circuits; how to safely replace spent fuses; the use of double
          insulated tools and appliance circuit breakers)
      - code: D3.4
        text: describe, with the aid of an illustration, the magnetic field produced by permanent magnets
          (bar and U-shaped) and electromagnets (straight conductor and solenoid)
      - code: D3.5
        text: explain the law of magnetic poles
      - code: D3.6
        text: distinguish between conventional current and electron flow
      - code: D3.7
        text: state Oersted’s principle, and apply the right-hand rule to explain the direction of the
          magnetic field produced when electric current flows through a long, straight conductor and through
          a solenoid
      - code: D3.8
        text: state the motor principle, and use the right-hand rule to explain the direction of the force
          experienced by a conductor
      - code: D3.9
        text: explain, using diagrams, the components and operation of a DC electric motor
      - code: D3.10
        text: compare and contrast direct current and alternating current (AC) in qualitative terms (e.g.,
          the difference between DC and AC motors), and describe situations in which each is used
  - code: E
    title: Energy Transformations
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the impact on society
        and the environment of energy-transformation technologies, and propose ways to improve the sustainability
        of one such technology'
      specific:
      - code: E1.1
        text: analyse an energy-transformation technology (e.g., wind turbines, refrigerators, telephones,
          steam engines, coal-fired electrical plants), and evaluate its impact on society and the environment
          [AI, C]
      - code: E1.2
        text: propose a course of practical action to improve the sustainability of an energy-transformation
          technology (e.g., solar panels, internal combustion engines, fuel cells, air conditioners) [PR,
          AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate energy transformations
        and the law of conservation of energy, and solve related problems'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to energy and energy transformations, including, but
          not limited to: work, gravitational potential energy, kinetic energy, chemical energy, energy
          transformations, and efficiency [C]'
      - code: E2.2
        text: use the law of conservation of energy to solve problems involving gravitational potential
          energy, kinetic energy, and thermal energy [AI]
      - code: E2.3
        text: construct a simple device that makes use of energy transformations (e.g., a pendulum, a
          roller coaster), and use it to investigate transformations between gravitational potential energy
          and kinetic energy [PR]
      - code: E2.4
        text: design and construct a complex device that integrates energy transformations (e.g., a mouse-trap
          vehicle, an “egg-drop” container, a wind turbine), and analyse its operation in qualitative
          and quantitative terms [IP, PR, AI]
      - code: E2.5
        text: investigate a simple energy transformation (e.g., the use of an elastic band to propel a
          miniature car), explain the power and output, and calculate the energy [PR, AI, C]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of diverse forms of energy, energy
        transformations, and efficiency'
      specific:
      - code: E3.1
        text: describe and compare various types of energy and energy transformations (e.g., transformations
          related to kinetic, sound, electric, chemical, potential, mechanical, nuclear, and thermal energy)
      - code: E3.2
        text: explain the energy transformations in a system (e.g., a toy, an amusement park ride, a skydiver
          suspended from a parachute), using principles related to kinetic energy, gravitational potential
          energy, conservation of energy, and efficiency
      - code: E3.3
        text: describe, with the aid of diagrams, the operation of selected energy-transformation technologies
          (e.g., wind turbines, photoelectric cells, heat engines)
      - code: E3.4
        text: compare the efficiency of various systems that produce electricity (e.g., wind farms, hydroelectric
          generators, solar panels), using the law of conservation of energy, and outlining the transformations,
          transmissions, and energy losses involved
      - code: E3.5
        text: describe a variety of renewable and non- renewable sources of energy (e.g., solar energy,
          fossil fuels, hydroelectric energy, energy generated from biomass), and identify the strengths
          and weaknesses of each
  - code: F
    title: Hydraulic and Pneumatic Systems
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the development of
        technological applications related to hydraulic and pneumatic systems, and assess some of the
        social and environmental effects of these systems'
      specific:
      - code: F1.1
        text: research the historical development of a pneumatic or hydraulic system used in a specific
          technology (e.g., the hydraulic system in aircraft or other vehicles or in precision machining;
          the pneumatic system in an air motor or robotics), analyse the original design, and determine
          why the technology was developed and how it has been improved [IP, PR, AI, C]
      - code: F1.2
        text: analyse some of the social and economic consequences of the use of robotic systems for different
          kinds of operations (e.g., in the manufacturing of computers, for lifting and manoeuvring heavy
          objects on assembly lines, for handling hazardous materials, for activities under water and
          in space) [AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate fluid statics, fluid dynamics,
        and simple hydraulic and pneumatic systems'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to hydraulic and pneumatic systems, including, but
          not limited to: density, atmospheric pressure, absolute pressure, laminar flow, turbulent flow,
          static pressure, pressure, volume, and flow rate [C]'
      - code: F2.2
        text: draw simple hydraulic or pneumatic circuits [C]
      - code: F2.3
        text: use an inquiry process to determine factors that affect the static pressure head in fluids,
          compare theoretical and empirical values, and account for discrepancies [IP, PR, AI]
      - code: F2.4
        text: conduct a laboratory inquiry or computer simulation to demonstrate Pascal’s principle [PR]
      - code: F2.5
        text: use an inquiry process to determine the relationships between force, area, pressure, volume,
          and time in a hydraulic or pneumatic system (e.g., a hydraulic bottle rocket, a two-cylinder
          circuit using small plastic syringes filled with air or water) [IP, PR, AI]
      - code: F2.6
        text: solve problems related to the relationships between force, area, pressure, volume, and time
          in hydraulic and pneumatic systems (e.g., the force exerted on the wheel of a motor vehicle
          by the hydraulically operated brake pad; the time required for a robotic system to complete
          one cycle of operation) [AI]
      - code: F2.7
        text: design and construct a hydraulic or pneumatic system (e.g., a braking system for a car,
          a clamping device, a model of a crane), solving problems as they arise, and evaluate the system
          with respect to mechanical advantage and efficiency [IP, PR, AI]
      - code: F2.8
        text: conduct an inquiry to demonstrate Bernoulli’s principle (e.g., using a wind tunnel or Venturi
          tube, suspending a table tennis ball in an air current, blowing between pieces of paper) [PR]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the scientific principles related
        to fluid statics, fluid dynamics, and hydraulic and pneumatic systems'
      specific:
      - code: F3.1
        text: identify factors affecting static pressure head (e.g., variations in Earth’s atmosphere),
          analyse static pressure head in quantitative terms, and explain its effects in liquids and gases
      - code: F3.2
        text: state Pascal’s principle, and explain its applications in the transmission of forces in
          fluid systems
      - code: F3.3
        text: describe common components used in hydraulic and pneumatic systems (e.g., cylinders, valves,
          motors, fluids, hoses, connectors, pumps, reservoirs), and explain their function
      - code: F3.4
        text: describe factors affecting laminar flow, and explain how the design of an item or organism
          (e.g., cars, boats, planes, turbine blades, propellers, golf balls, swimsuits, sharks) responds
          to these factors
      - code: F3.5
        text: state Bernoulli’s principle, and explain some of its applications (e.g., spray atomizers,
          propellers, spoilers on racing cars, turbine blades in jet engines)
- course: SES4U
  title: Earth and Space Science, Grade 12, University Preparation
  grade: 12
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate relevant scientific questions about observed relationships, ideas, problems, or
          issues, make informed predictions, and/or formulate educated hypotheses to focus inquiries or
          research
      - code: A1.2
        text: select appropriate instruments (e.g., hand lens, spectrographs, rock hammers) and materials
          (e.g., star charts, geological maps, mineral identification kits), and identify appropriate
          methods, techniques, and procedures, for each inquiry
      - code: A1.3
        text: identify and locate a variety of print and electronic sources that enable them to address
          research topics fully and appropriately
      - code: A1.4
        text: apply knowledge and understanding of safe laboratory and field work practices and procedures
          when planning investigations by correctly interpreting Workplace Hazardous Materials Information
          System (WHMIS) symbols; by using appropriate techniques for handling and storing laboratory
          equipment and materials and disposing of laboratory materials (e.g., following safety procedures
          when collecting samples; using materials safely when identifying minerals and rocks); and by
          using appropriate personal protection (e.g., wearing safety goggles when testing rock or mineral
          samples; using proper protective eyewear when observing the sun)
      - code: A1.5
        text: conduct inquiries, controlling relevant variables, and adapting or extending procedures
          as required, and using appropriate materials and equipment safely, accurately, and effectively,
          to collect observations and data
      - code: A1.6
        text: compile accurate observations and data from laboratory and other sources (e.g., field work),
          and organize and record the data, using appropriate formats, including tables, flow charts,
          graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from a variety of appropriate
          sources, including electronic, print, and/or human sources (e.g., personal communication), using
          suitable formats and an accepted form of academic documentation
      - code: A1.8
        text: synthesize, analyse, interpret, and evaluate qualitative and/or quantitative data to determine
          whether the evidence supports or refutes the initial prediction or hypothesis and whether it
          is consistent with scientific theory; identify sources of bias and/or error; and suggest improvements
          to the inquiry to reduce the likelihood of error
      - code: A1.9
        text: analyse the information gathered from research sources for logic, accuracy, reliability,
          adequacy, and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
          with reference to scientific knowledge
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric (e.g., SI and imperial units), symbolic, and graphic modes of representation
          (e.g., use appropriate time scales when representing geological time, or appropriate units to
          represent astronomical distances)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places or significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers and Canadian contributions related to the
        fields of science under study'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the field of science under study (e.g.,
          astronomer, paleontologist, astrophysicist, geologist, professor, planetarium curator) and the
          education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadian scientists (e.g., Alice Wilson,
          George M. Dawson, Thomas Edvard Krogh, William E. Logan, Richard Bond, Helen Sawyer Hogg, Joseph
          B. Tyrrell), to the fields under study
  - code: B
    title: Astronomy (Science of the Universe)
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the development of
        technologies that have contributed to our understanding of the universe, and evaluate the impact
        of milestones in astronomical theory or knowledge on the scientific community'
      specific:
      - code: B1.1
        text: analyse a major milestone in astronomical knowledge or theory (e.g., the discovery of the
          red shift in the spectra of galaxies; the knowledge gathered from the particle accelerator experiments
          at CERN in Switzerland), and explain how it revolutionized thinking in the scientific community
          [AI, C]
      - code: B1.2
        text: analyse why and how a particular technology related to astronomical research was developed
          and how it has been improved over time (e.g., the evolution from optical to radio telescopes
          and to the Hubble telescope) [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate and analyse the properties
        of the universe, particularly the evolution and properties of stars, in both qualitative and quantitative
        terms'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to astronomy, including, but not limited to: Doppler
          effect, electromagnetic radiation, protostar, celestial equator, ecliptic, altitude and azimuth,
          and right ascension and declination [C]'
      - code: B2.2
        text: locate observable features of the night sky using star charts, computer models, or direct
          observation, and record the location of these features using astronomical terms (e.g., celestial
          equator, ecliptic) and systems (e.g., altitude and azimuth, right ascension and declination)
          [PR, C]
      - code: B2.3
        text: analyse spectroscopic data mathematically or graphically to determine various properties
          of stars (e.g., determine surface temperature from peak wavelength using Wein’s law; predict
          chemical composition from spectral absorption lines; determine motion using the Doppler effect)
          [AI, C]
      - code: B2.4
        text: use the Hertzsprung-Russell diagram to determine the interrelationships between the properties
          of stars (e.g., between mass and luminosity, between colour and luminosity) and to investigate
          their evolutionary pathways [PR, AI]
      - code: B2.5
        text: investigate, in quantitative terms, properties of stars, including their distance from Earth
          (using the parallax method), surface temperature, absolute magnitude, and luminosity [PR, AI]
      - code: B2.6
        text: investigate, using photographs or diagrams, the basic features of different types of galaxies
          (e.g., elliptical, spiral, barred spiral, irregular, peculiar), including the Milky Way [PR]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the origin and evolution of
        the universe, the principal characteristics of its components, and techniques used to study those
        components'
      specific:
      - code: B3.1
        text: describe the theoretical and evidential underpinnings of the big bang theory (e.g., the
          theory that cosmic microwave background radiation is an echo of the big bang; physical evidence
          of the mass of the universe, and the relationship between mass and gravity) and their implications
          for the evolution of the universe
      - code: B3.2
        text: explain the scale of distances between celestial bodies (e.g., with reference to astronomical
          units, light years, and parsecs) and the methods astronomers use to determine these distances
          (e.g., stellar parallax, cepheid variables)
      - code: B3.3
        text: describe the characteristics of electromagnetic radiation (e.g., the relationship between
          wavelength, frequency, and energy) and the ways in which each region of the electromagnetic
          spectrum is used in making astronomical observations (e.g., X-rays in the search for black holes;
          infrared radiation to see through interstellar dust)
      - code: B3.4
        text: explain how stars are classified on the basis of their surface temperature, luminosity,
          and chemical composition
      - code: B3.5
        text: explain, with reference to a specific star (e.g., Rigel, Sirius, Arcturus), how astronomers
          use techniques to determine the properties of stars (e.g., mass, diameter, magnitude, temperature,
          luminosity)
      - code: B3.6
        text: describe the sequence of events in the life cycle of a star, from its formation to the main
          sequence phase and beyond, with specific reference to energy sources and forces involved
      - code: B3.7
        text: explain the relationship between the type of death of a star and the star’s initial mass
          (e.g., a star with a low mass will form a planetary nebula and a white dwarf)
  - code: C
    title: Planetary Science (Science of the Solar System)
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse political, economic,
        and environmental issues related to the exploration and study of the solar system, and how technology
        used in space exploration can be used in other areas of endeavour'
      specific:
      - code: C1.1
        text: analyse political considerations related to, and economic and environmental consequences
          (actual and/or potential) of, exploration of the solar system (e.g., political pressures underlying
          the original Space Race; the ability to monitor environmental conditions from space) [AI, C]
      - code: C1.2
        text: analyse, on the basis of research, a specific technology that is used in space exploration
          and that has applications in other areas of research or in the environmental sector (e.g., Canadian
          satellites and robotics, spacecraft technologies, ground base and orbital telescopes, devices
          to mitigate the effects of the space environment on living organisms), and communicate their
          findings [IP, PR, AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate features of and interactions
        between bodies in the solar system, and the impact of these features and interactions on the existence
        of life'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to planetary science, including, but not limited to:
          solar system, geocentric, heliocentric, geodesy, geosynchronous, eccentricity, apogee, aphelion,
          perigee, and perihelion [C]'
      - code: C2.2
        text: identify geological features and processes that are common to Earth and other bodies in
          the solar system (e.g., craters, faults, volcanic eruptions), and create a model or illustration
          to show these features, using data and images from satellites and space probes [PR, AI, C]
      - code: C2.3
        text: use an inquiry or research process to investigate the effects of various forms of radiation
          and high-energy particles on bodies, organisms, and devices within the solar system (e.g., the
          effects of cosmic rays on atmospheric phenomena, of ultraviolet light on human and animal eyes
          and skin, of solar wind on radio communications) [IP, PR]
      - code: C2.4
        text: investigate the ways in which interactions between solid bodies have helped to shape the
          solar system, including Earth (e.g., the accretion of minor bodies, the formation of moons,
          the formation of planetary rings) [PR]
      - code: C2.5
        text: investigate the properties of Earth that protect life from hazards such as radiation and
          collision with other bodies (e.g., Earth’s orbital position helps protect it from asteroids,
          some of which are deflected by the Jovian planets; Earth’s magnetic field protects the planet
          from solar wind; atmospheric ozone minimizes incoming ultraviolet radiation) [PR]
      - code: C2.6
        text: investigate techniques used to study and understand objects in the solar system (e.g., the
          measurement of gravitational pull on space probes to determine the mass of an object, the use
          of spectroscopy to study atmospheric compositions, the use of the global positioning system
          to track plate movement and tectonic activity from space) [PR]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the internal (geological) processes
        and external (cosmic) influences operating on bodies in the solar system.'
      specific:
      - code: C3.1
        text: explain the composition of the solar system (e.g., the sun, terrestrial inner planets, the
          asteroid belt, gas giant outer planets, the Kuiper belt, the scattered disc, the heliopause,
          the Oort cloud), and describe the characteristics of each component
      - code: C3.2
        text: identify and explain the classes of objects orbiting the sun (e.g., planets, dwarf planets,
          small solar system bodies [SSSBs])
      - code: C3.3
        text: explain the formation of the solar system with reference to the fundamental forces and processes
          involved (e.g., how gravitational force led to the contraction of the original solar nebula)
      - code: C3.4
        text: identify the factors that determined the properties of bodies in the solar system (e.g.,
          differences in distance from the sun result in temperature variations that determine whether
          substances on a planet, moon, or other body are solid or gaseous)
      - code: C3.5
        text: identify and explain the properties of celestial bodies within or beyond the solar system,
          other than Earth, that might support the existence of life (e.g., the possible existence of
          liquid water on Europa; the proximity of a body to its host star)
      - code: C3.6
        text: compare Earth with other objects in the solar system with respect to properties such as
          mass, size, composition, rotation, magnetic field, and gravitational field
      - code: C3.7
        text: identify Kepler’s laws, and use them to describe planetary motions (e.g., the shape of their
          orbits; differences in their orbital velocity)
      - code: C3.8
        text: identify Newton’s laws, and use them to explain planetary motion
      - code: C3.9
        text: describe the major external processes and phenomena that affect Earth (e.g., radiation and
          particles from the “quiet” and “active” sun; cosmic rays; gravity of the sun and moon; asteroidal
          and cometary debris, including their force, energy, and matter)
  - code: D
    title: Recording Earth’s Geological History
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: analyse, with reference to
        geological records, the relationship between climate, geology, and life on Earth, and evaluate
        contributions to our understanding of changes in Earth systems over geological time'
      specific:
      - code: D1.1
        text: analyse the relationship between climate and geology, and, using geological records, assess
          the impact of long-term climate change on life on Earth [AI, C]
      - code: D1.2
        text: evaluate the significance of contributions, including Canadian contributions, to our understanding
          of geological time and of changes in Earth systems over time (e.g., the contributions of Raymond
          A. Price; the Canadian contribution to the development of Landsat) [AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate geological evidence of
        major changes that have occurred during Earth’s history, and of the various processes that have
        contributed to these changes'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to Earth and its geological history, including, but
          not limited to: Milankovitch cycles, era, epoch, period, parent isotope, hot spot, paleomagnetism,
          and index fossil [C]'
      - code: D2.2
        text: use a research process to investigate the geological history of an area in Ontario (e.g.,
          use a sequence diagram, geological maps showing main geological units or associated rock types,
          and/or surficial/bedrock geology maps to investigate the Oak Ridges Moraine or Niagara Escarpment)
          [IP, PR]
      - code: D2.3
        text: investigate various types of preserved geological evidence of major changes that have taken
          place in Earth history (e.g., fossil evidence of mass extinctions, topographic evidence of past
          glaciations, evidence of plate movement in igneous rocks with magnetic reversals) [PR]
      - code: D2.4
        text: produce a model or diagram to illustrate how geological time scales compare to human time
          scales (e.g., major events in Earth’s geological history or the geological history of their
          region compared to major events in human history or students’ own lifespans) [PR, C]
      - code: D2.5
        text: produce diagrams to illustrate the development of various types of unconformities preserved
          in a sequence of strata (e.g., angular unconformity, disconformity, nonconformity) [PR, C]
      - code: D2.6
        text: design and build a model to represent radioactive decay and the concept of half-life determination
          [IP, PR]
      - code: D2.7
        text: investigate interactions over time between physical, chemical, and biological processes,
          and explain how they have affected environmental conditions throughout Earth’s geological history
          (e.g., the impact of increasing amounts of atmospheric oxygen on stromatolites; the impact of
          increasing amounts of atmospheric carbon dioxide on global warming; the influence of plants
          on the water cycle, other life forms, the atmosphere, weathering, and erosion) [PR, AI, C]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of how changes to Earth’s surface
        have been recorded and preserved throughout geological time and how they contribute to our knowledge
        of Earth’s history'
      specific:
      - code: D3.1
        text: describe evidence for the evolution of life through the Proterozoic, Paleozoic, Mesozoic,
          and Cenozoic eras, using important groups of fossils that date from each era (e.g., stromatolites,
          trilobites, brachiopods, crinoids, fish, angiosperms, gymnosperms, dinosaurs, mammals)
      - code: D3.2
        text: describe various kinds of evidence that life forms, climate, continental positions, and
          Earth’s crust have changed over time (e.g., evidence of mass extinction, of past glaciations,
          of the existence of Pangaea and Gondwanaland)
      - code: D3.3
        text: describe some processes by which fossils are produced and/or preserved (e.g., original preservation,
          carbonization, replacement, permineralization, mould and cast formations)
      - code: D3.4
        text: compare and contrast relative and absolute dating principles and techniques as they apply
          to natural systems (e.g., the law of superposition; the law of cross-cutting relationships;
          varve counts; carbon-14 or uranium-lead dating)
      - code: D3.5
        text: identify and describe the various methods of isotopic age determination, giving for each
          the name of the isotope, its half-life, its effective dating range, and some of the materials
          that it can be used to date (e.g., uranium-lead dating of rocks; carbon dating of organic materials)
      - code: D3.6
        text: explain the influence of paradigm shifts (e.g., from uniformitarianism to catastrophism)
          in the development of geological thinking
      - code: D3.7
        text: explain the different types of evidence used to determine the age of Earth (e.g., index
          fossils; evidence provided by radiometric dating of geological materials or lithostratigraphy)
          and how this evidence has influenced our understanding of the age of the planet
  - code: E
    title: Earth Materials
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: analyse technologies used to
        explore for and extract Earth materials, and assess the economic and environmental impact of the
        exploitation of such materials'
      specific:
      - code: E1.1
        text: assess the direct and indirect impact on local, provincial/regional, or national economies
          of the exploration for and extraction and refinement/processing of Earth materials (e.g., gold,
          uranium, sand, gravel, dimension stone, fossil fuels) [AI, C]
      - code: E1.2
        text: analyse technologies and techniques used to explore for and extract natural resources, and
          assess their actual or potential environmental repercussions [AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate the properties of minerals
        and characteristics of rocks, including those in their local area'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to Earth materials, including, but not limited to:
          geothermal vents, porosity, permeability, cleavage, fracture, cementation, evaporite, and foliation
          [C]'
      - code: E2.2
        text: investigate the properties of various Earth materials (e.g., density, conductivity, porosity;
          whether they are magnetic or radioactive), and explain how these properties affect how the materials
          are used and what technologies and techniques are used to explore for or extract them (e.g.,
          radiometric instruments, electromagnetic or gravity surveys) [PR, AI, C]
      - code: E2.3
        text: conduct a series of tests (e.g., hardness, streak, density) to identify and classify common
          minerals (e.g., quartz, calcite, potassium feldspar, plagioclase feldspar, muscovite, biotite,
          talc, graphite, hornblende) [PR, AI]
      - code: E2.4
        text: investigate common igneous rocks (e.g., granite, obsidian, andesite, basalt, gabbro), using
          a hand lens, classify them on the basis of their texture (e.g., porphyritic, phaneritic, aphanitic)
          and composition (e.g., acid, intermediate, basic), and use this information to determine their
          origins (i.e., extrusive or intrusive) [PR, AI]
      - code: E2.5
        text: investigate sedimentary rocks (e.g., conglomerate, breccia, sandstone, shale, limestone,
          dolostone, chert, gypsum, rock salt, coal), using a hand lens, classify them on the basis of
          their texture (e.g., coarse-or fine-grained, detrital) and composition (e.g., clastic, chemical,
          fossil inclusions), and use this information to determine their origin (e.g., clastic, chemical)
          [PR, AI]
      - code: E2.6
        text: investigate metamorphic rocks (e.g., slate, phyllite, schist, gneiss, quartzite, marble),
          using a hand lens, and classify them on the basis of their characteristics (e.g., foliation,
          crystallinity) in order to identify their parent rock and the temperature, pressure, and chemical
          conditions at their formation [PR, AI]
      - code: E2.7
        text: investigate a geological setting in their local area (e.g., a river/stream bed or lakeshore;
          a rock outcrop), and identify and classify rock samples collected from that area [PR, AI]
      - code: E2.8
        text: plan and conduct an inquiry to investigate the factors that determine the size and form
          of mineral crystals (e.g., the temperature of the solution, the type of salt, the level of saturation,
          the temperature of slides containing melted salol) [IP, PR]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the properties of minerals
        and the formation and characteristics of rocks'
      specific:
      - code: E3.1
        text: identify the physical and chemical properties of selected minerals, and describe the tests
          used to determine these properties
      - code: E3.2
        text: describe the formation (i.e., intrusive or extrusive) and identify the distinguishing characteristics
          of igneous rocks (e.g., composition and eruption type; mineralogical content indicating the
          type of volcano in which a rock was formed)
      - code: E3.3
        text: describe the formation of clastic and chemical sediments, and the characteristics of the
          corresponding sedimentary rocks (e.g., shape and size of particles, nature of their deposition)
      - code: E3.4
        text: describe the different ways in which metamorphic rocks are formed (i.e., through changes
          in temperature, pressure, and chemical conditions) and the factors that contribute to their
          variety (e.g., variation in parent rock; regional or contact metamorphism)
      - code: E3.5
        text: describe the role of Earth materials in the safe disposal of industrial and urban waste
          and toxic materials (e.g., the low permeability of clays makes them suitable material for barriers
          in waste disposal sites)
  - code: F
    title: Geological Processes
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: analyse technological developments
        that have increased our knowledge of geological processes and structures, and how this knowledge
        assists in monitoring and managing these processes and structures'
      specific:
      - code: F1.1
        text: evaluate the accuracy and reliability of technological methods of monitoring and predicting
          earthquakes, tsunamis, and volcanic eruptions [AI, C]
      - code: F1.2
        text: analyse developments in technology (e.g., sonar, seismology, magnetometers) or Earth science
          endeavours (e.g., Lithoprobe, Geosat, Ocean Drilling Program) that have contributed to our understanding
          of Earth’s interior, crust, and surface [AI, C]
      - code: F1.3
        text: analyse the relationship between human activities and various geological structures and
          processes (e.g., the relationship between the location of deposits and the extraction/use of
          resources; the relationship between urban development and/or building codes and the probability
          of earthquakes or volcanic activity), and propose ways in which the relationships can be effectively
          or sustainably managed [AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate, through the use of models
        and analysis of information gathered from various sources, the nature of internal and surficial
        Earth processes, and the ways in which these processes can be quantified'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to geological processes, including, but not limited
          to: shear forces, compression forces, liquifaction, Benioff zone, aquifer, internal plastic
          flow, basal slip, mid-oceanic ridge, bedding, cross-cutting, isostasy, and lithification [C]'
      - code: F2.2
        text: investigate the difference between weathering and erosion (e.g., weathering occurs when
          the edge of a riverbank disintegrates from the force of the water; erosion occurs when the water
          transports the soil downstream), and construct models of the processes of physical, chemical,
          and biological weathering (e.g., tap water dripping on a bar of soap; vinegar dripping on a
          marble chip; dried beans soaking in a sealed plastic jar) [PR]
      - code: F2.3
        text: produce a model showing simple sedimentary sequences (e.g., successive layering, sorted
          sequences), using block diagrams or three-dimensional models (e.g., layering as sand settles
          in an aquarium) [PR, C]
      - code: F2.4
        text: investigate, through laboratory inquiry or computer simulation, the main types of seismic
          waves, and produce a model (e.g., using 3D block diagrams or springs and ropes) to illustrate
          for each the nature of its propagation, the transfer of energy, and its movement through rocks
          [PR, C]
      - code: F2.5
        text: locate the epicentre of an earthquake, given the appropriate seismographic data (e.g., the
          travel-time curves to three recording stations for a single event) [AI]
      - code: F2.6
        text: produce a scale model (e.g., a 3D block diagram) of the interior of Earth, differentiating
          between the layers and their characteristics (e.g., label cross-sections with the dimensions
          of the crust, mantle, and inner and outer core, and add travel-time curves for various seismic
          waves to provide data on the characteristics of the individual layers) [PR, C]
      - code: F2.7
        text: design and test models that show the types (i.e., falls, slides, or flows) and causes (e.g.,
          effect of gravity [angle of repose], water content, earthquakes) of mass wasting [IP, PR, AI]
      - code: F2.8
        text: analyse information from a plan view (e.g., topographic map, air photo, geologic map) and
          sectional view (e.g., cross section, block diagram) in order to deduce the geologic history
          of an area [AI]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the processes at work within
        Earth and on its surface, and the role of these processes in shaping Earth’s surface'
      specific:
      - code: F3.1
        text: describe the types of boundaries (convergent, divergent, transform) between lithospheric
          plates, and explain the types of internal Earth processes occurring at each (e.g., subduction,
          divergence, convergence, hot spot activity, folding, faulting)
      - code: F3.2
        text: describe the characteristics of the main types of seismic waves (i.e., P- and S-waves; R-
          and L-waves), and explain the different modes of travel, travel times, and types of motion associated
          with each
      - code: F3.3
        text: compare qualitative and quantitative methods used to measure earthquake intensity and magnitude
          (e.g., the Mercalli Scale, the Richter Scale)
      - code: F3.4
        text: explain how different erosional processes contribute to changing landscapes (e.g., channel
          erosion, mass-wasting events)
      - code: F3.5
        text: identify and describe types of sediment transport (e.g., water, wind, glacial) and the types
          of load (i.e., dissolved load, suspended load, bed load) as sediment is moved by each type of
          transport
      - code: F3.6
        text: describe the landforms produced by water, wind, or ice erosion
      - code: F3.7
        text: describe the sedimentary structures formed by wind, water, or ice deposition
      - code: F3.8
        text: identify major areas of tectonic activity in the world by plotting the location of major
          recorded earthquakes and active volcanoes on a map, and distinguish the areas by type of tectonic
          activity (e.g., Japan – convergent boundary; Iceland – divergent boundary; California – transform
          boundary)
      - code: F3.9
        text: explain the processes of continuous recycling of major rock types (i.e., the rock cycle)
          throughout Earth history
