# AssessApp curriculum pack: The Ontario Curriculum, Grades 9–12: Science
# Version 2026.10.15. Strands, overall and specific expectations in the Ministry's
# own words. Source: The Ontario Curriculum, Grades 9–12: Science (Ministry of Education PDF extract).
# © King's Printer for Ontario. Reproduced for non-commercial educational use.
#
# The app installs this file automatically. To update the curriculum without a
# new version of the app, publish a newer copy (tools/publish_curriculum.py);
# teachers get it with Curriculum > Check for updates, or Install curriculum file.
pack: ontario-science
name: 'The Ontario Curriculum, Grades 9–12: Science'
version: 2026.10.15
source: 'The Ontario Curriculum, Grades 9–12: Science (Ministry of Education PDF extract)'
notes: 'Added from the Ministry curriculum website (missing from the PDF extract): SNC2P A1.3'
courses:
- course: SNC1W
  title: Science, Grade 9, De-streamed
  grade: 9
  strands:
  - code: A
    title: STEM Skills, Careers, and Connections
    overall:
    - code: A1
      text: 'STEM Investigation Skills: apply scientific processes and an engineering design process in
        their investigations to develop a conceptual understanding of the science they are learning, and
        apply coding skills to model scientific concepts and relationships'
      specific:
      - code: A1.1
        text: apply a scientific research process and associated skills to conduct investigations, making
          connections between their research and the scientific concepts they are learning
      - code: A1.2
        text: apply a scientific experimentation process and associated skills to conduct investigations,
          making connections between their observations and findings and the scientific concepts they
          are learning
      - code: A1.3
        text: apply an engineering design process and associated skills to design, build, and test devices,
          models, structures, and/or systems
      - code: A1.4
        text: apply coding skills to investigate and to model scientific concepts and relationships
      - code: A1.5
        text: apply their knowledge and understanding of safe practices and procedures, including the
          Workplace Hazardous Materials Information System (WHMIS), while planning and carrying out hands-on
          investigations
    - code: A2
      text: 'Applications, Careers, and Connections: analyse how scientific concepts and processes can
        be applied in practical ways to address real-world issues and in various careers, and describe
        contributions to science from people with diverse lived experiences'
      specific:
      - code: A2.1
        text: design an experiment or a prototype to explore a problem relevant to a STEM-related occupation,
          such as a skilled trade, using findings from research
      - code: A2.2
        text: describe how scientific innovations and emerging technologies, including artificial intelligence
          systems, impact society and careers
      - code: A2.3
        text: analyse how the development and application of science is economically, culturally, and
          socially contextualized, by investigating real-world issues
      - code: A2.4
        text: apply scientific literacy skills when investigating social and environmental issues that
          have personal, local, and/or global impacts
      - code: A2.5
        text: analyse contributions to science by people from various communities, including communities
          in Canada
  - code: B
    title: 'Biology: Sustainable Ecosystems and Climate Change'
    overall:
    - code: B1
      text: 'Relating Science to Our Changing World: assess impacts of climate change on ecosystem sustainability
        and on various communities, and describe ways to mitigate these impacts'
      specific:
      - code: B1.1
        text: assess impacts of climate change on the sustainability of local and global ecosystems, describe
          local or global initiatives for combatting climate change, and identify solutions to address
          some of the impacts
      - code: B1.2
        text: assess impacts of climate change on communities in Canada, including First Nations, Métis,
          and Inuit communities
      - code: B1.3
        text: investigate and explain how sustainable practices used by various communities, including
          First Nations, Métis, and Inuit communities, reflect an understanding of the importance of the
          dynamic equilibrium of ecosystems
    - code: B2
      text: 'Investigating and Understanding Concepts: demonstrate an understanding of the dynamic and
        interconnected nature of ecosystems, including how matter cycles and energy flows through ecosystems'
      specific:
      - code: B2.1
        text: investigate interactions between the biosphere, hydrosphere, lithosphere, and atmosphere,
          and explain why these interactions are important for ecosystem sustainability
      - code: B2.2
        text: explain how naturally occurring phenomena, including the cycling of matter and the flow
          of energy, contribute to the dynamic equilibrium within and between ecosystems
      - code: B2.3
        text: compare and contrast the processes of cellular respiration and photosynthesis, and explain
          how their complementary relationship contributes to the dynamic equilibrium of ecosystems
      - code: B2.4
        text: investigate factors and processes, including biodiversity, air and water quality, soil health,
          and succession, and explain how they contribute to ecosystem sustainability
      - code: B2.5
        text: explain the effects of various human activities on the dynamic equilibrium of ecosystems
      - code: B2.6
        text: identify and use various indicators of climate change to describe the impacts of climate
          change on local and global ecosystems, and analyse how human activities contribute to climate
          change
      - code: B2.7
        text: explain how sustainable practices related to the cycling of matter and the flow of energy
          can be applied in agricultural innovations
  - code: C
    title: 'Chemistry: The Nature of Matter'
    overall:
    - code: C1
      text: 'Relating Science to Our Changing World: assess social, environmental, and economic impacts
        of the use of elements, compounds, and associated technologies'
      specific:
      - code: C1.1
        text: assess social, environmental, and economic impacts of processes associated with the life
          cycle of consumer products, considering the elements and compounds used to make them, and suggest
          ways to enhance positive impacts and/or minimize negative impacts
      - code: C1.2
        text: analyse impacts of using emerging chemical technologies in various fields, including in
          the skilled trades, and assess factors that influence the development of these technologies
    - code: C2
      text: 'Investigating and Understanding Concepts: demonstrate an understanding of the nature of matter,
        including the structure of the atom, physical and chemical properties of common elements and compounds,
        and the organization of elements in the periodic table'
      specific:
      - code: C2.1
        text: investigate properties, changes, and interactions of matter that are important for the dynamic
          equilibrium of ecosystems and their sustainability
      - code: C2.2
        text: research the role of experimental evidence in the development of various atomic models,
          and compare and contrast different models of the atom
      - code: C2.3
        text: identify the location, relative mass, and charge of subatomic particles within an atom,
          using the Bohr-Rutherford model
      - code: C2.4
        text: explain the relationship between the position of an element in the periodic table and the
          structure of its atoms, using models
      - code: C2.5
        text: investigate the physical and chemical properties of elements, and use their findings to
          relate these properties to the organization of the periodic table, classify elements, and identify
          patterns in the periodic table
      - code: C2.6
        text: investigate and describe physical and chemical properties of elements and compounds, including
          those that make up common household products
      - code: C2.7
        text: describe the relationship between the structure of simple compounds and their chemical formulas
  - code: D
    title: 'Physics: Principles and Applications of Electricity'
    overall:
    - code: D1
      text: 'Relating Science to Our Changing World: assess social, environmental, and economic impacts
        of electrical energy production and consumption, and describe ways to achieve sustainable practices'
      specific:
      - code: D1.1
        text: assess social, environmental, and economic benefits and challenges resulting from the production
          of electrical energy from various sources
      - code: D1.2
        text: evaluate how electrical energy production and consumption impact various communities locally
          or globally, and describe ways to achieve sustainable practices
      - code: D1.3
        text: develop a plan of action to address a local or global electrical energy production or consumption
          issue, including strategies for energy conservation
      - code: D1.4
        text: analyse social, environmental, and economic impacts of emerging technologies related to
          electrical energy production, consumption, storage, and conservation
    - code: D2
      text: 'Investigating and Understanding Concepts: demonstrate an understanding of the nature of electric
        charges, including properties of static and current electricity'
      specific:
      - code: D2.1
        text: conduct investigations to explain the behaviour of electric charges in static and current
          electricity, and to relate the observed behaviour to the properties of subatomic particles and
          atomic structure
      - code: D2.2
        text: determine the conductivity of various materials by investigating their ability to hold or
          transfer electric charges
      - code: D2.3
        text: identify the components of a direct current (DC) circuit and explain their functions, and
          identify electrical quantities, their symbols, and their corresponding International System
          of Units (SI) units
      - code: D2.4
        text: investigate the relationships between electric current, potential difference, and resistance
          in electrical circuits, and develop a mathematical model to represent the relationships
      - code: D2.5
        text: apply a mathematical model to calculate electric current, potential difference, and resistance
          in real-world situations
      - code: D2.6
        text: construct series and parallel circuits to compare electric current, potential difference,
          and resistance in both types of circuits
      - code: D2.7
        text: explain the difference between electricity and electrical energy
      - code: D2.8
        text: determine the efficiency of various electrical devices that consume or produce electrical
          energy, and identify the energy transformations in each device
  - code: E
    title: 'Earth and Space Science: Space Exploration'
    overall:
    - code: E1
      text: 'Relating Science to Our Changing World: evaluate social, environmental, and economic impacts
        of space exploration and of technological innovations derived from space exploration'
      specific:
      - code: E1.1
        text: evaluate social, environmental, and economic impacts of space observation and exploration
      - code: E1.2
        text: evaluate how space observation and exploration technologies contribute to our understanding
          of climate change, natural disasters, and other phenomena
      - code: E1.3
        text: assess ways in which technological innovations related to space observation and exploration
          are applied in various fields, including their contributions to sustainable practices on Earth
    - code: E2
      text: 'Investigating and Understanding Concepts: demonstrate an understanding of the components,
        characteristics, and associated phenomena of the solar system and the universe, and the importance
        of the Sun to processes on Earth'
      specific:
      - code: E2.1
        text: describe the importance of the Sun and its characteristics, including its role in the solar
          system and in sustaining life on Earth
      - code: E2.2
        text: explain how the Sun’s energy causes natural phenomena on Earth, and how these phenomena
          contribute to renewable energy production
      - code: E2.3
        text: summarize observational evidence used to support theories about the origin and evolution
          of the universe and the solar system, considering diverse ways of knowing
      - code: E2.4
        text: describe major components of the solar system and the universe and compare their characteristics
      - code: E2.5
        text: quantify distances in the solar system and the universe by applying an understanding of
          relative distances and sizes and using appropriate units of measure
      - code: E2.6
        text: conduct investigations to explain the causes of various astronomical phenomena that can
          be observed from Earth
- course: SNC2P
  title: Science, Grade 10, Applied
  grade: 10
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate scientific questions about observed relationships, ideas, problems, and/or issues,
          make predictions, and/or formulate hypotheses to focus inquiries or research
      - code: A1.2
        text: select appropriate instruments (e.g., a microscope, laboratory glassware, an optical bench)
          and materials (e.g., prepared slides, an aquarium, lenses, acid–base indicators) for particular
          inquiries
      - code: A1.3
        text: identify and locate print, electronic, and human sources that are relevant to research questions
      - code: A1.4
        text: apply knowledge and understanding of safe practices and procedures when planning investigations
          (e.g., appropriate techniques for handling, storing, and disposing of laboratory materials [following
          the Workplace Hazardous Materials Information System–WHMIS; safe operation of optical equipment;
          safe handling and disposal of biological materials), with the aid of appropriate support materials
          (e.g., the Reference Manual on the WHMIS website; the Live Safe! Work Smart! website)
      - code: A1.5
        text: conduct inquiries, controlling some variables, adapting or extending procedures as required,
          and using standard equipment and materials safely, accurately, and effectively, to collect observations
          and data
      - code: A1.6
        text: gather data from laboratory and other sources, and organize and record the data using appropriate
          formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from various sources,
          including electronic, print, and/or human sources (e.g., a website for a public health organization,
          federal and provincial government publications, reference books, personal interviews), using
          recommended formats and an accepted form of academic documentation
      - code: A1.8
        text: analyse and interpret qualitative and/or quantitative data to determine whether the evidence
          supports or refutes the initial prediction or hypothesis, identifying possible sources of error,
          bias, or uncertainty
      - code: A1.9
        text: analyse the information gathered from research sources for reliability and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric, symbolic, and graphic modes of representation, and appropriate
          units of measurement (e.g., SI and imperial units)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely
    - code: A2
      text: 'Career Exploration: identify and describe a variety of careers related to the fields of science
        under study, and identify scientists, including Canadians, who have made contributions to those
        fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., veterinarian assistant, quality control technician, conservation officer, sound and light
          technician) and the education and training necessary for these careers
      - code: A2.2
        text: identify scientists, including Canadians (e.g., Maude Abbott, Paul Kebarle, Reginald Fessenden,
          James Hillier), who have made a contribution to the fields of science under study
  - code: B
    title: 'Biology: Tissues, Organs, and Systems'
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: analyse some current technologies
        or substances that have an impact on human tissues, organs, or systems, and evaluate their effects
        on human health'
      specific:
      - code: B1.1
        text: analyse, on the basis of research, medical imaging technologies (e.g., ultrasound, X-rays,
          computerized axial tomography [CT or CAT] scan, magnetic resonance imaging [MRI], microscopy,
          biophotonics) used in Canada to explore, diagnose, or treat the human body, and communicate
          their findings [PR, AI, C]
      - code: B1.2
        text: evaluate the effects that use of or exposure to a technology, substance, or environmental
          factor (e.g., cellphones, X-rays, UV radiation, personal audio players, cigarette smoke, pesticides,
          food additives/preservatives, vitamins, gene therapy) may have on the function of human tissues,
          organs, or systems [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate cell division, cell specialization,
        and the organization of systems in animals, including humans, using various laboratory techniques'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to human cells, tissues, organs, and systems, including,
          but not limited to: absorption, anaphase, capillaries, concentration, differentiation, diffusion,
          interphase, metaphase, osmosis, prophase, red blood cells, regeneration, and telophase [C]'
      - code: B2.2
        text: examine cells under a microscope or similar instrument to identify the various stages of
          mitosis in animals [PR, AI]
      - code: B2.3
        text: investigate, using a microscope or similar instrument, cell specialization in the human
          body, focusing on different types of human cells (e.g., muscle cells, epithelial cells, nerve
          cells), and draw labelled biological diagrams of each type of cell [PR, C]
      - code: B2.4
        text: compare, on the basis of observation (e.g., using pictures, videos, or images), the division
          of cancerous cells and non-cancerous cells, and describe the impact of cancerous cells on the
          human body [PR, AI]
      - code: B2.5
        text: locate, through a laboratory or computer-simulated dissection, the organs of a specific
          system of an animal (e.g., a worm, a frog, a fish), and describe their interrelationship [PR,
          AI, C]
      - code: B2.6
        text: use scientific investigation skills to research health problems related to tissues, organs,
          or systems in humans (e.g., asthma, sickle-cell anemia, heart disease, Crohn’s disease), and
          communicate their findings [IP, PR, C]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the hierarchical organization
        of cells, from tissues, to organs, to systems in animals, including humans'
      specific:
      - code: B3.1
        text: describe the cell cycle in animals, and explain its importance for the growth of cells and
          repair of tissues
      - code: B3.2
        text: describe the structure, function, and importance of specialized cells and tissues in multi-cellular
          organisms (e.g., neurons have many branching dendrites and long axons to receive and transmit
          messages; muscle cells have a higher concentration of mitochondria, which produce energy)
      - code: B3.3
        text: explain cell organization by describing the link between cells, tissues, organs, and systems
          in the human body
      - code: B3.4
        text: explain the general function of some of the systems in the human body (e.g., the function
          of the circulatory system is to transport materials through the body; the function of the digestive
          system is to absorb nutrients; the function of the respiratory system is to bring oxygen into
          and remove carbon dioxide from the body)
      - code: B3.5
        text: describe the interaction of systems in the human body (e.g., the respiratory system brings
          oxygen into the body, and the circulatory system transports the oxygen to cells), and explain
          why these interactions are necessary for survival
  - code: C
    title: 'Chemistry: Chemical Reactions and their Practical Applications'
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse how chemical reactions
        are employed in common products and processes, and assess the safety and environmental hazards
        associated with them'
      specific:
      - code: C1.1
        text: analyse, on the basis of research, the function of chemical reactions in the production
          of selected products and/or in processes commonly encountered at home or in the workplace (e.g.,
          carbonation of soft drinks; rust proofing), and communicate their findings [IP, PR, AI, C]
      - code: C1.2
        text: identify practical applications of chemical reactions in a particular profession (e.g.,
          ceramics, cosmetology, firefighting, heating and cooling system technology, food preparation,
          plumbing, custodial services), and assess the associated hazards, including hazards associated
          with the handling and disposal of chemicals [PR, AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate, through inquiry, the characteristics
        of simple chemical reactions'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to chemical reactions, including, but not limited to:
          antacid, dilute, neutralization, product, reactant, and word equation [C]'
      - code: C2.2
        text: construct molecular models of simple chemical reactions (e.g., C + O2 CO2; 2H2 + O2 2H2O),
          and produce diagrams of these models [PR, C]
      - code: C2.3
        text: conduct and observe inquiries related to simple chemical reactions, including synthesis,
          decomposition, and displacement reactions, and represent them using a variety of formats (e.g.,
          word equations, balanced chemical equations, molecular models) [PR, AI, C]
      - code: C2.4
        text: use an inquiry process to investigate the law of conservation of mass in a chemical reaction
          (e.g., compare the values before and after the reaction), and account for any discrepancies
          [PR, AI]
      - code: C2.5
        text: use an inquiry process to investigate acid–base neutralization reactions (e.g., neutralize
          a dilute solution of sodium hydroxide with dilute hydrochloric acid and extract the sodium chloride
          produced) [PR, AI]
      - code: C2.6
        text: conduct an inquiry to classify some common substances as acidic, basic, or neutral (e.g.,
          use acid– base indicators or pH strips to classify common household substances) [PR, AI]
      - code: C2.7
        text: investigate applications of acid–base reactions in common products and processes (e.g.,
          compare the effectiveness of different brands of antacid tablets, using quantitative analysis)
          [PR, AI]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of simple chemical reactions and
        the language and ways to represent them'
      specific:
      - code: C3.1
        text: describe the relationships between chemical formulae, composition, and names of simple compounds
          (e.g., carbon dioxide, CO2, has one more oxygen atom than carbon monoxide, CO)
      - code: C3.2
        text: name and write the formulae for simple ionic and molecular compounds (e.g., NaCl, NaOH,
          H2O, CO2)
      - code: C3.3
        text: write word equations and balanced chemical equations for simple chemical reactions (e.g.,
          2H2 + O2 2H2O)
      - code: C3.4
        text: describe the process of neutralization for simple acid–base reactions (i.e., an acid reacts
          with a base to form a salt and often water)
      - code: C3.5
        text: describe how the pH scale is used to identify the concentration of acids and bases
  - code: D
    title: 'Earth and Space Science: Earth’s Dynamic Climate'
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: analyse effects of human activity
        on climate change, and effects of climate change on living things and natural systems'
      specific:
      - code: D1.1
        text: analyse, on the basis of research, various ways in which living things and natural systems
          have been affected by climate change (e.g., the effect of loss of permafrost on northern roads
          and housing; the effect of longer growing seasons in some regions on farmers; the effect of
          warming oceans on coral reefs), and communicate their findings [IP, PR, AI, C]
      - code: D1.2
        text: analyse ways in which human actions (e.g., burning fossil fuels, implementing tree-planting
          programs) have increased or decreased the production of greenhouse gases [AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate various natural and human
        factors that have an impact on climate change and global warming'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to Earth’s dynamic climate, including, but not limited
          to: anthropogenic, atmosphere, carbon footprint, carbon sink, climate, greenhouse gases, hydrosphere,
          and weather [C]'
      - code: D2.2
        text: investigate the principles of the natural greenhouse effect, using simulations, diagrams,
          and/or models, and compare these principles to those of an actual greenhouse [PR, AI]
      - code: D2.3
        text: use a research process to investigate a source of greenhouse gases (e.g., decaying garbage,
          animal digestive processes, burning biomass) and its effect on a region of Canada (e.g., melting
          of the polar ice cap in the Arctic, shrinking of glaciers in the Rockies) [IP, PR, AI]
      - code: D2.4
        text: conduct an inquiry to determine how different factors (e.g., an increase in surface temperature,
          an increase in water temperature) affect global warming and climate change [PR]
      - code: D2.5
        text: investigate their personal carbon footprint, using a computer simulation or numerical data
          (e.g., determine carbon emissions that result from their travelling to school, work, and recreation
          venues; from vacation travelling; from buying products imported from distant countries), and
          plan a course of action to reduce their footprint (e.g., a plan to increase their use of bicycles
          or public transit; to eat more local foods) [PR, AI, C]
      - code: D2.6
        text: compare different tools or systems used by scientists to make informed decisions on global
          climate change (e.g., Ecoregions of Canada, bioclimate profiles) [PR, AI]
      - code: D2.7
        text: compare different perspectives and/or biases evident in discussions of climate change in
          scientific and non-scientific media (e.g., with reference to knowledge, beliefs, and/or values)
          [PR, AI]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of various natural and human factors
        that contribute to climate change and global warming'
      specific:
      - code: D3.1
        text: describe the principal components of Earth’s climate system (e.g., the sun, oceans, and
          the atmosphere; the topography and configuration of land masses)
      - code: D3.2
        text: describe the natural greenhouse effect, its importance for life, and the difference between
          it and the anthropogenic greenhouse effect
      - code: D3.3
        text: describe how heat is transferred and stored in both hydrospheric and atmospheric heat sinks
      - code: D3.4
        text: identify different greenhouse gases (e.g., carbon dioxide, methane, water vapour, nitrous
          oxide), and explain how they are produced naturally in the environment
      - code: D3.5
        text: describe methods by which greenhouse gases are produced by humans (e.g., burning of biomass,
          chemical reactions involving pollutants)
      - code: D3.6
        text: identify the natural and human causes of climate change in the world and, in particular,
          how Canada contributes to climate change
      - code: D3.7
        text: 'identify indicators of global climate change (e.g., changes in: the mass of glacial and
          polar ice, sea levels, wind patterns, global carbon budget assessments, migratory patterns of
          birds)'
  - code: E
    title: 'Physics: Light and Applications of Optics'
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: analyse how properties of light
        and colour are applied in technology and the impact of these technologies on society'
      specific:
      - code: E1.1
        text: analyse how additive and/or subtractive colour theory are applied in technologies used in
          everyday life (e.g., stop lights, high-definition television, colour monitors, coloured spotlights)
          [AI, C]
      - code: E1.2
        text: describe the role of selected optical technologies in the transmission of information, and
          analyse their impact on society (e.g., cellphones, optical fibre cables, satellite dishes) [AI,
          C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate, through inquiry, properties
        of light, and predict its behaviour in mirrors and as it passes through different media'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to light and optics, including, but not limited to:
          angle of incidence, angle of reflection, angle of refraction, centre of curvature, focal length,
          luminescence, magnification, principal axis, radius of curvature, and vertex [C]'
      - code: E2.2
        text: use an inquiry process to investigate the laws of reflection; use these laws to explain
          the characteristics of images formed by plane, converging (concave), and diverging (convex)
          mirrors; and draw ray diagrams to illustrate their observations [PR, AI, C]
      - code: E2.3
        text: use an inquiry process to investigate the refraction of light as it passes through a variety
          of media (e.g., the angles of incidence and refraction as light passes through a clear acrylic
          block) [PR]
      - code: E2.4
        text: predict the qualitative characteristics of images (e.g., location, orientation, size, type)
          formed by converging lenses, test their predictions through inquiry, and draw ray diagrams to
          record their observations [IP, PR, AI, C]
      - code: E2.5
        text: investigate how various objects or media (e.g., opaque, translucent, and transparent materials;
          black-and-white surfaces) reflect, transmit, or absorb light, and record their observations
          using ray diagrams [PR, C]
      - code: E2.6
        text: predict the effect of shining a coloured light on objects of different colours, and test
          their predictions through inquiry [IP, PR, AI, C]
      - code: E2.7
        text: construct an optical device (e.g., a funhouse mirror, a device that produces an optical
          illusion, a solar oven) that uses a variety of mirrors [PR]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of characteristics and properties
        of light, particularly with respect to reflection and refraction and the addition and subtraction
        of colour'
      specific:
      - code: E3.1
        text: describe various types of light emissions (e.g., chemiluminescence, bioluminescence, incandescence,
          electric discharge) and how they produce light
      - code: E3.2
        text: identify and label the visible and invisible regions of the electromagnetic spectrum, and
          identify the colours that make up visible white light
      - code: E3.3
        text: explain the laws of reflection of light, and identify ways in which light reflects from
          various types of mirrors (e.g., plane, converging, diverging)
      - code: E3.4
        text: describe qualitatively how visible light is refracted at the interface between two different
          media
      - code: E3.5
        text: use additive colour theory to predict the results of combining primary and secondary light
          colours
      - code: E3.6
        text: use subtractive colour theory to describe the effect of colour filters on white light
      - code: E3.7
        text: explain how the colour of an object is determined by reflection, absorption, and transmission
          of colour
      - code: E3.8
        text: explain how the properties of light or colour are applied in the operation of an optical
          device (e.g., a reflecting telescope, stop lights, stage lights)
- course: SNC2D
  title: Science, Grade 10, Academic
  grade: 10
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate scientific questions about observed relationships, ideas, problems, and/or issues,
          make predictions, and/or formulate hypotheses to focus inquiries or research
      - code: A1.2
        text: select appropriate instruments (e.g., a microscope, laboratory glassware, an optical bench)
          and materials (e.g., prepared slides, an aquarium, lenses, pH paper) for particular inquiries
      - code: A1.3
        text: identify and locate print, electronic, and human sources that are relevant to research questions
      - code: A1.4
        text: apply knowledge and understanding of safe practices and procedures when planning investigations
          (e.g., appropriate techniques for handling, storing, and disposing of laboratory materials [following
          the Workplace Hazardous Materials Information System–WHMIS]; safe operation of optical equipment;
          safe handling and disposal of biological materials), with the aid of appropriate support materials
          (e.g., the Reference Manual on the WHMIS website; the Live Safe! Work Smart! website)
      - code: A1.5
        text: conduct inquiries, controlling some variables, adapting or extending procedures as required,
          and using standard equipment and materials safely, accurately, and effectively, to collect observations
          and data
      - code: A1.6
        text: gather data from laboratory and other sources, and organize and record the data using appropriate
          formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from various sources,
          including electronic, print, and/or human sources (e.g., websites for public health organizations,
          federal and provincial government publications, reference books, personal interviews), using
          recommended formats and an accepted form of academic documentation
      - code: A1.8
        text: analyse and interpret qualitative and/or quantitative data to determine whether the evidence
          supports or refutes the initial prediction or hypothesis, identifying possible sources of error,
          bias, or uncertainty
      - code: A1.9
        text: analyse the information gathered from research sources for reliability and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric, symbolic, and graphic modes of representation, and appropriate
          units of measurement (e.g., SI and imperial units)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely
    - code: A2
      text: 'Career Exploration: identify and describe a variety of careers related to the fields of science
        under study, and identify scientists, including Canadians, who have made contributions to those
        fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., meteorologist, medical illustrator, geochemist, optical physicist) and the education
          and training necessary for these careers
      - code: A2.2
        text: identify scientists, including Canadians (e.g., Sheela Basrur, William Richard Peltier,
          Alice Wilson, Willard Doyle), who have made a contribution to the fields of science under study
  - code: B
    title: 'Biology: Tissues, Organs, and Systems of Living Things'
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the importance of
        medical and other technological developments related to systems biology, and analyse their societal
        and ethical implications'
      specific:
      - code: B1.1
        text: analyse, on the basis of research, ethical issues related to a technological development
          in the field of systems biology (e.g., cloning, stem-cell research, live organ transplants,
          transgenic transplants), and communicate their findings [IP, PR, AI, C]
      - code: B1.2
        text: assess the importance to human health and/or society of medical imaging technologies (e.g.,
          ultrasound, X-rays, computerized axial tomography [CT or CAT] scan, magnetic resonance imaging
          [MRI], microscopy, biophotonics) used in Canada in diagnosing or treating abnormalities in tissues,
          organs, and/or systems [AI, C]
      - code: B1.3
        text: describe public health strategies related to systems biology (e.g., cancer screening and
          prevention programs; vaccines against the human papillomavirus [HPV] and measles, mumps, and
          rubella [MMR]; AIDS education), and assess their impact on society [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate cell division, cell specialization,
        organs, and systems in animals and plants, using research and inquiry skills, including various
        laboratory techniques'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to cells, tissues, organs, and systems of living things,
          including, but not limited to: absorption, anaphase, capillaries, concentration, differentiation,
          diffusion, meristematic, mesophyll, phloem, prophase, red blood cells, regeneration, stomate,
          and xylem [C]'
      - code: B2.2
        text: examine cells under a microscope or similar instrument to identify the various stages of
          mitosis in plants and animals [PR, AI]
      - code: B2.3
        text: examine different plant and animal cells (e.g., cheek cells, onion cells) under a microscope
          or similar instrument, and draw labelled biological diagrams to show how the cells’ organelles
          differ [PR, C]
      - code: B2.4
        text: investigate, using a microscope or similar instrument, specialized cells in the human body
          or in plants, focusing on different types of cells (e.g., bone, muscle, leaf, root cells), and
          draw labelled biological diagrams to show the cells’ structural differences [PR, C]
      - code: B2.5
        text: investigate the rate of cell division in cancerous and non-cancerous cells, using pictures,
          videos, or images, and predict the impact of this rate of cell division on an organism [PR,
          AI]
      - code: B2.6
        text: investigate, through a laboratory or computer-simulated dissection of a plant, worm, fish,
          or frog, the interrelationships between organ systems of a plant or an animal (e.g., between
          the root system and leaf system in a plant; between the digestive system and circulatory system
          in an animal) [PR, AI]
      - code: B2.7
        text: use a research process to investigate a disease or abnormality related to tissues, organs,
          or systems of humans or plants (e.g., heart disease, tobacco mosaic virus, wheat rust) [IP,
          PR, C]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the hierarchical organization
        of cells, from tissues, to organs, to systems in animals and plants'
      specific:
      - code: B3.1
        text: describe the cell cycle in plants and animals, and explain the importance of mitosis for
          the growth of cells and repair of tissues
      - code: B3.2
        text: explain the importance of cell division and cell specialization in generating new tissues
          and organs (e.g., the division of stem cells into specialized cells such as muscle cells or
          nerve cells in humans; the division of meristematic cells to expand and differentiate plant
          tissue)
      - code: B3.3
        text: explain the links between specialized cells, tissues, organs, and systems in plants and
          animals (e.g., muscle cells and nerve cells form the tissue found in the heart, which is a component
          of the circulatory system; granum and thylakoid structures act as solar collectors in the chloroplast
          to produce carbohydrates for plant growth)
      - code: B3.4
        text: explain the primary functions of a variety of systems in animals (e.g., the circulatory
          system transports materials through the organism; the respiratory system supplies oxygen to
          and removes carbon dioxide from the body)
      - code: B3.5
        text: explain the interaction of different systems within an organism (e.g., the respiratory system
          brings oxygen into the body, and the circulatory system transports the oxygen to cells) and
          why such interactions are necessary for the organism’s survival
  - code: C
    title: 'Chemistry: Chemical Reactions'
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse a variety of safety
        and environmental issues associated with chemical reactions, including the ways in which chemical
        reactions can be applied to address environmental challenges'
      specific:
      - code: C1.1
        text: analyse, on the basis of research, various safety and environmental issues associated with
          chemical reactions and their reactants and/or product(s) (e.g., chemical reactions related to
          the use of cyanide in gold mining, the corrosion of metal supports on bridges, the use of different
          antibacterial agents such as chlorine and bromine in recreational pools) [IP, PR, AI, C]
      - code: C1.2
        text: analyse how an understanding of the properties of chemical substances and their reactions
          can be applied to solve environmental challenges (e.g., renewing the Great Lakes, neutralizing
          acid spills, scrubbing smokestack emissions) [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate, through inquiry, the characteristics
        of chemical reactions'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to chemical reactions, including, but not limited to:
          compounds, product, and reactant [C]'
      - code: C2.2
        text: construct molecular models to illustrate the structure of molecules in simple chemical reactions
          (e.g., C + O2 CO2 ; 2H2 + O2 2H2O), and produce diagrams of these models [PR, C]
      - code: C2.3
        text: investigate simple chemical reactions, including synthesis, decomposition, and displacement
          reactions, and represent them using a variety of formats (e.g., molecular models, word equations,
          balanced chemical equations) [PR, AI, C]
      - code: C2.4
        text: use an inquiry process to investigate the law of conservation of mass in a chemical reaction
          (e.g., compare the values before and after the reaction), and account for any discrepancies
          [PR, AI]
      - code: C2.5
        text: plan and conduct an inquiry to identify the evidence of chemical change (e.g., the formation
          of a gas or precipitate, a change in colour or odour, a change in temperature) [IP, PR, AI]
      - code: C2.6
        text: plan and conduct an inquiry to classify some common substances as acidic, basic, or neutral
          (e.g., use acid–base indicators or pH test strips to classify common household substances) [IP,
          PR, AI]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the general principles of chemical
        reactions, and various ways to represent them'
      specific:
      - code: C3.1
        text: describe the relationships between chemical formulae, composition, and names of binary compounds
          (e.g., carbon dioxide, CO2, has two oxygen atoms and one carbon atom)
      - code: C3.2
        text: explain, using the law of conservation of mass and atomic theory, the rationale for balancing
          chemical equations
      - code: C3.3
        text: describe the types of evidence that indicate chemical change (e.g., changes in colour, the
          production of a gas, the formation of a precipitate, the production or absorption of heat, the
          production of light)
      - code: C3.4
        text: write word equations and balanced chemical equations for simple chemical reactions (e.g.,
          2H2 + O2 2H2O)
      - code: C3.5
        text: describe, on the basis of observation, the reactants in and products of a variety of chemical
          reactions, including synthesis, decomposition, and displacement reactions (e.g., reactions occurring
          when magnesium burns or in the production of oxygen from hydrogen peroxide; the reaction of
          iron and copper sulphate; reactions occurring when fossil fuels burn)
      - code: C3.6
        text: describe the process of acid–base neutralization (i.e., an acid reacts with a base to form
          a salt and often water)
      - code: C3.7
        text: describe how the pH scale is used to classify solutions as acidic, basic, or neutral (e.g.,
          a solution with a pH of 1 is highly acidic; a solution with a pH of 7 is neutral)
      - code: C3.8
        text: identify simple ionic compounds (e.g., NaCl), simple compounds involving polyatomic ions
          (e.g., KNO3 , NaOH), molecular compounds (e.g., CO2 , H2O, NH3), and acids (e.g., HCl(aq), H2SO4(aq)),
          using the periodic table and a list of the most common polyatomic ions (e.g., OH– , SO4 2−),
          and write the formulae
  - code: D
    title: 'Earth and Space Science: Climate Change'
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: analyse some of the effects
        of climate change around the world, and assess the effectiveness of initiatives that attempt to
        address the issue of climate change'
      specific:
      - code: D1.1
        text: analyse current and/or potential effects, both positive and negative, of climate change
          on human activity and natural systems (e.g., loss of habitat for Arctic mammals such as polar
          bears and loss of traditional lifestyles for Inuit as Arctic ice shrinks; famine as arable land
          is lost to desertification; an increase in water-borne disease and human resettlement as coastal
          lands are flooded; expansion of the growing season in some regions) [AI, C]
      - code: D1.2
        text: assess, on the basis of research, the effectiveness of some current individual, regional,
          national, or international initiatives that address the issue of climate change (e.g., Drive
          Clean, ENERGY STAR, federal and provincial government rebates for retrofitting older buildings
          to be more energy efficient, carbon offset programs, community tree-planting programs, municipal
          recycling programs, Intergovernmental Panel on Climate Change [IPCC]), and propose a further
          course of action related to one of these initiatives [PR, AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate various natural and human
        factors that influence Earth’s climate and climate change'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to climate change, including, but not limited to: albedo,
          anthropogenic, atmosphere, cycles, heat sinks, and hydrosphere [C]'
      - code: D2.2
        text: design and build a model to illustrate the natural greenhouse effect, and use the model
          to explain the anthropogenic greenhouse effect [IP, PR, C]
      - code: D2.3
        text: analyse different sources of scientific data (e.g., lake cores, tree rings, fossils and
          preserved organisms, ice cores) for evidence of natural climate change and climate change influenced
          by human activity [PR, AI, C]
      - code: D2.4
        text: investigate a popular hypothesis on a cause-and-effect relationship having to do with climate
          change (e.g., the combustion of fossil fuels is responsible for rising global temperatures;
          the concentration of atmospheric CO2 is responsible for rising global temperatures; global temperatures
          have been on the increase since the industrial revolution; the severity of cyclones, hurricanes,
          and tornadoes increases as atmospheric temperatures increase), using simulations and/or time-trend
          data that model climate profiles (e.g., data from Statistics Canada and Environment Canada)
          [PR, AI, C]
      - code: D2.5
        text: investigate, through laboratory inquiry or simulations, the effects of heat transfer within
          the hydrosphere and atmosphere [PR, AI]
      - code: D2.6
        text: investigate, through laboratory inquiry or simulations, how water in its various states
          influences climate patterns (e.g., water bodies moderate climate, water vapour is a greenhouse
          gas, ice increases the albedo of Earth’s surface) [PR, AI]
      - code: D2.7
        text: investigate, through research or simulations, the influence of ocean currents on local and
          global heat transfer and precipitation patterns [PR, AI]
      - code: D2.8
        text: classify the climate of their local region using various tools or systems (e.g., Ecoregions
          of Canada, bioclimate profiles), and compare their region to other regions in Ontario, Canada,
          and the world [AI, C]
      - code: D2.9
        text: compare different perspectives and/or biases evident in discussions of climate change in
          scientific and non-scientific media (e.g., with reference to knowledge, beliefs, and values)
          [AI, C]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of natural and human factors,
        including the greenhouse effect, that influence Earth’s climate and contribute to climate change'
      specific:
      - code: D3.1
        text: describe the principal components of Earth’s climate system (e.g., the sun, oceans, and
          atmosphere; the topography and configuration of land masses) and how the system works
      - code: D3.2
        text: describe and explain heat transfer in the hydrosphere and atmosphere and its effects on
          air and water currents
      - code: D3.3
        text: describe the natural greenhouse effect, explain its importance for life, and distinguish
          it from the anthropogenic greenhouse effect
      - code: D3.4
        text: identify natural phenomena (e.g., plate tectonics, uplift and weathering, solar radiance,
          cosmic ray cycles) and human activities (e.g., forest fires, deforestation, the burning of fossil
          fuels, industrial emissions) known to affect climate, and describe the role of both in Canada’s
          contribution to climate change
      - code: D3.5
        text: describe the principal sources and sinks, both natural and/or anthropogenic, of greenhouse
          gases (e.g., carbon dioxide, methane, nitrous oxide, halocarbons, water vapour)
      - code: D3.6
        text: describe how different carbon and nitrogen compounds (e.g., carbon dioxide, methane, nitrous
          oxide) influence the trapping of heat in the atmosphere and hydrosphere
      - code: D3.7
        text: describe, in general terms, the causes and effects of the anthropogenic greenhouse effect,
          the depletion of stratospheric and tropospheric ozone, and the formation of ground-level ozone
          and smog
      - code: D3.8
        text: 'identify and describe indicators of global climate change (e.g., changes in: glacial and
          polar ice, sea levels, wind patterns, global carbon budget assessments)'
  - code: E
    title: 'Physics: Light and Geometric Optics'
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the effectiveness
        of technological devices and procedures designed to make use of light, and assess their social
        benefits'
      specific:
      - code: E1.1
        text: analyse a technological device or procedure related to human perception of light (e.g.,
          eyeglasses, contact lenses, infrared or low light vision sensors, laser surgery), and evaluate
          its effectiveness [AI, C]
      - code: E1.2
        text: analyse a technological device that uses the properties of light (e.g., microscope, retroreflector,
          solar oven, camera), and explain how it has enhanced society [AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate, through inquiry, the properties
        of light, and predict its behaviour, particularly with respect to reflection in plane and curved
        mirrors and refraction in converging lenses'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to light and optics, including, but not limited to:
          angle of incidence, angle of reflection, angle of refraction, focal point, luminescence, magnification,
          mirage, and virtual image [C]'
      - code: E2.2
        text: use an inquiry process to investigate the laws of reflection, using plane and curved mirrors,
          and draw ray diagrams to summarize their findings [PR, C]
      - code: E2.3
        text: predict the qualitative characteristics of images formed by plane and curved mirrors (e.g.,
          location, relative distance, orientation, and size in plane mirrors; location, orientation,
          size, type in curved mirrors), test their predictions through inquiry, and summarize their findings
          [PR, AI, C]
      - code: E2.4
        text: use an inquiry process to investigate the refraction of light as it passes through media
          of different refractive indices, compile data on their findings, and analyse the data to determine
          if there is a trend (e.g., the amount by which the angle of refraction changes as the angle
          of incidence increases varies for media of different refractive indices) [PR, AI, C]
      - code: E2.5
        text: predict, using ray diagrams and algebraic equations, the position and characteristics of
          an image produced by a converging lens, and test their predictions through inquiry [PR, AI,
          C]
      - code: E2.6
        text: calculate, using the indices of refraction, the velocity of light as it passes through a
          variety of media, and explain the angles of refraction with reference to the variations in velocity
          [PR, C]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of various characteristics and
        properties of light, particularly with respect to reflection in mirrors and reflection and refraction
        in lenses'
      specific:
      - code: E3.1
        text: describe and explain various types of light emissions (e.g., chemiluminescence, bioluminescence,
          incandescence, fluorescence, phosphorescence, triboluminescence; from an electric discharge
          or light-emitting diode [LED])
      - code: E3.2
        text: identify and label the visible and invisible regions of the electromagnetic spectrum
      - code: E3.3
        text: describe, on the basis of observation, the characteristics and positions of images formed
          by plane and curved mirrors (e.g., location, orientation, size, type), with the aid of ray diagrams
          and algebraic equations, where appropriate
      - code: E3.4
        text: explain the conditions required for partial reflection/refraction and for total internal
          reflection in lenses, and describe the reflection/refraction using labelled ray diagrams
      - code: E3.5
        text: describe the characteristics and positions of images formed by converging lenses (e.g.,
          orientation, size, type), with the aid of ray diagrams
      - code: E3.6
        text: identify ways in which the properties of mirrors and lenses (both converging and diverging)
          determine their use in optical instruments (e.g., cameras, telescopes, binoculars, microscopes)
      - code: E3.7
        text: identify the factors, in qualitative and quantitative terms, that affect the refraction
          of light as it passes from one medium to another
      - code: E3.8
        text: describe properties of light, and use them to explain naturally occurring optical phenomena
          (e.g., apparent depth, shimmering, a mirage, a rainbow)
