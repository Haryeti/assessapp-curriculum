        text: 'use appropriate terminology related to chemical trends and chemical bonding, including,
          but not limited to: atomic radius, effective nuclear charge, electronegativity, ionization energy,
          and electron affinity [C]'
      - code: B2.2
        text: analyse data related to the properties of elements within a period (e.g., ionization energy,
          atomic radius) to identify general trends in the periodic table [AI]
      - code: B2.3
        text: use an inquiry process to investigate the chemical reactions of elements (e.g., metals,
          non-metals) with other substances (e.g., oxygen, acids, water), and produce an activity series
          using the resulting data [PR, AI]
      - code: B2.4
        text: draw Lewis structures to represent the bonds in ionic and molecular compounds [PR, C]
      - code: B2.5
        text: predict the nature of a bond (e.g., non-polar covalent, polar covalent, ionic), using electronegativity
          values of atoms [AI]
      - code: B2.6
        text: build molecular models, and write structural formulae, for molecular compounds containing
          single and multiple bonds (e.g., CO2, H2O, C2H4), and for ionic crystalline structures (e.g.,
          NaCl) [PR, AI, C]
      - code: B2.7
        text: write chemical formulae of binary and polyatomic compounds, including those with multiple
          valences, and name the compounds using the International Union of Pure and Applied Chemistry
          (IUPAC) nomenclature system [AI, C]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of periodic trends in the periodic
        table and how elements combine to form chemical bonds'
      specific:
      - code: B3.1
        text: explain the relationship between the atomic number and the mass number of an element, and
          the difference between isotopes and radioisotopes of an element
      - code: B3.2
        text: explain the relationship between isotopic abundance of an element’s isotopes and the relative
          atomic mass of the element
      - code: B3.3
        text: state the periodic law, and explain how patterns in the electron arrangement and forces
          in atoms result in periodic trends (e.g., in atomic radius, ionization energy, electron affinity,
          electronegativity) in the periodic table
      - code: B3.4
        text: explain the differences between the formation of ionic bonds and the formation of covalent
          bonds
      - code: B3.5
        text: compare and contrast the physical properties of ionic and molecular compounds (e.g., NaCl
          and CH4; NaOH and H2O)
  - code: C
    title: Chemical Reactions
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse chemical reactions
        used in a variety of applications, and assess their impact on society and the environment'
      specific:
      - code: C1.1
        text: analyse, on the basis of research, chemical reactions used in various industrial processes
          (e.g., pulp and paper production, mining, chemical manufacturing) that can have an impact on
          the health and safety of local populations [IP, PR, AI, C]
      - code: C1.2
        text: assess the effectiveness of some applications of chemical reactions that are used to address
          social and environmental needs and problems [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate different types of chemical
        reactions'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to chemical reactions, including, but not limited to:
          neutralization, precipitate, acidic, and basic [C]'
      - code: C2.2
        text: write balanced chemical equations to represent synthesis, decomposition, single displacement,
          double displacement, and combustion reactions, using the IUPAC nomenclature system [PR, AI,
          C]
      - code: C2.3
        text: investigate synthesis, decomposition, single displacement, and double displacement reactions,
          by testing the products of each reaction (e.g., test for products such as gases, the presence
          of an acid, or the presence of a base) [PR, AI]
      - code: C2.4
        text: predict the products of different types of synthesis and decomposition reactions (e.g.,
          synthesis reactions in which simple compounds are formed; synthesis reactions of metallic or
          non-metallic oxides with water; decomposition reactions, in which a chemical compound is separated
          into several compounds) [AI]
      - code: C2.5
        text: predict the products of single displacement reactions, using the metal activity series and
          the halogen series [AI]
      - code: C2.6
        text: predict the products of double displacement reactions (e.g., the formation of precipitates
          or gases; neutralization) [AI]
      - code: C2.7
        text: design an inquiry to demonstrate the difference between a complete and an incomplete combustion
          reaction [IP, C]
      - code: C2.8
        text: plan and conduct an inquiry to compare the properties of non-metal oxide solutions and metal
          oxide solutions (e.g., carbon dioxide reacts with water to make water acidic; magnesium oxide
          reacts with water to make water basic) [IP, PR, AI]
      - code: C2.9
        text: investigate neutralization reactions (e.g., neutralize a dilute solution of sodium hydroxide
          with a dilute solution of hydrochloric acid, and isolate the sodium chloride produced) [PR]
      - code: C2.10
        text: plan and conduct an inquiry to demonstrate a single displacement reaction, using elements
          from the metal activity series [IP, PR]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the different types of chemical
        reactions'
      specific:
      - code: C3.1
        text: identify various types of chemical reactions, including synthesis, decomposition, single
          displacement, double displacement, and combustion
      - code: C3.2
        text: explain the difference between a complete combustion reaction and an incomplete combustion
          reaction (e.g., complete and incomplete combustion of hydrocarbon fuels)
      - code: C3.3
        text: explain the chemical reactions that result in the formation of acids and bases from metal
          oxides and non-metal oxides (e.g., calcium oxide reacts with water to produce a basic solution;
          carbon dioxide reacts with water to produce an acidic solution)
  - code: D
    title: Quantities in Chemical Reactions
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: analyse processes in the home,
        the workplace, and the environmental sector that use chemical quantities and calculations, and
        assess the importance of quantitative accuracy in industrial chemical processes'
      specific:
      - code: D1.1
        text: analyse processes in the home, the workplace, and the environmental sector that involve
          the use of chemical quantities and calculations (e.g., mixing household cleaning solutions,
          calculating chemotherapy doses, monitoring pollen counts) [AI, C]
      - code: D1.2
        text: assess, on the basis of research, the importance of quantitative accuracy in industrial
          chemical processes and the potential impact on the environment if quantitative accuracy is not
          observed [IP, PR, AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate quantitative relationships
        in chemical reactions, and solve related problems'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to quantities in chemical reactions, including, but
          not limited to: stoichiometry, percentage yield, limiting reagent, mole, and atomic mass [C]'
      - code: D2.2
        text: conduct an inquiry to calculate the percentage composition of a compound (e.g., a hydrate)
          [PR, AI]
      - code: D2.3
        text: solve problems related to quantities in chemical reactions by performing calculations involving
          quantities in moles, number of particles, and atomic mass [AI]
      - code: D2.4
        text: determine the empirical formulae and molecular formulae of various chemical compounds, given
          molar masses and percentage composition or mass data [AI]
      - code: D2.5
        text: calculate the corresponding mass, or quantity in moles or molecules, for any given reactant
          or product in a balanced chemical equation as well as for any other reactant or product in the
          chemical reaction [AI]
      - code: D2.6
        text: solve problems related to quantities in chemical reactions by performing calculations involving
          percentage yield and limiting reagents [AI]
      - code: D2.7
        text: conduct an inquiry to determine the actual yield, theoretical yield, and percentage yield
          of the products of a chemical reaction (e.g., a chemical reaction between steel wool and copper(II)
          sulfate solution), assess the effectiveness of the procedure, and suggest sources of experimental
          error [PR, AI]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the mole concept and its significance
        to the quantitative analysis of chemical reactions'
      specific:
      - code: D3.1
        text: explain the law of definite proportions
      - code: D3.2
        text: describe the relationships between Avogadro’s number, the mole concept, and the molar mass
          of any given substance
      - code: D3.3
        text: explain the relationship between the empirical formula and the molecular formula of a chemical
          compound
      - code: D3.4
        text: explain the quantitative relationships expressed in a balanced chemical equation, using
          appropriate units of measure (e.g., moles, grams, atoms, ions, molecules)
  - code: E
    title: Solutions and Solubility
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the origins and effects
        of water pollution, and a variety of economic, social, and environmental issues related to drinking
        water'
      specific:
      - code: E1.1
        text: analyse the origins and cumulative effects of pollutants that enter our water systems (e.g.,
          landfill leachates, agricultural run-off, industrial effluents, chemical spills), and explain
          how these pollutants affect water quality [AI, C]
      - code: E1.2
        text: analyse economic, social, and environmental issues related to the distribution, purification,
          or use of drinking water (e.g., the impact on the environment of the use of bottled water) [AI,
          C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate qualitative and quantitative
        properties of solutions, and solve related problems'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to aqueous solutions and solubility, including, but
          not limited to: concentration, solubility, precipitate, ionization, dissociation, pH, dilute,
          solute, and solvent [C]'
      - code: E2.2
        text: solve problems related to the concentration of solutions by performing calculations involving
          moles, and express the results in various units (e.g., moles per litre, grams per 100 mL, parts
          per million or parts per billion, mass, volume per cent) [AI, C]
      - code: E2.3
        text: prepare solutions of a given concentration by dissolving a solid solute in a solvent or
          by diluting a concentrated solution [PR]
      - code: E2.4
        text: conduct an investigation to analyse qualitative and quantitative properties of solutions
          (e.g., perform a qualitative analysis of ions in a solution) [PR, AI]
      - code: E2.5
        text: write balanced net ionic equations to represent precipitation and neutralization reactions
          [AI, C]
      - code: E2.6
        text: use stoichiometry to solve problems involving solutions and solubility [AI]
      - code: E2.7
        text: determine the concentration of an acid or a base in a solution (e.g., the concentration
          of acetic acid in vinegar), using the acid–base titration technique [PR, AI]
      - code: E2.8
        text: conduct an investigation to determine the concentrations of pollutants in their local treated
          drinking water, and compare the results to commonly used guidelines and standards (e.g., provincial
          and federal standards) [PR, AI]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of qualitative and quantitative
        properties of solutions'
      specific:
      - code: E3.1
        text: describe the properties of water (e.g., polarity, hydrogen bonding), and explain why these
          properties make water such a good solvent
      - code: E3.2
        text: explain the process of formation for solutions that are produced by dissolving ionic and
          molecular compounds (e.g., salt, oxygen) in water, and for solutions that are produced by dissolving
          non-polar solutes in non-polar solvents (e.g., grease in vegetable oil)
      - code: E3.3
        text: explain the effects of changes in temperature and pressure on the solubility of solids,
          liquids, and gases (e.g., explain how a change in temperature or atmospheric pressure affects
          the solubility of oxygen in lake water)
      - code: E3.4
        text: identify, using a solubility table, the formation of precipitates in aqueous solutions (e.g.,
          the use of iron or aluminum compounds to precipitate and remove phosphorus from wastewater)
      - code: E3.5
        text: explain the Arrhenius theory of acids and bases
      - code: E3.6
        text: explain the difference between strong and weak acids, and between strong and weak bases,
          in terms of degree of ionization
  - code: F
    title: Gases and Atmospheric Chemistry
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the cumulative effects
        of human activities and technologies on air quality, and describe some Canadian initiatives to
        reduce air pollution, including ways to reduce their own carbon footprint'
      specific:
      - code: F1.1
        text: analyse the effects on air quality of some technologies and human activities (e.g., smelting;
          driving gas-powered vehicles), including their own activities, and propose actions to reduce
          their personal carbon footprint [AI, C]
      - code: F1.2
        text: assess air quality conditions for a given Canadian location, using Environment Canada’s
          Air Quality Health Index, and report on some Canadian initiatives to improve air quality and
          reduce greenhouse gases (e.g., Ontario’s Drive Clean program to control vehicle emissions) [AI,
          C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate gas laws that explain the
        behaviour of gases, and solve related problems'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to gases and atmospheric chemistry, including, but
          not limited to: standard temperature, standard pressure, molar volume, and ideal gas [C]'
      - code: F2.2
        text: determine, through inquiry, the quantitative and graphical relationships between the pressure,
          volume, and temperature of a gas [PR, AI]
      - code: F2.3
        text: solve quantitative problems by performing calculations based on Boyle’s law, Charles’s law,
          Gay-Lussac’s law, the combined gas law, Dalton’s law of partial pressures, and the ideal gas
          law [AI]
      - code: F2.4
        text: use stoichiometry to solve problems related to chemical reactions involving gases (e.g.,
          problems involving moles, number of atoms, number of molecules, mass, and volume) [AI]
      - code: F2.5
        text: determine, through inquiry, the molar volume or molar mass of a gas produced by a chemical
          reaction (e.g., the molar volume of hydrogen gas from the reaction of magnesium with hydrochloric
          acid) [PR, AI]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the laws that explain the behaviour
        of gases'
      specific:
      - code: F3.1
        text: identify the major and minor chemical components of Earth’s atmosphere
      - code: F3.2
        text: describe the different states of matter, and explain their differences in terms of the forces
          between atoms, molecules, and ions
      - code: F3.3
        text: use the kinetic molecular theory to explain the properties and behaviour of gases in terms
          of types and degrees of molecular motion
      - code: F3.4
        text: describe, for an ideal gas, the quantitative relationships that exist between the variables
          of pressure, volume, temperature, and amount of substance
      - code: F3.5
        text: explain Dalton’s law of partial pressures, Boyle’s law, Charles’s law, Gay-Lussac’s law,
          the combined gas law, and the ideal gas law
      - code: F3.6
        text: explain Avogadro’s hypothesis and how his contribution to the gas laws has increased our
          understanding of the chemical reactions of gases
- course: SBI3U
  title: Biology, Grade 11, University Preparation
  grade: 11
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate relevant scientific questions about observed relationships, ideas, problems, or
          issues, make informed predictions, and/or formulate educated hypotheses to focus inquiries or
          research
      - code: A1.2
        text: select appropriate instruments (e.g., sampling instruments, a microscope, a stethoscope,
          dissection instruments) and materials (e.g., dichotomous keys, computer simulations, plant cuttings),
          and identify appropriate methods, techniques, and procedures, for each inquiry
      - code: A1.3
        text: identify and locate a variety of print and electronic sources that enable them to address
          research topics fully and appropriately
      - code: A1.4
        text: apply knowledge and understanding of safe laboratory practices and procedures when planning
          investigations by correctly interpreting Workplace Hazardous Materials Information System (WHMIS)
          symbols; by using appropriate techniques for handling and storing laboratory equipment and materials
          and disposing of laboratory and biological materials (e.g., preserved specimens); and by using
          appropriate personal protection
      - code: A1.5
        text: conduct inquiries, controlling relevant variables, adapting or extending procedures as required,
          and using appropriate materials and equipment safely, accurately, and effectively, to collect
          observations and data
      - code: A1.6
        text: compile accurate data from laboratory and other sources, and organize and record the data,
          using appropriate formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from a variety of appropriate
          sources, including electronic, print, and/or human sources, using suitable formats and an accepted
          form of academic documentation
      - code: A1.8
        text: synthesize, analyse, interpret, and evaluate qualitative and/or quantitative data to determine
          whether the evidence supports or refutes the initial prediction or hypothesis and whether it
          is consistent with scientific theory; identify sources of bias and/or error; and suggest improvements
          to the inquiry to reduce the likelihood of error
      - code: A1.9
        text: analyse the information gathered from research sources for logic, accuracy, reliability,
          adequacy, and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
          with reference to scientific knowledge
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric, symbolic, and graphic modes of representation (e.g., biological
          diagrams, Punnett squares), and appropriate units of measurement (e.g., SI and imperial units)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places or significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers related to the fields of science under
        study, and describe the contributions of scientists, including Canadians, to those fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., zoologist, botanist, geneticist, ecologist, pharmacologist, farmer, forester, horticulturalist)
          and the education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Colin D’Cunha, Louis
          Bernatchez, Lap-Chee Tsui, Helen Battle, Memory Elvin-Lewis), to the fields under study
  - code: B
    title: Diversity of Living Things
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the effects of various
        human activities on the diversity of living things'
      specific:
      - code: B1.1
        text: analyse some of the risks and benefits of human intervention (e.g., tree plantations; monoculture
          of livestock or agricultural crops; overharvesting of wild plants for medicinal purposes; using
          pesticides to control pests; suppression of wild fires) to the biodiversity of aquatic or terrestrial
          ecosystems [AI, C]
      - code: B1.2
        text: analyse the impact that climate change might have on the diversity of living things (e.g.,
          rising temperatures can result in habitat loss or expansion; changing rainfall levels can cause
          drought or flooding of habitats) [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate, through laboratory and/or
        field activities or through simulations, the principles of scientific classification, using appropriate
        sampling and classification techniques'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to biodiversity, including, but not limited to: genetic
          diversity, species diversity, structural diversity, protists, bacteria, fungi, binomial nomenclature,
          and morphology [C]'
      - code: B2.2
        text: classify, and draw biological diagrams of, representative organisms from each of the kingdoms
          according to their unifying and distinguishing anatomical and physiological characteristics
          (e.g., vertebrate or invertebrate organisms, vascular or nonvascular plants) [PR, AI, C]
      - code: B2.3
        text: use proper sampling techniques to collect various organisms from a marsh, pond, field, or
          other ecosystem, and classify the organisms according to the principles of taxonomy [PR, AI,
          C]
      - code: B2.4
        text: create and apply a dichotomous key to identify and classify organisms from each of the kingdoms
          [PR, AI, C]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the diversity of living organisms
        in terms of the principles of taxonomy and phylogeny'
      specific:
      - code: B3.1
        text: explain the fundamental principles of taxonomy and phylogeny by defining concepts of taxonomic
          rank and relationship, such as genus, species, and taxon
      - code: B3.2
        text: compare and contrast the structure and function of different types of prokaryotes, eukaryotes,
          and viruses (e.g., compare and contrast genetic material, metabolism, organelles, and other
          cell parts)
      - code: B3.3
        text: describe unifying and distinguishing anatomical and physiological characteristics (e.g.,
          types of reproduction, habitat, general physical structure) of representative organisms from
          each of the kingdoms
      - code: B3.4
        text: explain key structural and functional changes in organisms as they have evolved over time
          (e.g., the evolution of eukaryotes from prokaryotes, of plants from unicellular organisms)
      - code: B3.5
        text: explain why biodiversity is important to maintaining viable ecosystems (e.g., biodiversity
          helps increase resilience to stress and resistance to diseases or invading species)
  - code: C
    title: Evolution
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the economic and environmental
        advantages and disadvantages of an artificial selection technology, and evaluate the impact of
        environmental changes on natural selection and endangered species'
      specific:
      - code: C1.1
        text: analyse, on the basis of research, the economic and environmental advantages and disadvantages
          of an artificial selection technology (e.g., livestock and horticultural breeding) [IP, PR,
          AI, C]
      - code: C1.2
        text: evaluate the possible impact of an environmental change on natural selection and on the
          vulnerability of species (e.g., adaptation to environmental changes can affect reproductive
          success of an organism) [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate evolutionary processes,
        and analyse scientific evidence that supports the theory of evolution'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to evolution, including, but not limited to: extinction,
          natural selection, phylogeny, speciation, niche, mutation, mimicry, adaptation, and survival
          of the fittest [C]'
      - code: C2.2
        text: use a research process to investigate some of the key factors that affect the evolutionary
          process (e.g., genetic mutations, selective pressures, environmental stresses) [IP, PR]
      - code: C2.3
        text: analyse, on the basis of research, and report on the contributions of various scientists
          to modern theories of evolution (e.g., Charles Lyell, Thomas Malthus, Jean-Baptiste Lamarck,
          Charles Darwin, Stephen Jay Gould, Niles Eldredge) [IP, PR, AI, C]
      - code: C2.4
        text: investigate, through a case study or computer simulation, the processes of natural selection
          and artificial selection (e.g., selective breeding, antibiotic resistance in microorganisms),
          and analyse the different mechanisms by which they occur [PR, AI, C]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the theory of evolution, the
        evidence that supports it, and some of the mechanisms by which it occurs'
      specific:
      - code: C3.1
        text: explain the fundamental theory of evolution, using the evolutionary mechanism of natural
          selection to illustrate the process of biological change over time
      - code: C3.2
        text: explain the process of adaptation of individual organisms to their environment (e.g., some
          disease-causing bacteria in a bacterial population can survive exposure to antibiotics due to
          slight genetic variations from the rest of the population, which allows successful surviving
          bacteria to pass on antibiotic resistance to the next generation)
      - code: C3.3
        text: define the concept of speciation, and explain the process by which new species are formed
      - code: C3.4
        text: describe some evolutionary mechanisms (e.g., natural selection, artificial selection, sexual
          selection, genetic variation, genetic drift, biotechnology), and explain how they affect the
          evolutionary development and extinction of various species (e.g., Darwin’s finches, giraffes,
          pandas)
  - code: D
    title: Genetic Processes
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the importance of
        some recent contributions to our knowledge of genetic processes, and analyse social and ethical
        implications of genetic and genomic research'
      specific:
      - code: D1.1
        text: analyse, on the basis of research, some of the social and ethical implications of research
          in genetics and genomics (e.g., genetic screening, gene therapy, in vitro fertilization) [IP,
          PR, AI, C]
      - code: D1.2
        text: evaluate, on the basis of research, the importance of some recent contributions to knowledge,
          techniques, and technologies related to genetic processes (e.g., research into the cystic fibrosis
          gene; the use of safflowers to produce insulin for human use) [IP, PR, AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate genetic processes, including
        those that occur during meiosis, and analyse data to solve basic genetics problems involving monohybrid
        and dihybrid crosses'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to genetic processes, including, but not limited to:
          haploid, diploid, spindle, synapsis, gamete, zygote, heterozygous, homozygous, allele, plasmid,
          trisomy, non-disjunction, and somatic cell [C]'
      - code: D2.2
        text: investigate the process of meiosis, using a microscope or similar instrument, or a computer
          simulation, and draw biological diagrams to help explain the main phases in the process [PR,
          AI, C]
      - code: D2.3
        text: use the Punnett square method to solve basic genetics problems involving monohybrid crosses,
          incomplete dominance, codominance, dihybrid crosses, and sex-linked genes [PR, AI, C]
      - code: D2.4
        text: investigate, through laboratory inquiry or computer simulation, monohybrid and dihybrid
          crosses, and use the Punnett square method and probability rules to analyse the qualitative
          and quantitative data and determine the parent genotype [PR, AI, C]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of concepts, processes, and technologies
        related to the transmission of hereditary characteristics'
      specific:
      - code: D3.1
        text: explain the phases in the process of meiosis in terms of cell division, the movement of
          chromosomes, and crossing over of genetic material
      - code: D3.2
        text: explain the concepts of DNA, genes, chromosomes, alleles, mitosis, and meiosis, and how
          they account for the transmission of hereditary characteristics according to Mendelian laws
          of inheritance
      - code: D3.3
        text: explain the concepts of genotype, phenotype, dominance, incomplete dominance, codominance,
          recessiveness, and sex linkage according to Mendelian laws of inheritance
      - code: D3.4
        text: describe some genetic disorders caused by chromosomal abnormalities (e.g., non-disjunction
          of chromosomes during meiosis) or other genetic mutations in terms of chromosomes affected,
          physical effects, and treatments
      - code: D3.5
        text: describe some reproductive technologies (e.g., cloning, artificial insemination, in vitro
          fertilization, recombinant DNA), and explain how their use can increase the genetic diversity
          of a species (e.g., farm animals, crops)
  - code: E
    title: 'Animals: Structure and Function'
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the relationships between
        changing societal needs, technological advances, and our understanding of internal systems of
        humans'
      specific:
      - code: E1.1
        text: evaluate the importance of various technologies, including Canadian contributions, to our
          understanding of internal body systems (e.g., endoscopes can be used to locate, diagnose, and
          surgically remove digestive system tumours; lasers can be used during surgery to destroy lung
          tumours; nuclear magnetic resonance [NMR] imaging can be used to diagnose injuries and cardiovascular
          disorders, such as aneurysms) [AI, C]
      - code: E1.2
        text: assess how societal needs (e.g., the need for healthy foods; the need to counteract the
          effects of sedentary lifestyles) lead to scientific and technological developments related to
          internal systems (e.g., advances in dietary products and fitness equipment; improved standards
          for transplanting organs) [AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate, through laboratory inquiry
        or computer simulation, the functional responses of the respiratory and circulatory systems of
        animals, and the relationships between their respiratory, circulatory, and digestive systems'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to animal anatomy, including, but not limited to: systolic,
          diastolic, diffusion gradient, inhalation, exhalation, coronary, cardiac, ulcer, asthma, and
          constipation [C]'
      - code: E2.2
        text: perform a laboratory or computer-simulated dissection of a representative animal, or use
          a mounted anatomical model, to analyse the relationships between the respiratory, circulatory,
          and digestive systems [PR, AI]
      - code: E2.3
        text: use medical equipment (e.g., a stethoscope, a sphygmomanometer) to monitor the functional
          responses of the respiratory and circulatory systems to external stimuli (e.g., measure the
          change in breathing rate and heart rate after exercise) [PR, AI]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of animal anatomy and physiology,
        and describe disorders of the respiratory, circulatory, and digestive systems'
      specific:
      - code: E3.1
        text: explain the anatomy of the respiratory system and the process of ventilation and gas exchange
          from the environment to the cell (e.g., the movement of oxygen from the atmosphere to the cell;
          the roles of ventilation, hemoglobin, and diffusion in gas exchange)
      - code: E3.2
        text: explain the anatomy of the digestive system and the importance of digestion in providing
          nutrients needed for energy and growth (e.g., the body’s mechanical and chemical processes digest
          food, which provides the proteins needed to build muscle, and the fibre, water, vitamins, and
          minerals needed to regulate body processes)
      - code: E3.3
        text: explain the anatomy of the circulatory system (e.g., blood components, blood vessels, the
          heart) and its function in transporting substances that are vital to health
      - code: E3.4
        text: describe some disorders related to the respiratory, digestive, and circulatory systems (e.g.,
          asthma, emphysema, ulcers, colitis, cardiac arrest, arteriosclerosis)
  - code: F
    title: 'Plants: Anatomy, Growth, and Function'
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the importance of
        sustainable use of plants to Canadian society and other cultures'
      specific:
      - code: F1.1
        text: evaluate, on the basis of research, the importance of plants to the growth and development
          of Canadian society (e.g., as a source of food, pharmaceuticals, Aboriginal medicines, building
          materials, flood and erosion control; as a resource for recreation and ecotourism) [IP, PR,
          AI, C]
      - code: F1.2
        text: evaluate, on the basis of research, ways in which different societies or cultures have used
          plants to sustain human populations while supporting environmental sustainability (e.g., sustainable
          agricultural practices in developing countries such as crop rotation and seed saving; traditional
          Aboriginal corn production practices) [IP, PR, AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate the structures and functions
        of plant tissues, and factors affecting plant growth'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to plants, including, but not limited to: mesophyll,
          palisade, aerenchyma, epidermal tissue, stomata, root hair, pistil, stamen, venation, auxin,
          and gibberellin [C]'
      - code: F2.2
        text: design and conduct an inquiry to determine the factors that affect plant growth (e.g., the
          effects on plant growth of the quantity of nutrients, the quantity and quality of light, and
          factors such as temperature and water retention or percolation rate) [IP, PR, AI]
      - code: F2.3
        text: identify, and draw biological diagrams of, the specialized plant tissues in roots, stems,
          and leaves (e.g., xylem, phloem), using a microscope and models [PR, AI]
      - code: F2.4
        text: investigate various techniques of plant propagation (e.g., leaf cutting, stem cutting, root
          cutting, seed germination) [PR]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the diversity of vascular plants,
        including their structures, internal transport systems, and their role in maintaining biodiversity'
      specific:
      - code: F3.1
        text: describe the structures of the various types of tissues in vascular plants, and explain
          the mechanisms of transport involved in the processes by which materials are distributed throughout
          a plant (e.g., transpiration, translocation, osmosis)
      - code: F3.2
        text: compare and contrast monocot and dicot plants in terms of their structures (e.g., seeds,
          stem, flower, root) and their evolutionary processes (i.e., how one type evolved from the other)
      - code: F3.3
        text: explain the reproductive mechanisms of plants in natural reproduction and artificial propagation
          (e.g., germination of seeds, leaf cuttings, grafting of branches onto a host tree)
      - code: F3.4
        text: describe the various factors that affect plant growth (e.g., growth regulators, sunlight,
          water, nutrients, acidity, tropism)
      - code: F3.5
        text: explain the process of ecological succession, including the role of plants in maintaining
          biodiversity and the survival of organisms after a disturbance to an ecosystem
- course: SBI3C
  title: Biology, Grade 11, College Preparation
  grade: 11
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate relevant scientific questions about observed relationships, ideas, problems, or
          issues, make informed predictions, and/or formulate educated hypotheses to focus inquiries or
          research
      - code: A1.2
        text: select appropriate instruments (e.g., a microscope, a stethoscope, plant-propagation instruments,
          dissection instruments) and materials (e.g., prepared slides, agar plates, plants), and identify
          appropriate methods, techniques, and procedures, for each inquiry
      - code: A1.3
        text: identify and locate a variety of print and electronic sources that enable them to address
          research topics fully and appropriately
      - code: A1.4
        text: apply knowledge and understanding of safe laboratory practices and procedures when planning
          investigations by correctly interpreting Workplace Hazardous Materials Information System (WHMIS)
          symbols; by using appropriate techniques for handling and storing laboratory equipment and materials
          and disposing of laboratory and biological materials (e.g., preserved specimens); and by using
          appropriate personal protection
      - code: A1.5
        text: conduct inquiries, controlling relevant variables, adapting or extending procedures as required,
          and using appropriate materials and equipment safely, accurately, and effectively, to collect
          observations and data
      - code: A1.6
        text: compile accurate data from laboratory and other sources, and organize and record the data,
          using appropriate formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from a variety of appropriate
          sources, including electronic, print, and/or human sources, using suitable formats and an accepted
          form of academic documentation
      - code: A1.8
        text: synthesize, analyse, interpret, and evaluate qualitative and/or quantitative data to determine
          whether the evidence supports or refutes the initial prediction or hypothesis and whether it
          is consistent with scientific theory; identify sources of bias and/or error; and suggest improvements
          to the inquiry to reduce the likelihood of error
      - code: A1.9
        text: analyse the information gathered from research sources for logic, accuracy, reliability,
          adequacy, and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
          with reference to scientific knowledge
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric, symbolic, and graphic modes of representation (e.g., biological
          diagrams, Punnett squares), and appropriate units of measurement (e.g., SI and imperial units)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places and significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers related to the fields of science under
        study, and describe the contributions of scientists, including Canadians, to those fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., food science technologist, medical laboratory technologist, dental hygienist, outpost
          clinic/primary care nurse, respiratory therapist, veterinary technician, water or wastewater
          technician) and the education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Julia Levy, Charles
          Beer, Shirley Tilghman, Walter Lewis, Gail Anderson), to the fields under study
  - code: B
    title: Cellular Biology
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the impact of environmental
        factors and medical technologies on certain cellular processes that occur in the human body'
      specific:
      - code: B1.1
        text: evaluate the effectiveness of medical devices and technologies that are intended to aid
          cellular functions or processes (e.g., insulin infusion pump, chemotherapy) [AI, C]
      - code: B1.2
        text: analyse the effects of environmental factors on cellular processes that occur in the human
          body (e.g., the effect of lead on nerve cells; the effect of electromagnetic radiation on brain
          cells) [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate the structures and functions
        of cells, and the factors that influence cellular activity, using appropriate laboratory equipment
        and techniques'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to cellular biology, including, but not limited to:
          macromolecule, passive transport, active transport, catalyst, and fluid mosaic model [C]'
      - code: B2.2
        text: investigate the effect of various qualitative factors (e.g., temperature) on the rate of
          diffusion of molecules across a plasma membrane [PR, AI]
      - code: B2.3
        text: using a light microscope, identify visible organelles of a plant cell in a wet mount and
          an animal cell from a prepared slide, produce an accurate labelled drawing of each cell, and
          calculate and properly express the magnification of each image [PR, AI, C]
      - code: B2.4
        text: investigate the effects of various qualitative factors on the action of enzymes (e.g., the
          effect of temperature or pH on the breakdown of starch by salivary enzymes) [PR, AI]
      - code: B2.5
        text: conduct biological tests to identify biochemical compounds found in various food samples
          (e.g., use a biuret solution to test for proteins in samples of gelatin and albumin), and compare
          the biochemical compounds found in each food to those found in the others [PR, AI]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the basic processes of cellular
        biology'
      specific:
      - code: B3.1
        text: describe the structures and functions of important biochemical compounds, including carbohydrates,
          proteins, enzymes, and lipids
      - code: B3.2
        text: explain the roles of various organelles, including lysosomes, vacuoles, mitochondria, cell
          membranes, ribosomes, the endoplasmic reticulum, and Golgi bodies, in the processes of digestion,
          cellular respiration, and protein synthesis
      - code: B3.3
        text: explain the chemical changes and energy transformations associated with the process of cellular
          respiration, and compare the reactants (i.e., glucose, oxygen) to the products (i.e., water,
          carbon dioxide, ATP)
      - code: B3.4
        text: explain the importance of various cellular processes in human systems (e.g., enzymes act
          as biological catalysts to regulate chemical processes in the cells of the digestive system)
  - code: C
    title: Microbiology
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: assess the effects of microorganisms
        in the environment, and analyse ethical issues related to their use in biotechnology'
      specific:
      - code: C1.1
        text: assess some of the effects, both beneficial and harmful, of microorganisms in the environment
          (e.g., decomposers break down waste, E. coli in water systems poses a severe risk to human health)
          [AI, C]
      - code: C1.2
        text: analyse ethical issues related to the use of microorganisms in biotechnology (e.g., with
          respect to the use of bacterial insecticides, the patenting of modified microorganisms) [AI,
          C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate the development and physical
        characteristics of microorganisms, using appropriate laboratory equipment and techniques'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to microbiology, including, but not limited to: fission,
          conjugation, phage, dormancy, morphology, mycelium, spore, pathogen, and plasmid [C]'
      - code: C2.2
        text: compare and contrast the cell structures of eukaryotes such as fungi, protozoa, and algae
          [PR, AI]
      - code: C2.3
        text: prepare a laboratory culture of microorganisms (e.g., acidophilus) on agar, using proper
          aseptic techniques [PR]
      - code: C2.4
        text: investigate the effect of antibacterial agents on different bacterial cultures (e.g., the
          effects of antibacterial soap or mouthwash on a bacterial culture) [PR]
      - code: C2.5
        text: investigate and analyse the conditions (e.g., optimal temperature) needed by microorganisms
          for growth [PR, AI]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the diversity of microorganisms
        and the relationships that exist between them'
      specific:
      - code: C3.1
        text: describe the anatomy and morphology of various groups of microorganisms (e.g., eukaryotes,
          prokaryotes, viruses)
      - code: C3.2
        text: explain the differences between the life cycles of eukaryotic and prokaryotic microorganisms
          in terms of cell division
      - code: C3.3
        text: explain the vital roles of microorganisms in symbiotic relationships with other organisms
          (e.g., gut bacteria in cows digest cellulose; mycorrhizal fungi penetrate and effectively extend
          a plant’s root system)
      - code: C3.4
        text: explain the different methods of reproduction in various types of bacteria, viruses, and
          fungi
      - code: C3.5
        text: describe how different viruses, bacteria, and fungi can affect host organisms, and how those
          effects are normally treated or prevented (e.g., hepatitis viruses can damage the liver, but
          vaccinations can prevent infections; streptococcus bacteria can cause respiratory infections,
          which are treated with antibiotics; ringworm is a fungal infection of the skin, treated with
          fungicides)
  - code: D
    title: Genetics
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate some social, ethical,
        and environmental implications of genetic research and related technologies'
      specific:
      - code: D1.1
        text: evaluate, on the basis of research, some of the social and ethical implications of genetic
          research and reproductive technologies (e.g., sex selection, harvesting umbilical cord cells)
          [IP, PR, AI, C]
      - code: D1.2
        text: evaluate, on the basis of research, some of the effects of genetic research and biotechnology
          (e.g., genetically modified organisms [GMOs]) on the environment [IP, PR, AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate the process of meiosis,
        and analyse data related to the laws of heredity'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to genetics, including, but not limited to: spindle,
          haploid, diploid, heterozygous, homozygous, hemophilia, gamete, ultraviolet radiation, carcinogen,
          cancer, trisomy, somatic cell, and zygote [C]'
      - code: D2.2
        text: investigate the process of meiosis, using a microscope or computer simulation, and identify,
          and draw biological diagrams of, the phases of meiosis [PR, C]
      - code: D2.3
        text: solve basic problems in genetics that involve monohybrid crosses, using the Punnett square
          method [AI, C]
      - code: D2.4
        text: compile and analyse qualitative and quantitative data, through laboratory inquiry or computer
          simulation, on monohybrid crosses, and communicate the results (e.g., record data obtained while
          performing a “virtual fly” lab, and analyse the results to create a karyotype chart) [PR, AI,
          C]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the process of meiosis, and
        explain the role of genes in the transmission of hereditary characteristics'
      specific:
      - code: D3.1
        text: explain the process of meiosis in terms of cell division and the movement of chromosomes
      - code: D3.2
        text: explain how the concepts of DNA, genes, chromosomes, alleles, mitosis, and meiosis account
          for the transmission of hereditary characteristics from generation to generation
      - code: D3.3
        text: explain the concepts of genotype, phenotype, dominance, recessiveness, and sex linkage
      - code: D3.4
        text: describe some genetic disorders that are caused by chromosomal abnormalities (e.g., non-disjunction)
          or other genetic mutations
      - code: D3.5
        text: describe reproductive technologies such as cloning, artificial insemination, and in vitro
          fertilization
  - code: E
    title: Anatomy of Mammals
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the social or economic
        impact of a technology used to treat systems in the human body, and the impact of lifestyle choices
        on human health'
      specific:
      - code: E1.1
        text: analyse the social or economic impact of a medical device or technology related to the treatment
          of the human circulatory, respiratory, or digestive system (e.g., a pacemaker, a heart-lung
          bypass machine, kidney dialysis) [AI, C]
      - code: E1.2
        text: analyse the impact of various lifestyle choices on human health and body systems (e.g.,
          the impact of excessive alcohol consumption on the liver; of smoking on the respiratory system;
          of loud noise on the auditory system)
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate, through laboratory inquiry
        or computer simulation, the anatomy, physiology, and response mechanisms of mammals'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to animal anatomy, including, but not limited to: systolic
          contraction, diastolic pressure, diffusion gradient, inhalation, exhalation, coronary, cardiac,
          ulcer, asthma, and constipation [C]'
      - code: E2.2
        text: use medical equipment (e.g., a stethoscope, a sphygmomanometer) to monitor a human system,
          and interpret the data collected [PR, AI]
      - code: E2.3
        text: plan and conduct an inquiry to determine the effects of specific variables on the human
          body (e.g., the effects of exercise and rest on heart rates) [IP, PR, AI]
      - code: E2.4
        text: perform a laboratory or computer-simulated dissection of a mammal to identify organs, and
          explain the relationships between the structures and functions of body systems [PR, AI]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the structure, function, and
        interactions of the circulatory, digestive, and respiratory systems of mammals'
      specific:
      - code: E3.1
        text: describe the anatomy and physiology of the circulatory system (including the atrium, ventricles,
          valves, aorta, pulmonary artery, vena cava, capillaries, veins, arteries, blood cells, and platelets),
          the mechanisms of blood pressure, and the function of the spleen
      - code: E3.2
        text: describe the anatomy and physiology of the respiratory system (including the nasal cavity,
          trachea, larynx, bronchi, bronchioles, alveoli, and oxygenated and deoxygenated blood) and the
          mechanisms of gas exchange and respiration
      - code: E3.3
        text: describe the anatomy and physiology of the digestive system (including the mouth, epiglottis,
          esophagus, stomach, intestines, liver, and pancreas), the mechanisms of peristalsis, absorption,
          and mechanical and chemical digestion, and the function of the kidneys
      - code: E3.4
        text: explain some of the mechanisms of interaction between a mammal’s different body systems
          (e.g., the exchange of oxygen and carbon dioxide between the respiratory and circulatory systems)
  - code: F
    title: Plants in the Natural Environment
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the roles of plants
        in ecosystems, and assess the impact of human activities on the balance of plants within those
        ecosystems'
      specific:
      - code: F1.1
        text: analyse, on the basis of research, and report on ways in which plants can be used to sustain
          ecosystems [IP, PR, AI, C]
      - code: F1.2
        text: assess the positive and negative impact of human activities on the natural balance of plants
          (e.g., crop rotation, the use of fertilizers and herbicides, the introduction of new species)
          [AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate some of the factors that
        affect plant growth'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to plants in the environment, including, but not limited
          to: xylem, phloem, chloroplast, pistil, stamen, nitrogen fixation, and tropism [C]'
      - code: F2.2
        text: investigate various techniques of plant propagation (e.g., leaf cutting, stem cutting, root
          cutting, seed germination, traditional Aboriginal practices) [PR]
      - code: F2.3
        text: investigate how chemical compounds (e.g., fertilizers, herbicides, pesticides) and physical
          factors (e.g., amount of sun and water, quality of soil, pH of soil) affect plant growth [PR,
          AI]
      - code: F2.4
        text: investigate plant tropism by growing and observing plants in a variety of natural and human-made
          environments [PR]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the structure and physiology
        of plants and their role in the natural environment'
      specific:
      - code: F3.1
        text: describe the structure and physiology of the specialized plant tissues involved in conduction,
          support, storage, and photosynthesis
      - code: F3.2
        text: explain the chemical changes and energy transformations associated with the process of photosynthesis,
          and compare the reactants (i.e., carbon dioxide, radiant energy, water) to the products (i.e.,
          glucose, oxygen)
      - code: F3.3
        text: compare the various means of sexual reproduction (e.g., pollination) and asexual reproduction
          (e.g., grafting, vegetative propagation, cloning) in plants
      - code: F3.4
        text: explain the various roles of plants in the sustainability of the natural environment (e.g.,
          in nutrient cycles, in the water cycle, in erosion control, in wildlife habitats)
      - code: F3.5
        text: explain the relationship between the structure of a plant and its external environment,
          and describe the adaptive attributes that result in natural variation in plant structure (e.g.,
          environmental variables cause variation in leaves within a single plant; in the Arctic, the
          wild crocus grows close to the ground and is covered with fine hairs)
      - code: F3.6
        text: explain the role of plant tropism (e.g., response to stimuli such as light, gravity, and
          humidity) in a plant’s survival
