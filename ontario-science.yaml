  - code: B
    title: Kinematics
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: analyse technologies that apply
        concepts related to kinematics, and assess the technologies’ social and environmental impact'
      specific:
      - code: B1.1
        text: analyse, on the basis of research, a technology that applies concepts related to kinematics
          (e.g., devices used to measure speed in sports; rocket accelerators; motion-detecting sensors
          for security systems; speedometers in automobiles) [IP, PR, AI, C]
      - code: B1.2
        text: assess the impact on society and the environment of a technology that applies concepts related
          to kinematics (e.g., photo radar helps prevent vehicular accidents and reduces fuel consumption
          associated with excessive speeding) [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate, in qualitative and quantitative
        terms, uniform and non-uniform linear motion, and solve related problems'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to kinematics, including, but not limited to: time,
          distance, position, displacement, speed, velocity, and acceleration [C]'
      - code: B2.2
        text: analyse and interpret position–time, velocity–time, and acceleration–time graphs of motion
          in one dimension (e.g., use tangent slopes to create velocity–time graphs from position–time
          graphs and acceleration–time graphs from velocity–time graphs; use the area under the curve
          to create position– time graphs from velocity–time graphs and velocity–time graphs from acceleration–time
          graphs) [AI, C]
      - code: B2.3
        text: use a velocity–time graph for constant acceleration to derive the equation for average velocity
          [e.g., vav = (v1 + v2)/2] and the equations for displacement [e.g., Δd = ((v1 + v2)/2)Δt, Δd
          = vΔt + ½a (Δt 2 )], and solve simple problems in one dimension using these equations [AI]
      - code: B2.4
        text: conduct an inquiry into the uniform and non-uniform linear motion of an object (e.g., use
          probeware to record the motion of a cart moving at a constant velocity or a constant acceleration;
          view a computer simulation of an object attaining terminal velocity; observe a video of a bouncing
          ball or a skydiver; observe the motion of a balloon with a small mass suspended from it) [PR]
      - code: B2.5
        text: solve problems involving distance, position, and displacement (e.g., find total displacement
          using a scale vector diagram and vector components, and compare it to total distance travelled)
          [AI, C]
      - code: B2.6
        text: plan and conduct an inquiry into the motion of objects in one dimension, using vector diagrams
          and uniform acceleration equations [IP, PR, C]
      - code: B2.7
        text: solve problems involving uniform and non-uniform linear motion in one and two dimensions,
          using graphical analysis and algebraic equations [AI, C]
      - code: B2.8
        text: use kinematic equations to solve problems related to the horizontal and vertical components
          of the motion of a projectile (e.g., a cannon ball shot horizontally off a cliff, a ball rolling
          off a table, a golf ball launched at a 45º angle to the horizontal) [AI, C]
      - code: B2.9
        text: conduct an inquiry into the projectile motion of an object, and analyse, in qualitative
          and quantitative terms, the relationship between the horizontal and vertical components (e.g.,
          airborne time, range, maximum height, horizontal velocity, vertical velocity) [PR, AI]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of uniform and non-uniform linear
        motion, in one and two dimensions'
      specific:
      - code: B3.1
        text: distinguish between the terms constant, instantaneous, and average with reference to speed,
          velocity, and acceleration, and provide examples to illustrate each term
      - code: B3.2
        text: distinguish between, and provide examples of, scalar and vector quantities as they relate
          to the description of uniform and non-uniform linear motion (e.g., time, distance, position,
          velocity, acceleration)
      - code: B3.3
        text: describe the characteristics and give examples of a projectile’s motion in vertical and
          horizontal planes
  - code: C
    title: Forces
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse and propose improvements
        to technologies that apply concepts related to dynamics and Newton’s laws, and assess the technologies’
        social and environmental impact'
      specific:
      - code: C1.1
        text: analyse, with reference to Newton’s laws, a technology that applies these laws (e.g., extremely
          low friction bearings, near frictionless carbon, different types of athletic shoes, roller coasters),
          and propose ways to improve its performance [AI, C]
      - code: C1.2
        text: evaluate the impact on society and the environment of technologies that use the principles
          of force (e.g., prosthetics, plastic car bodies) [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate, in qualitative and quantitative
        terms, net force, acceleration, and mass, and solve related problems'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to forces, including, but not limited to: mass, time,
          speed, velocity, acceleration, friction, gravity, normal force, and free-body diagrams [C]'
      - code: C2.2
        text: conduct an inquiry that applies Newton’s laws to analyse, in qualitative and quantitative
          terms, the forces acting on an object, and use free-body diagrams to determine the net force
          and the acceleration of the object [PR, AI, C]
      - code: C2.3
        text: conduct an inquiry into the relationship between the acceleration of an object and its net
          force and mass (e.g., view a computer simulation of an object attaining terminal velocity; observe
          the motion of an object subject to friction; use electronic probes to observe the motion of
          an object being pulled across the floor), and analyse the resulting data [PR, AI]
      - code: C2.4
        text: analyse the relationships between acceleration and applied forces such as the force of gravity,
          normal force, force of friction, coefficient of static friction, and coefficient of kinetic
          friction, and solve related problems involving forces in one dimension, using free-body diagrams
          and algebraic equations (e.g., use a drag sled to find the coefficient of friction between two
          surfaces) [AI, C]
      - code: C2.5
        text: plan and conduct an inquiry to analyse the effect of forces acting on objects in one dimension,
          using vector diagrams, free-body diagrams, and Newton’s laws [IP, PR, AI, C]
      - code: C2.6
        text: analyse and solve problems involving the relationship between the force of gravity and acceleration
          for objects in free fall [AI]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the relationship between changes
        in velocity and unbalanced forces in one dimension'
      specific:
      - code: C3.1
        text: distinguish between, and provide examples of, different forces (e.g., friction, gravity,
          normal force), and describe the effect of each type of force on the velocity of an object
      - code: C3.2
        text: explain how the theories and discoveries of Galileo and Newton advanced knowledge of the
          effects of forces on the motion of objects
      - code: C3.3
        text: state Newton’s laws, and apply them, in qualitative terms, to explain the effect of forces
          acting on objects
      - code: C3.4
        text: describe, in qualitative and quantitative terms, the relationships between mass, gravitational
          field strength, and force of gravity
  - code: D
    title: Energy and Society
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: analyse technologies that apply
        principles of and concepts related to energy transformations, and assess the technologies’ social
        and environmental impact'
      specific:
      - code: D1.1
        text: analyse, using the principles of energy transformations, a technology that involves the
          transfer and transformation of thermal energy (e.g., a power station, an air conditioner, a
          fuel cell, a laser printer) [AI, C]
      - code: D1.2
        text: assess, on the basis of research, how technologies related to nuclear, thermal, or geothermal
          energy affect society and the environment (e.g., thermal regulating units, radiopharmaceuticals,
          dry-steam power plants, ground-source heat pumps) [IP, PR, AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate energy transformations
        and the law of conservation of energy, and solve related problems'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to energy transformations, including, but not limited
          to: mechanical energy, gravitational potential energy, kinetic energy, work, power, fission,
          fusion, heat, heat capacity, temperature, and latent heat [C]'
      - code: D2.2
        text: solve problems relating to work, force, and displacement along the line of force [AI]
      - code: D2.3
        text: use the law of conservation of energy to solve problems in simple situations involving work,
          gravitational potential energy, kinetic energy, and thermal energy and its transfer (heat) [AI]
      - code: D2.4
        text: plan and conduct inquiries involving transformations between gravitational potential energy
          and kinetic energy (e.g., using a pendulum, a falling ball, an object rolling down a ramp) to
          test the law of conservation of energy [IP, PR]
      - code: D2.5
        text: solve problems involving the relationship between power, energy, and time [AI]
      - code: D2.6
        text: conduct inquiries and solve problems involving the relationship between power and work (e.g.,
          the power of a student using different types of fitness equipment) [PR, AI]
      - code: D2.7
        text: compare and contrast the input energy, useful output energy, and per cent efficiency of
          selected energy generation methods (e.g., hydroelectric, thermal, geothermal, nuclear fission,
          nuclear fusion, wind, solar) [AI, C]
      - code: D2.8
        text: investigate the relationship between the concepts of conservation of mass and conservation
          of energy, and solve problems using the mass–energy equivalence [PR, AI]
      - code: D2.9
        text: conduct an inquiry to determine the specific heat capacity of a single substance (e.g.,
          aluminum, iron, brass) and of two substances when they are mixed together (e.g., the heat lost
          by a sample of hot water and the heat gained by a sample of cold water when the two samples
          are mixed together) [PR]
      - code: D2.10
        text: solve problems involving changes in temperature and changes of state, using algebraic equations
          (e.g., Q = mcΔT, Q = mLf , Q = mLv) [AI, C]
      - code: D2.11
        text: draw and analyse heating and cooling curves that show temperature changes and changes of
          state for various substances [AI, C]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of work, efficiency, power, gravitational
        potential energy, kinetic energy, nuclear energy, and thermal energy and its transfer (heat)'
      specific:
      - code: D3.1
        text: describe a variety of energy transfers and transformations, and explain them using the law
          of conservation of energy
      - code: D3.2
        text: explain the concepts of and interrelationships between energy, work, and power, and identify
          and describe their related units
      - code: D3.3
        text: 'explain the following concepts, giving examples of each, and identify their related units:
          thermal energy, kinetic energy, gravitational potential energy, heat, specific heat capacity,
          specific latent heat, power, and efficiency'
      - code: D3.4
        text: identify, qualitatively, the relationship between efficiency and thermal energy transfer
      - code: D3.5
        text: describe, with reference to force and displacement along the line of force, the conditions
          that are required for work to be done
      - code: D3.6
        text: describe and compare nuclear fission and nuclear fusion
      - code: D3.7
        text: explain, using the kinetic molecular theory, the energy transfer that occurs during changes
          of state
      - code: D3.8
        text: distinguish between and provide examples of conduction, convection, and radiation
      - code: D3.9
        text: identify and describe the structure of common nuclear isotopes (e.g., hydrogen, deuterium,
          tritium)
      - code: D3.10
        text: compare the characteristics of (e.g., mass, charge, speed, penetrating power, ionizing ability)
          and safety precautions related to alpha particles, beta particles, and gamma rays
      - code: D3.11
        text: explain radioactive half-life for a given radioisotope, and describe its applications and
          their consequences
      - code: D3.12
        text: explain the energy transformations that occur within a nuclear power plant, with reference
          to the laws of thermodynamics (e.g., nuclear fission results in the liberation of energy, which
          is converted into thermal energy; the thermal energy is converted into electrical energy and
          waste heat, using a steam turbine)
  - code: E
    title: Waves and Sound
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: analyse how mechanical waves
        and sound affect technology, structures, society, and the environment, and assess ways of reducing
        their negative effects'
      specific:
      - code: E1.1
        text: analyse how properties of mechanical waves and sound influence the design of structures
          and technological devices (e.g., the acoustical design of a concert hall; the design of headphones,
          hearing aids, musical instruments, wave pools) [AI, C]
      - code: E1.2
        text: analyse the negative impact that mechanical waves and/or sound can have on society and the
          environment, and assess the effectiveness of a technology intended to reduce this impact [AI,
          C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate, in qualitative and quantitative
        terms, the properties of mechanical waves and sound, and solve related problems'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to mechanical waves and sound, including, but not limited
          to: longitudinal wave, transverse wave, frequency, period, cycle, amplitude, phase, wavelength,
          velocity, superposition, constructive interference, destructive interference, standing waves,
          and resonance [C]'
      - code: E2.2
        text: conduct laboratory inquiries or computer simulations involving mechanical waves and their
          interference (e.g., using a mass oscillating on a spring, a mass oscillating on a pendulum,
          the oscillation in a string instrument) [PR]
      - code: E2.3
        text: plan and conduct inquiries to determine the speed of waves in a medium (e.g., a vibrating
          air column, an oscillating string of a musical instrument), compare theoretical and empirical
          values, and account for discrepancies [IP, PR, AI, C]
      - code: E2.4
        text: investigate the relationship between the wavelength, frequency, and speed of a wave, and
          solve related problems [PR, AI]
      - code: E2.5
        text: analyse the relationship between a moving source of sound and the change in frequency perceived
          by a stationary observer (i.e., the Doppler effect) [AI]
      - code: E2.6
        text: predict the conditions needed to produce resonance in vibrating objects or air columns (e.g.,
          in a wind instrument, a string instrument, a tuning fork), and test their predictions through
          inquiry [IP, PR, AI]
      - code: E2.7
        text: analyse the conditions required to produce resonance in vibrating objects and/or in air
          columns (e.g., in a string instrument, a tuning fork, a wind instrument), and explain how resonance
          is used in a variety of situations (e.g., to produce different notes in musical instruments;
          to limit undesirable vibrations in suspension bridges; to design buildings so that they do not
          resonate at the frequencies produced by earthquakes) [AI, C]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the properties of mechanical
        waves and sound and of the principles underlying their production, transmission, interaction,
        and reception'
      specific:
      - code: E3.1
        text: distinguish between longitudinal and transverse waves in different media, and provide examples
          of both types of waves
      - code: E3.2
        text: explain the components of resonance, and identify the conditions required for resonance
          to occur in vibrating objects and in various media (e.g., with reference to a musical instrument,
          a child on a swing, the Tacoma Narrows Bridge)
      - code: E3.3
        text: explain and graphically illustrate the principle of superposition with respect to standing
          waves and beat frequencies
      - code: E3.4
        text: identify the properties of standing waves, and, for both mechanical and sound waves, explain
          the conditions required for standing waves to occur
      - code: E3.5
        text: explain the relationship between the speed of sound in various media and the particle nature
          of the media (e.g., the speed of sound in solids, liquids, and gases; the speed of sound in
          warm and cold air)
      - code: E3.6
        text: explain selected natural phenomena (e.g., echo location, or organisms that produce or receive
          infrasonic, audible, or ultrasonic sound) with reference to the characteristics and properties
          of waves
  - code: F
    title: Electricity and Magnetism
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the social, economic,
        and environmental impact of electrical energy production and technologies related to electromagnetism,
        and propose ways to improve the sustainability of electrical energy production'
      specific:
      - code: F1.1
        text: analyse the social and economic impact of technologies related to electromagnetism (e.g.,
          particle accelerators, mass spectrometers, magnetic levitation [maglev] trains, magnetic resonance
          imaging [MRI], electromagnetic pulses after nuclear explosions) [AI, C]
      - code: F1.2
        text: analyse the efficiency and the environmental impact of one type of electrical energy production
          (e.g., from hydroelectric, fossil fuel–burning, wind, solar, geothermal, or nuclear sources),
          and propose ways to improve the sustainability of electrical energy production [AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate, in qualitative and quantitative
        terms, magnetic fields and electric circuits, and solve related problems'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to electricity and magnetism, including, but not limited
          to: direct current, alternating current, conventional current, electron flow, electrical potential
          difference, electrical resistance, power, energy, step-up transformer, and step-down transformer
          [C]'
      - code: F2.2
        text: analyse diagrams of series, parallel, and mixed circuits with reference to Ohm’s law (V
          = IR) and Kirchhoff’s laws [AI]
      - code: F2.3
        text: design and build real or computer-simulated mixed direct current (DC) circuits, and explain
          the circuits with reference to direct current, potential difference, and resistance [PR, C]
      - code: F2.4
        text: conduct an inquiry to identify the characteristics and properties of magnetic fields (e.g.,
          using magnetic compasses, iron filings, and electric and magnetic field sensors) [PR]
      - code: F2.5
        text: investigate, through laboratory inquiry or computer simulation, the magnetic fields produced
          by an electric current flowing through a long straight conductor and a solenoid (e.g., use sensors
          to map the magnetic field around a solenoid) [PR]
      - code: F2.6
        text: solve problems involving energy, power, potential difference, current, and the number of
          turns in the primary and secondary coils of a transformer [AI]
      - code: F2.7
        text: investigate electromagnetic induction, and, using Lenz’s law, the law of conservation of
          energy, and the right-hand rule, explain and illustrate the direction of the electric current
          induced by a changing magnetic field [PR, AI, C]
      - code: F2.8
        text: construct a prototype of a device that uses the principles of electromagnetism (e.g., an
          electric bell, loudspeaker, ammeter, electric motor, electric generator), and test and refine
          their device [PR, AI]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the properties of magnetic
        fields, the principles of current and electron flow, and the operation of selected technologies
        that use these properties and principles to produce and transmit electrical energy'
      specific:
      - code: F3.1
        text: describe the properties of magnetic fields in permanent magnets and electromagnets (e.g.,
          the three-dimensional nature of fields, continuous field lines, fields around current-carrying
          conductors and coils)
      - code: F3.2
        text: explain, by applying the right-hand rule, the direction of the magnetic field produced when
          electric current flows through a long straight conductor and through a solenoid
      - code: F3.3
        text: distinguish between conventional current and electron flow in relation to the left- and
          right-hand rules
      - code: F3.4
        text: explain Ohm’s law, Kirchhoff’s laws, Oersted’s principle, the motor principle, Faraday’s
          law, and Lenz’s law in relation to electricity and magnetism
      - code: F3.5
        text: describe the production and interaction of magnetic fields, using diagrams and the principles
          of electromagnetism (e.g., Oersted’s principle, the motor principle, Faraday’s law, Lenz’s law)
      - code: F3.6
        text: explain the operation of an electric motor and a generator, including the roles of their
          respective components
      - code: F3.7
        text: distinguish between alternating current (AC) and direct current, and explain why alternating
          current is presently used in the transmission of electrical energy
      - code: F3.8
        text: describe the components of step-up and step-down transformers, and, using concepts and principles
          related to electric current and magnetic fields, explain the operation of these transformers
      - code: F3.9
        text: describe and explain safety precautions (e.g., “call before you dig”, current-limiting outlets
          in bathrooms) related to electrical circuits and higher transmission voltages (e.g., with reference
          to transformer substations, buried cables, overhead power lines)
- course: SVN3E
  title: Environmental Science, Grade 11, Workplace Preparation
  grade: 11
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate relevant scientific questions about observed relationships, ideas, problems, or
          issues, make informed predictions, and/or formulate educated hypotheses to focus inquiries or
          research
      - code: A1.2
        text: select appropriate instruments (e.g., pH probes, plant tags, soil markers) and materials
          (e.g., botanical keys, personal protection devices, soil test kits), and identify appropriate
          methods, techniques, and procedures, for each inquiry
      - code: A1.3
        text: identify and locate a variety of print and electronic sources (e.g., Material Safety Data
          Sheets, appliance manuals, hydro bills, the Live Safe! Work Smart! website) that enable them
          to address research topics fully and appropriately
      - code: A1.4
        text: apply knowledge and understanding of safe laboratory practices and procedures when planning
          investigations by correctly interpreting Workplace Hazardous Materials Information System (WHMIS)
          symbols; by using appropriate techniques for handling and storing laboratory equipment and materials
          and dis- posing of laboratory materials; and by using appropriate personal protection
      - code: A1.5
        text: conduct inquiries, controlling relevant variables, adapting or extending procedures as required,
          and using appropriate materials and equipment safely, accurately, and effectively, to collect
          observations and data
      - code: A1.6
        text: compile accurate data from laboratory and other sources, and organize and record the data,
          using appropriate formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from a variety of appropriate
          sources, including electronic, print, and/or human sources, using suitable formats and an accepted
          form of academic documentation
      - code: A1.8
        text: synthesize, analyse, interpret, and evaluate qualitative and/or quantitative data to determine
          whether the evidence supports or refutes the initial prediction or hypothesis and whether it
          is consistent with scientific theory; identify sources of bias and/or error; and suggest improvements
          to the inquiry to reduce the likelihood of error
      - code: A1.9
        text: analyse the information gathered from research sources for logic, accuracy, reliability,
          adequacy, and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
          with reference to scientific knowledge
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, graphic organizers, simulations, models, workplace
          labels)
      - code: A1.12
        text: use appropriate numeric, symbolic, and graphic modes of representation, and appropriate
          units of measurement (e.g., SI and imperial units)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places or significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers related to the fields of science under
        study, and describe contributions of scientists, including Canadians, to those fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., hydro meter reader, hospitality employee, waste management operator, custodian) and the
          education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Mark Schacter, Sheila
          Watt-Cloutier, Marlo Reynolds, J. Ross MacKay, Linda Duncan), to the fields under study
  - code: B
    title: Human Impact on the Environment
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: analyse selected current environmental
        problems in terms of the role human activities have played in creating or perpetuating them, and
        propose possible solutions to one such problem'
      specific:
      - code: B1.1
        text: propose possible solutions, on the basis of research, to a current practical environmental
          problem that is caused, directly or indirectly, by human activities [IP, PR, AI, C]
      - code: B1.2
        text: analyse the risks and benefits to the environment of human recreational activities and the
          leisure industry [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate air, soil, and water quality
        in natural and disturbed environments, using appropriate technology'
      specific:
      - code: B2.1
        text: 'use appropriate terminology relating to the environmental impact of human activity, including,
          but not limited to: carbon footprint, carbon neutral, biodegradable, biodiversity, carrying
          capacity, sustainability, and invasive and native species [C]'
      - code: B2.2
        text: plan and conduct an inquiry, using appropriate technology, to compare soil quality in natural
          and disturbed environments (e.g., compare the phosphorous content, pH, organic matter content,
          water content, water-holding capacity, nutrient content, porosity, and/or bulk density of soil
          from a forest or meadow and soil from a garden or farmer’s field that has been treated with
          chemical fertilizer) [IP, PR, AI]
      - code: B2.3
        text: plan and conduct an inquiry, using appropriate technology, to compare water quality in natural
          and disturbed environments (e.g., compare the pH, ion content, temperature, dissolved oxygen
          content, hardness, turbidity, biological oxygen demand [BOD], and/or fecal coliform of tap water,
          water from a pond or stream, and water from a drainage ditch) [IP, PR, AI]
      - code: B2.4
        text: analyse and interpret data on particulate matter in air samples from several different regions
          of Canada, using prepared data from a variety of sources (e.g., the Ontario Ministry of the
          Environment – Air Quality Ontario, Environment Canada) [AI]
      - code: B2.5
        text: plan and conduct a waste audit of their home or school [IP, PR]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of some of the ways in which human
        activities affect the environment and how the impact of those activities is measured and monitored'
      specific:
      - code: B3.1
        text: identify the basic components of soil, water, and air, and describe some of the effects
          of human activity on soil, water, and air quality (e.g., the effects of industrial or vehicle
          emissions on air quality; of chemical spills on soil quality; of chlorination on water quality)
      - code: B3.2
        text: explain the concept of the cycling of substances in ecosystems (e.g., fertilizers made from
          biosolids leach into ground water or run off into rivers and streams, where the chemicals are
          absorbed by aquatic life, which is in turn consumed by humans)
      - code: B3.3
        text: explain common methods of sampling soil, water, and air for analysis (e.g., soil core sampling,
          depth integrated sampling, stack sampling systems) and of monitoring soil, water, and air quality
          over time
      - code: B3.4
        text: explain the concept of a “carbon footprint” and how it is used to measure the impact on
          the environment of a range of human activities
      - code: B3.5
        text: explain the effects of human activity on an aquatic or terrestrial ecosystem (e.g., the
          impact of fertilizer run-off, acid precipitation, or an oil spill on an aquatic ecosystem)
      - code: B3.6
        text: explain how human activities (e.g., agriculture, travel, the purchase of exotic pets, importing
          and exporting, releasing domesticated fish into fresh water environments, the use of live bait)
          have led to the introduction of invasive species, and why it is important to measure and monitor
          the impact of invasive species on native species
  - code: C
    title: Human Health and the Environment
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the effects on human
        health of environmental contaminants and a significant environmental phenomenon'
      specific:
      - code: C1.1
        text: assess, on the basis of research, the effects on human health of a significant environmental
          phenomenon (e.g., the ice storm of 1998 in central Canada, the European heatwave of 2003), and
          communicate their findings [IP, PR, AI, C]
      - code: C1.2
        text: analyse how environmental contaminants can affect the health of different populations in
          Canada (e.g., mercury contamination in streams and rivers in Northern Ontario where Aboriginal
          people fish, toxins in Arctic sea mammals hunted by Inuit, smog in large cities) [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate how different environmental
        factors can affect people’s health and their lifestyle choices'
      specific:
      - code: C2.1
        text: 'use appropriate vocabulary related to human health and the environment, including, but
          not limited to: smog, environmental contaminants, pathogens, inhalation, ingestion, and absorption
          [C]'
      - code: C2.2
        text: investigate, using a research process, and report on an environmental factor that can have
          an impact on human health (e.g., smog, ultraviolet [UV] rays, bacteria, pesticide residue),
          and explain how their personal lifestyle choices can affect its impact (e.g., avoiding strenuous
          physical activity on days when there is a smog alert can reduce the severity of respiratory
          ailments; lying on the beach without sunscreen or sun protective clothing during peak UV hours
          can increase the risk of skin cancer) [IP, PR, AI, C]
      - code: C2.3
        text: investigate the characteristics of a personal protective device or substance (e.g., sunscreen,
          mosquito repellent, respiratory mask, sun protective clothing) and whether the device or substance
          is effective in protecting a person from an environmental factor that can affect human health
          [PR, AI]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the ways in which environmental
        factors can affect human health and how their impact can be reduced'
      specific:
      - code: C3.1
        text: describe common environmental factors, including pollution and environmental contaminants
          (e.g., air, noise, soil, and water pollution; UV rays; heat; heavy metals; work- place chemicals;
          pathogens), and explain how they can affect human health
      - code: C3.2
        text: describe various ways in which environmental contaminants can enter the human body (e.g.,
          inhalation, ingestion, absorption)
      - code: C3.3
        text: explain how the human body can react to exposure to a variety of environmental factors (e.g.,
          rashes, asthma, mercury poisoning, hearing loss, diseases such as malaria and cancer)
      - code: C3.4
        text: describe medical and non-medical ways to protect oneself from the effects of harmful environmental
          factors (e.g., vaccination or medication, washing of fruits and vegetables, use of sunscreen
          or insect repellent, use of personal protective devices)
      - code: C3.5
        text: describe good personal hygiene and household cleanliness practices that reduce health risks
          resulting from environmental contaminants (e.g., thorough hand washing, use of air filters,
          reduced use of household chemicals)
  - code: D
    title: Energy Conservation
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate initiatives and technological
        innovations related to energy consumption and conservation, and assess their impact on personal
        lifestyles, social attitudes, and the environment'
      specific:
      - code: D1.1
        text: assess, on the basis of research, the impact that initiatives for reducing energy consumption
          and waste have on personal lifestyles, societal attitudes, and the environment (e.g., local,
          provincial, or national initiatives by government, business, or non-governmental organizations)
          [IP, PR, AI, C]
      - code: D1.2
        text: evaluate, on the basis of research, some of the advantages or disadvantages of technological
          innovations that contribute to the production of renewable energy and/or aid in conservation
          (e.g., bio-oil, biodiesel, wind tur-bines, improved insulation, programmable thermostats) [IP,
          PR, AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate various methods of conserving
        energy and improving energy efficiency'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to energy conservation and consumption, including,
          but not limited to: conventional source, alternative source, efficiency, watt, kilowatt-hour
          [kWh], joule, BTU, gas meter, electric meter, thermostat, and EnerGuide [C]'
      - code: D2.2
        text: determine the energy consumption of their household over a given time period by reading
          and interpreting gas and/or electric meters, calculate the cost of consumption (e.g., the number
          of kWh × cost per kWh, cubic metres of gas × cost per cubic metre), and suggest ways in which
          the household could conserve energy [PR, AI, C]
      - code: D2.3
        text: use a research or inquiry process to compare the efficiency of different types or brands
          of a common household appliance (e.g., different brands of kettles, fans, or refrigerators;
          natural gas and electric water heaters) or of audio-visual equipment (e.g., different types
          of computer monitors), and report their findings [IP, PR, AI, C]
      - code: D2.4
        text: conduct a risk-benefit analysis of different types of electricity generation (e.g., fossil
          fuel, hydro, nuclear, wind, and/or solar power) [PR, AI]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the basic principles of energy
        production, with reference to both renewable and non-renewable sources, and of various methods
        of energy conservation'
      specific:
      - code: D3.1
        text: explain the basic principles and characteristics of various types of power generation from
          non-renewable sources (e.g., coal, oil, natural gas, nuclear) and renewable sources (e.g., hydroelectric,
          tidal, geothermal, solar, wind, hydrogen fuel cells)
      - code: D3.2
        text: compare and contrast renewable and non-renewable energy sources, using criteria such as
          availability, cost, and environmental impact (e.g., compare a fossil fuel and geothermal energy,
          using a graphic organizer)
      - code: D3.3
        text: describe methods of energy conservation (e.g., the replacement of incandescent bulbs with
          compact fluorescent bulbs, the replacement of a manual thermostat with a programmable one, the
          installation of more energy-efficient windows) and some policies that are intended to manage
          energy demand in the home and the workplace (e.g., variable pricing, which increases the price
          of electricity during peak hours)
      - code: D3.4
        text: describe several criteria used in the construction of energy-efficient buildings (e.g.,
          “smart homes”, in which the use of light, heat, and power for equipment can be programmed; R-2000
          homes; straw-bale houses)
  - code: E
    title: Natural Resource Science and Management
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: assess the environmental impact
        of the harvesting and/or extraction of resources, including ways of reducing this impact, and
        analyse threats to the sustainability of natural resources'
      specific:
      - code: E1.1
        text: assess the environmental impact of industrial practices related to the extracting or harvesting
          of natural resources, and describe ways in which that impact can be monitored and minimized
          [AI, C]
      - code: E1.2
        text: analyse, on the basis of research, the impact that an environmental contaminant, parasite,
          or bacteria has on the sustainability of a natural resource in Canada (e.g., the effects of
          PCBs on Arctic sea mammals, of sea lice on farmed and wild salmon, of E. coli on water resources)
          [IP, PR, AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate methods scientists use
        to classify and monitor natural resources, and conduct investigations using those methods'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to natural resources and resource management, including,
          but not limited to: population, bioamplification, sampling size, sustainability, ore, mineral,
          tailings, and succession [C]'
      - code: E2.2
        text: identify and classify a variety of natural resources found in Canada, using appropriate
          classification systems (e.g., dichotomous keys, botanical keys, tree identification guides,
          wildlife guides, mineral tests) [PR, AI]
      - code: E2.3
        text: investigate, through laboratory inquiry, field study, or simulations, some of the methods
          and procedures used by scientists to monitor biodiversity in different environments (e.g., making
          plant tallies in forests; tagging or marking ground vegetation species in fields; tagging and
          tracking wildlife with the global positioning system in remote areas; using aquatic dip nets
          for sampling organisms in shallow ponds or streams) [PR]
      - code: E2.4
        text: conduct an inventory of a local environment (e.g., a field, a pond), using appropriate techniques
          and methods (e.g., plant tallies, tags, keys), and display the results graphically [PR, C]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the sustainable use of resources
        and its relationship to the biodiversity and sustainability of ecosystems'
      specific:
      - code: E3.1
        text: describe the main types of natural resources found in Canada (e.g., forests, minerals, fisheries,
          wildlife, water, fossil fuels)
      - code: E3.2
        text: describe the characteristics and properties that make a natural resource viable for use
          (e.g., the size, type, and location of trees; the value, location, and extraction and processing
          costs of minerals), and explain the importance of managing natural resources to ensure sustainability
          and biodiversity
      - code: E3.3
        text: describe a variety of methods used to extract or harvest natural resources (e.g., drag nets,
          strip mining, selective cutting of forests)
      - code: E3.4
        text: explain how a variety of sampling techniques (e.g., quadrant sampling, catch-and-release,
          core sampling to measure tree rings, counting annuli in scales to measure the age of fish) are
          used to gather information about natural resources
      - code: E3.5
        text: explain the importance of biodiversity to the sustainability of life within an ecosystem
          (e.g., variability among biotic and abiotic factors within an ecosystem decreases the chance
          that any organism within that ecosystem will become extinct)
      - code: E3.6
        text: describe some methods that scientists use to monitor biodiversity in aquatic and terrestrial
          environments (e.g., field data collection, aerial and satellite imagery)
  - code: F
    title: The Safe And Environmentally Responsible Workplace
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: assess workplace25 situations
        with respect to safety and environmental issues, and propose a course of action to address unsafe
        working conditions'
      specific:
      - code: F1.1
        text: analyse unsafe working conditions that can affect young workers in various workplace situations
          (e.g., using information from the Live Safe! Work Smart! website; using information obtained
          during a co-op placement or through experiential learning), and propose a course of action that
          would help to improve one such situation [AI, C]
      - code: F1.2
        text: analyse, on the basis of research, and report on the environmental impact of unsafe handling,
          storage, and disposal of hazardous and non-hazardous workplace materials associated with a particular
          job [IP, PR, AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate a variety of safe and environmentally
        responsible workplace26 practices'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to safety and environmental responsibility in the workplace,
          including, but not limited to: Möbius loop, Material Safety Data Sheet (MSDS), Hazardous Household
          Product Symbols (HHPS), hazardous material, and personal protective equipment (PPE) [C]'
      - code: F2.2
        text: demonstrate proper use of a variety of safety techniques and procedures after completing
          a recognized safety training program (e.g., a “virtual WHMIS” program such as Passport to Safety)
          [PR]
      - code: F2.3
        text: conduct an inventory of hazardous products, safety equipment, and personal protective equipment
          found in a workplace, using an accepted tool (e.g., a FireSmart Assessment test from the Ministry
          of Natural Resources), and communicate the results using a table or checklist [PR, C]
      - code: F2.4
        text: use appropriate techniques for handling, storing, and disposing of teacher-selected materials,
          drawing on Material Safety Data Sheets and Canadian Environmental Protection Act regulations
          (e.g., use appropriate personal protective equipment), and outline proper procedures for handling
          those materials in the workplace [PR, C]
      - code: F2.5
        text: design and report on a plan for reusing, recycling, reducing the volume of, or disposing
          of a hazardous material found in the workplace (e.g., disposing of batteries, reusing motor
          or cooking oils for a different purpose) [IP, C]
      - code: F2.6
        text: investigate the effectiveness of a personal protective device or environmental protection
          device for use in the workplace (e.g., compare two different spill kits for absorbing spills;
          test the key features of a mask for protection from airborne particulate matter; identify the
          appropriate types of eye protection for different situations) [PR, AI]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of general workplace27 safety
        procedures and environmentally responsible practices'
      specific:
      - code: F3.1
        text: describe some of the ways in which implementation of the 4Rs (reduce, reuse, recycle, and
          recover) in the workplace protects the environment (e.g., by reducing the production of garbage
          and recycling materials for daily use), and explain the meaning of different symbols used to
          promote these strategies (e.g., different representations of the Möbius loop [the international
          recycling symbol])
      - code: F3.2
        text: compare some of the features, uses, and environmental implications of Hazardous Household
          Product Symbols and WHMIS hazard symbols
      - code: F3.3
        text: identify and describe common types of biological, physical, and chemical hazards in the
          workplace (e.g., hazards posed by bacteria, noise, work at dangerous heights, use of chemicals
          and other hazardous materials) and associated accident-prevention methods (e.g., sterilization,
          soundproofing, use of five-point safety harnesses, use of safe storage cabinets, safe disposal
          of chemicals)
      - code: F3.4
        text: explain how the use of personal protective equipment (e.g., aluminized gloves, a welding
          shield, ear plugs, a self-contained breathing apparatus, an air-purifying mask) minimizes exposure
          to hazardous materials that can enter the body through ingestion, inhalation, absorption, and
          injection
      - code: F3.5
        text: identify some current workplace procedures, practices, and protocols that help to protect
          the environment (e.g., garbage separation, paper recycling, use of recycled products, “telecommuting”
          to workplaces, practices that conserve water and energy)
- course: SVN3M
  title: Environmental Science, Grade 11, University/College Preparation
  grade: 11
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate relevant scientific questions about observed relationships, ideas, problems, or
          issues, make informed predictions, and/or formulate educated hypotheses to focus inquiries or
          research
      - code: A1.2
        text: select appropriate instruments (e.g., probes, moisture meters, rain gauges), and materials
          (e.g., water-sampling kits, soil-testing kits), and identify appropriate methods, techniques,
          and procedures, for each inquiry
      - code: A1.3
        text: identify and locate a variety of print and electronic sources that enable them to address
          research topics fully and appropriately
      - code: A1.4
        text: apply knowledge and understanding of safe laboratory practices and procedures when planning
          investigations by correctly interpreting Workplace Hazardous Materials Information System (WHMIS)
          symbols; by using appropriate techniques for handling and storing laboratory equipment and materials
          and disposing of laboratory materials; and by using appropriate personal protection
      - code: A1.5
        text: conduct inquiries, controlling relevant variables, adapting or extending procedures as required,
          and using appropriate materials and equipment safely, accurately, and effectively, to collect
          observations and data
      - code: A1.6
        text: compile accurate data from laboratory and other sources, and organize and record the data,
          using appropriate formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from a variety of appropriate
          sources, including electronic, print, and/or human sources, using suitable formats and an accepted
          form of academic documentation
      - code: A1.8
        text: synthesize, analyse, interpret, and evaluate qualitative and/or quantitative data to determine
          whether the evidence supports or refutes the initial prediction or hypothesis and whether it
          is consistent with scientific theory; identify sources of bias and/or error; and suggest improvements
          to the inquiry to reduce the likelihood of error
      - code: A1.9
        text: analyse the information gathered from research sources for logic, accuracy, reliability,
          adequacy, and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
          with reference to scientific knowledge
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric, symbolic, and graphic modes of representation, and appropriate
          units of measurement (e.g., SI and imperial units)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places or significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers related to the fields of science under
        study, and describe the contributions of scientists, including Canadians, to those fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., organic chemist, landscaper, conservationist, air quality technician, personal support
          worker, environmental lawyer) and the education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Pierre Dansereau, Margaret
          Newton, Johan F. Dormaar, Sheila Watt-Cloutier, Severn Cullis-Suzuki), to the fields under study
  - code: B
    title: Scientific Solutions to Contemporary Environmental Challenges
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: analyse social and economic
        issues related to an environmental challenge, and how societal needs influence scientific endeavours
        related to the environment'
      specific:
      - code: B1.1
        text: analyse, on the basis of research, social and economic issues related to a particular environmental
          challenge (e.g., overfishing, deforestation, acid rain, melting of the polar ice cap) and to
          efforts to address it [IP, PR, AI, C]
      - code: B1.2
        text: analyse ways in which societal needs or demands have influenced scientific endeavours related
          to the environment (e.g., the development of drought- and pest-resistant crops to address the
          rising global need for food; research into alternative energy sources in response to demands
          to address the impact on climate change of burning fossil fuels) [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate a range of perspectives
        that have contributed to scientific knowledge about the environment, and how scientific knowledge
        and procedures are applied to address contemporary environmental problems'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to the application of scientific knowledge and procedures
          to environmental issues, including, but not limited to: fact, inference, paradigm, objectivity,
          and causality [C]'
      - code: B2.2
        text: plan and conduct a laboratory inquiry to test a scientific procedure used to address a contemporary
          environmental problem (e.g., an oil spill, acid precipitation) [IP, PR, AI]
      - code: B2.3
        text: investigate, through research or using case studies or computer simulation, how scientific
          knowledge and procedures are applied to address a particular contemporary environmental issue
          (e.g., scientific data on the needs and habits of endangered species are used to develop plans
          to protect threatened species; life-cycle assessments are conducted to determine the total environmental
          impact of a consumer product) [PR, AI]
      - code: B2.4
        text: use a research process to investigate how evidence, theories, and paradigms reflecting a
          range of perspectives have contributed to our scientific knowledge about the environment (e.g.,
          with respect to debates about climate change; regarding the relationship between the cod moratorium
          and seal populations in Atlantic Canada), and communicate their findings [IP, PR, AI, C]
      - code: B2.5
        text: use a research process to locate a media report on a contemporary environmental issue (e.g.,
          climate change, melting of the polar ice cap, deforestation), summarize its arguments, and assess
          their validity from a scientific perspective [IP, PR, AI, C]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of major contemporary environmental
        challenges and how we acquire knowledge about them'
      specific:
      - code: B3.1
        text: identify some major contemporary environmental challenges (e.g., global warming, acid precipitation),
          and explain their causes (e.g., deforestation, carbon and sulfur emissions) and effects (e.g.,
          desertification, the creation of environmental refugees, the destruction of aquatic and terrestrial
          habitats)
      - code: B3.2
        text: describe how scientists use a variety of processes (e.g., environmental impact assessments,
          environmental scans) to solve problems and answer questions related to the environment
      - code: B3.3
        text: explain how new evidence affects scientific knowledge about the environment and leads to
          modifications of theory and/or shifts in paradigms (e.g., the impact of evidence of the effects
          of carbon dioxide emissions on theories of global warming)
      - code: B3.4
        text: explain how an environmental challenge has led to advances in science or technology (e.g.,
          scrubbers on smokestacks to decrease sulfur dioxide emissions, hybrid cars)
      - code: B3.5
        text: describe a variety of human activities that have led to environmental problems (e.g., burning
          fossil fuels for transportation or power generation; waste disposal) and/or contributed to their
          solution (e.g., the development of renewable sources of energy; programs to reduce, reuse, and
          recycle)
  - code: C
    title: Human Health and the Environment
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse initiatives, both governmental
        and non-governmental, that are intended to reduce the impact of environmental factors on human
        health'
      specific:
      - code: C1.1
        text: analyse grassroots initiatives that are intended to reduce the impact of environmental factors
          on human health (e.g., community cleanup of local aquatic or terrestrial environments; class
          action lawsuits against major polluters) [AI, C]
      - code: C1.2
        text: evaluate the effectiveness of government initiatives that are intended to reduce the impact
          of environmental factors on human health (e.g., Ontario Ministry of the Environment smog advisories;
          provincial laws regulating drinking water; WHMIS regulations on hazardous material) [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate environmental factors that
        can affect human health, and analyse related data'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to human health and the environment, including, but
          not limited to: contaminants, heavy metals, air pollution, and pesticide [C]'
      - code: C2.2
        text: analyse longitudinal data to determine the impact of various environmental factors that
          affect human health (e.g., air temperature, atmospheric greenhouse gases, contaminants in drinking
          water) [AI]
      - code: C2.3
        text: investigate, through laboratory inquiry or field study, water samples from natural and disturbed
          environments (e.g., tap water; pond, river, or lake water from disturbed and undisturbed areas;
          water from an outdoor pool), and analyse the resulting data [PR, AI]
      - code: C2.4
        text: analyse, on the basis of a laboratory inquiry, computer simulation, or field study, particulate
          matter in air (e.g., an air sample from an exhaust pipe or air vent, particles in a filter that
          cigarette smoke has passed through, particles caught on sticky paper set up in an open area)
          [PR, AI]
      - code: C2.5
        text: investigate health standards for buildings and methods to retrofit or otherwise improve
          structures to reduce their negative impact on human health (e.g., the use of materials that
          do not contain volatile organic compounds, the use of biological air and water filters), and
          communicate their findings [PR, C]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of various environmental factors
        that can affect human health, and explain how the impact of these factors can be reduced'
      specific:
      - code: C3.1
        text: identify the main pollutants and environmental contaminants that can affect human health
          (e.g., air pollutants such as sulfur dioxide, nitrous oxide, and particulates; noise pollution;
          heavy metals such as lead and mercury; DDT; PCBs; mould; volatile organic compounds such as
          acetone and chlorinated solvents)
      - code: C3.2
        text: describe the effects of a variety of environmental factors on human health (e.g., air pollutants
          are associated with disorders such as asthma; consumption of fish products from contaminated
          water may lead to increased levels of heavy metals in the human body; the thinning of the ozone
          layer may lead to increased incidence of skin cancer; noise pollution may impair hearing)
      - code: C3.3
        text: describe ways in which a variety of environmental contaminants (e.g., volatile organic compounds
          in paints, carpets, and cleaning products; mercury in fish; E. coli in the water at public beaches)
          can enter the human body (e.g., inhalation, ingestion, absorption)
      - code: C3.4
        text: describe measures that can reduce exposure to environmental contaminants (e.g., wearing
          protective clothing or sunscreen, or remaining indoors during peak UV hours, to prevent exposure
          to ultraviolet rays; avoiding the use of paints, solvents, and cleaning agents that contain
          volatile organic compounds)
      - code: C3.5
        text: identify a variety of populations who are particularly vulnerable to the effects of environmental
          factors, and explain why these populations are vulnerable (e.g., seniors are vulnerable to extreme
          temperatures because the ability to regulate body temperature diminishes as people age; Inuit
          who follow a traditional diet are vulnerable to contaminants that accumulate in the fatty tissue
          of sea mammals because these animals are their main food source)
  - code: D
    title: Sustainable Agriculture and Forestry
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the impact of agricultural
        and forestry practices on human health, the economy, and the environment'
      specific:
      - code: D1.1
        text: evaluate, on the basis of research, a variety of agricultural and forestry practices (e.g.,
          companion planting, biological pest control, the use of genetically modified seed, forest fire
          control) with respect to their impact on the economy and the environment (e.g., the use of nematodes
          eliminates crop damage from grubs, thus contributing to better harvests, while reducing the
          use of toxic chemical pesticides; under some circumstances, forest thinning can help prevent
          or reduce the seriousness of forest fire, and its economic and environmental consequences) [IP,
          PR, AI, C]
      - code: D1.2
        text: evaluate, on the basis of research, the impact, including the long-term impact, of agricultural
          and forestry practices on human health (e.g., the use of chemical fertilizers and pesticides;
          the use of growth hormones and antibiotics in livestock; the use of feed containing animal by-products;
          the clear-cutting of forests) [IP, PR, AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate conditions necessary for
        plant growth, including the soil components most suitable for various species, and various environmentally
        sustainable methods that can be used to promote growth'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to sustainable agriculture and forestry, including,
          but not limited to: bioremediation, crop rotation, companion planting, organic product, humus,
          compost, mulch, silviculture, and naturalization [C]'
      - code: D2.2
        text: test samples of a variety of types of soil (e.g., clay, loam, commercial potting soil) to
          determine their nutrients and composition (e.g., pH; the percentage of nitrogen, phosphorus,
          and potassium; porosity; moisture) [PR, AI]
      - code: D2.3
        text: use an inquiry process to investigate the nutrients in and composition of a variety of compost
          samples (e.g., nutrients such as nitrogen, phosphorous, potassium; composition with respect
          to pH, porosity), and analyse the findings to determine appropriate uses for each sample [IP,
          PR, AI]
      - code: D2.4
        text: prepare a soil mixture (e.g., using compost, manure, vermiculite, black earth, top soil,
          peat moss, loam, and/or sand) for a selected plant species, based on analysis of the criteria
          for optimal growth for that species (e.g., cactus, tomato plants, wheat, jack pine) [PR, AI]
      - code: D2.5
        text: use a research process to investigate environmentally sustainable methods of managing and
          maintaining healthy and productive agricultural zones and forests (e.g., companion planting,
          crop rotation, selective tree-harvesting, planting a diverse canopy) [IP, PR]
      - code: D2.6
        text: design a landscaping project for their local area (e.g., a rooftop garden, a plot in a community
          garden, a riparian restoration), taking into account local conditions (e.g., zone hardiness,
          soil composition, amount of sunlight and rainfall), and propose a course of action to ensure
          the sustainability of the project and its healthy interaction with the surrounding environment
          (e.g., companion gardening, the use of compost to fertilize the soil, the use of native plants,
          the inclusion of plants that attract birds or butterflies) [IP, PR, AI]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of conditions required for plant
        growth and of a variety of environmentally sustainable practices that can be used to promote growth'
      specific:
      - code: D3.1
        text: explain the basic principles of various agricultural and forestry practices (e.g., Integrated
          Pest Management), and identify regulations and regulatory bodies associated with these practices
          (e.g., Health Canada’s Pest Management Regulatory Agency [PMRA], the Pest Control Products Act)
      - code: D3.2
        text: describe the basic requirements for plant growth (e.g., growing medium, light, moisture,
          nutrients)
      - code: D3.3
        text: describe the soil components (e.g., pH, moisture, the percentage of humus, porosity with
          respect to water and air) needed by a variety of plants for optimal growth
      - code: D3.4
        text: explain different ecologically sound practices for improving and maintaining soil structure
          and fertility (e.g., crop rotation, fallowing, adding compost or manure, inter-seeding grains
          and legumes, mulching, tree harvesting using a shelterwood system)
      - code: D3.5
        text: explain agricultural techniques and forestry practices that aim to maintain both biodiversity
          and long-term productivity (e.g., growing a variety of species, inter-planting crops, planting
          native and heritage varietals instead of hybrids or transgenic species, saving seeds, maintaining
          some older trees and snags for animal habitat)
      - code: D3.6
        text: describe sustainable water-management practices in agricultural and forestry settings (e.g.,
          regulating the frequency of watering, planting species suited to local precipitation levels,
          limiting run-off and erosion)
  - code: E
    title: Reducing and Managing Waste
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: analyse economic, political,
        and environmental considerations affecting waste management strategies'
      specific:
      - code: E1.1
        text: analyse, on the basis of research, the impact of economic and political considerations on
          the development of waste management practices or strategies (e.g., incineration of hazardous
          waste; biological filtration and reuse of greywater; user fees for garbage disposal; vermicomposting)
          [IP, PR, AI, C]
      - code: E1.2
        text: evaluate the short- and long-term impact on the environment of a specific type of waste
          (e.g., waste products from animal farming; plastic shopping bags; tailings from mines) [AI,
          C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate the effectiveness of various
        waste management practices'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to waste management, including, but not limited to:
          solid, liquid, and gaseous waste; toxic waste; heavy metal; chlorinated hydrocarbons; and polychlorinated
          biphenyls (PCBs) [C]'
      - code: E2.2
        text: plan and conduct an inquiry in a microenvironment to treat a solid, liquid, or gaseous waste
          (e.g., reduce the acidity in a closed bog system in an aquarium; use a vermicomposter to recycle
          solid organic matter) [IP, PR]
      - code: E2.3
        text: use a research process to investigate the waste generated throughout the life cycle of a
          product (e.g., the waste associated with all the materials and energy that go into the development
          and disposal of a computer or a running shoe) [IP, PR]
      - code: E2.4
        text: plan and conduct a waste audit within their school, and propose a plan of action for waste
          reduction based on their findings (e.g., review the school’s policy regarding paper and plastic
          recycling, monitor actual practices, and propose strategies to improve them) [IP, PR, AI, C]
      - code: E2.5
        text: investigate a local, regional, national, or global waste management practice (e.g., local
          practices such as recycling or charging for residential and/or commercial garbage bags; shipping
          garbage to landfill sites in another region; disposal of nuclear waste; dumping raw sewage into
          rivers, lakes, oceans), and communicate their findings [PR, C]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the nature and types of waste
        and strategies for its management'
      specific:
      - code: E3.1
        text: describe different categories of waste (e.g., biodegradable, recyclable, toxic, organic,
          inorganic)
      - code: E3.2
        text: explain some current waste remediation practices used with substances or products that are
          not environmentally friendly (e.g., “Toxic Taxi” for pick-up of household hazardous waste; the
          recycling of plastic to make furniture and “lumber”)
      - code: E3.3
        text: describe the scientific principles involved in processing solid, liquid, and gaseous waste
          (e.g., combustion, decomposition, pyrolysis)
      - code: E3.4
        text: explain common strategies and technologies used in the collection and storage of waste (e.g.,
          strategies such as recycling, composting, dumping in landfill sites; technologies such as compacters,
          enzyme digesters, flocculation tanks)
      - code: E3.5
        text: explain how scientific knowledge and technological processes have been applied in the development
          of environmentally sound waste management strategies (e.g., accelerated waste aeration, bioremediation)
  - code: F
    title: Conservation of Energy
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: assess the impact on society
        and the environment of the use of various renewable and non-renewable energy sources, and propose
        a plan to reduce energy consumption'
      specific:
      - code: F1.1
        text: evaluate the impact on the environment of renewable and non-renewable energy sources, and
          propose an environmentally friendly solution to reduce non-renewable energy consumption (e.g.,
          a plan for broader use of hybrid cars or solar panels) [AI, C]
      - code: F1.2
        text: assess the costs and benefits to society of the use of renewable and non-renewable energy
          sources, using a variety of criteria (e.g., associated health concerns, reliability, ability
          to meet demand, start-up and production costs) [AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate various methods of conserving
        energy and improving energy efficiency'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to energy conservation, including, but not limited
          to: renewable resource, non-renewable resource, and R-value'
      - code: F2.2
        text: investigate energy consumption and costs in their household over a given period of time,
          and suggest ways in which their household could conserve energy [PR, AI, C]
      - code: F2.3
        text: plan and conduct an energy audit of a home or business, and propose ways to improve its
          energy efficiency [IP, PR, AI, C]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of energy production, consumption,
        and conservation with respect to a variety of renewable and non-renewable sources'
      specific:
      - code: F3.1
        text: explain the historical significance of a variety of energy sources (e.g., whale oil, coal),
          and describe their long-term impact on the environment
      - code: F3.2
        text: describe the characteristics of a sustainable energy system (e.g., equitable access to the
          source, long-term availability, limited environmental impact)
      - code: F3.3
        text: explain the basic principles and characteristics of various types of renewable (e.g., tidal,
          geothermal, solar, wind) and non-renewable (e.g., coal, oil, gas) energy production and their
          impact on the environment
      - code: F3.4
        text: describe methods of energy production and conservation intended to reduce greenhouse gas
          emissions (e.g., energy production methods at the Prince Edward Island Wind-Hydrogen Village;
          charging higher prices for energy used during peak hours)
      - code: F3.5
        text: describe technological advances aimed at reducing energy consumption (e.g., programmable
          thermostats, improved R-value in insulation, compact fluorescent light bulbs, rechargeable batteries,
          “smart meters”)
- course: SNC4M
  title: Science, Grade 12, University/College Preparation
  grade: 12
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate relevant scientific questions about observed relationships, ideas, problems, or
          issues, make informed predictions, and/or formulate educated hypotheses to focus inquiries or
          research
      - code: A1.2
        text: select appropriate instruments (e.g., respirometer, titration apparatus) and materials (e.g.,
          prepared slides, Petri dishes, food samples), and identify appropriate methods, techniques,
          and procedures, for each inquiry
      - code: A1.3
        text: identify and locate a variety of print and electronic sources that enable them to address
          research topics fully and appropriately
      - code: A1.4
        text: apply knowledge and understanding of safe laboratory practices and procedures when planning
          investigations by correctly interpreting Workplace Hazardous Materials Information System (WHMIS)
          symbols; by using appropriate techniques for handling and storing laboratory equipment and materials
          and disposing of laboratory materials, including biological waste (e.g., techniques to prevent
          contamination of specimens); and by using appropriate personal protection (e.g., wearing gloves
          when handling biological specimens)
      - code: A1.5
        text: conduct inquiries, controlling relevant variables, adapting or extending procedures as required,
          and using appropriate materials and equipment safely, accurately, and effectively, to collect
          observations and data
      - code: A1.6
        text: compile accurate data from laboratory and other sources, and organize and record the data,
          using appropriate formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from a variety of appropriate
          sources, including electronic, print, and/or human sources, using suitable formats and an accepted
          form of academic documentation
      - code: A1.8
        text: synthesize, analyse, interpret, and evaluate qualitative and/or quantitative data to determine
          whether the evidence supports or refutes the initial prediction or hypothesis and whether it
          is consistent with scientific theory; identify sources of bias and/or error; and suggest improvements
          to the inquiry to reduce the likelihood of error
      - code: A1.9
        text: analyse the information gathered from research sources for logic, accuracy, reliability,
          adequacy, and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
          with reference to scientific knowledge
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric, symbolic, and graphic modes of representation, and appropriate
          units of measurement (e.g., SI and imperial units)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places or significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers related to the fields of science under
        study, and describe the contributions of scientists, including Canadians, to those fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., nuclear medicine technician, nurse practitioner, hematologist, dietitian, geneticist)
          and the education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Frederick Banting,
          John A. Hopps, Louis Siminovitch, Jean Cuthand Goodwill, Nancy Olivieri), to the field under
          study
  - code: B
    title: Medical Technologies
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: assess the impact of medical
        technologies and therapies, both conventional and alternative, used to diagnose and treat human
        health conditions'
      specific:
      - code: B1.1
        text: assess the costs and benefits of a conventional medical technology, therapy, or device that
          is used to diagnose or treat a human health condition (e.g., diagnostic technologies such as
          X-rays and ultrasound; surgical procedures such as laser removal of tumours; biomedical devices
          such as prosthetics) [AI, C]
      - code: B1.2
        text: identify a variety of alternative technologies and therapies used to diagnose or treat human
          health conditions (e.g., biofeedback, acupuncture, homeopathy, chiropractic, Aboriginal healing
          practices), and assess the effectiveness of one such therapy [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate the uses of, and analyse
        the information provided by, a variety of medical technologies'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to medical technologies, including, but not limited
          to: aseptic techniques, feedback loop, biochemical, and biomechanical [C]'
      - code: B2.2
        text: use a variety of medical technologies to collect data related to blood pressure, heart rate,
          lung capacity, and body mass, and analyse the data (e.g., use a stethoscope to determine heart
          rate under various conditions; use a respirometer to measure lung capacity) [PR, AI]
      - code: B2.3
        text: use a microscope to investigate prepared slides of human blood, identifying blood cells
          by type, size, and number, and determine the ratios between different cells in the samples [PR,
          AI]
      - code: B2.4
        text: interpret information generated by a variety of imaging technologies (e.g., X-rays, ultrasound),
          and communicate their findings [AI, C]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the function and use of a variety
        of medical technologies and the information they provide about the human body'
      specific:
      - code: B3.1
        text: explain the four primary vital signs in humans (i.e., body temperature, heart rate, blood
          pressure, respiration rate)
      - code: B3.2
        text: describe the normal range for various physiological and biochemical indicators (e.g., heart
          rate, lung capacity, blood pressure, blood sugar)
      - code: B3.3
        text: explain the function and use of a variety of medical devices and technologies for diagnostic
          and treatment purposes (e.g., sphygmomanometer, stethoscope, ultrasound, X-ray, computerized
          axial tomography [CAT] scan, pacemaker, chemotherapy)
      - code: B3.4
        text: describe the function and use of technologies, devices, and techniques for biomedical repair
          (e.g., prosthetics, artificial organs, plastic surgery)
      - code: B3.5
        text: describe a recent technological development or advance in diagnosis or treatment in the
          health care field (e.g., artificial skin for burn victims, artificial and transgenic organ transplants,
          smart drugs, nanotechnologies, biophotonics)
  - code: C
    title: Pathogens and Disease
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the impact of scientific
        and technological knowledge and individual behaviour on the control of pathogens and the prevention
        of disease'
      specific:
      - code: C1.1
        text: analyse, on the basis of research, the impact, both positive and negative, of scientific
          and technological advances intended to prevent the spread of illness and disease [IP, PR, AI,
          C]
      - code: C1.2
        text: evaluate the impact of individual choices (e.g., with respect to vaccination, the proper
          use of antibiotics or mosquito repellent) on the control of pathogens and the prevention of
          disease [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate the nature and growth of
        pathogens and the effectiveness of measures intended to prevent their spread'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to pathogens and diseases, including, but not limited
          to: parasite, epidemiology, pathogenesis, and vector [C]'
      - code: C2.2
        text: analyse, on the basis of inquiry, the effects of various treatments on pathogenesis (e.g.,
          the effect of mouthwash or penicillin on the growth of bacteria) [PR, AI]
      - code: C2.3
        text: analyse, using prepared slides or computer simulations, the characteristics, properties,
          and virulence of various bacteria [PR, AI]
      - code: C2.4
        text: use an inquiry process to demonstrate the effect of the use of sterile techniques (e.g.,
          pasteurization, use of an autoclave) on pathogenesis [IP, PR]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of pathogens, the diseases they
        cause, and ways of controlling their spread'
      specific:
      - code: C3.1
        text: describe the characteristics and life cycles, including reproductive cycles, of representative
          pathogens (e.g., lysogenic cycle; lytic cycle; infectious cycle of malaria)
      - code: C3.2
        text: describe the mode of transmission of various diseases, including those that are insect-borne
          (e.g., malaria, encephalitis), airborne (e.g., influenza, tuberculosis), water-borne (e.g.,
          cholera, poliomyelitis), sexually transmitted (e.g., HIV/AIDS), and food-borne (e.g., mad cow
          disease, trichinosis, salmonella)
      - code: C3.3
        text: explain how the human immune response acts as a natural defence against infection
      - code: C3.4
        text: describe the role of vaccines, antibiotics, antiretrovirals, and other drug therapies and
          antiseptics in the control of pathogenesis
      - code: C3.5
        text: describe non-medical ways to protect oneself from contracting pathogenic disease in a variety
          of situations (e.g., aseptic techniques such as wearing sterile gloves; proper personal hygiene
          such as frequent and thorough hand washing; the use of insect repellent)
      - code: C3.6
        text: describe some of the means used by international non-governmental organizations (e.g., Médecins
          sans Frontières, Oxfam, Ryan’s Well Foundation, UN agencies, the Stephen Lewis Foundation) to
          control the spread of disease (e.g., distribution of vaccines, medication, malaria nets; installing
          wells so people have access to clean water; public education on strategies for transmission
          prevention)
      - code: C3.7
        text: describe aseptic techniques used in the workplace, and explain their importance in preventing
          the spread of pathogens (e.g., cooking meat to a safe temperature and refrigerating leftovers
          quickly to avoid growth of bacteria in restaurant food; frequent hand sanitizing and use of
          sterile gloves in hospitals to prevent the spread of pathogens to vulnerable populations)
  - code: D
    title: Nutritional Science
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: assess how personal and societal
        factors affect eating behaviours, and evaluate the social and economic impact of the use of non-nutrient
        food additives'
      specific:
      - code: D1.1
        text: analyse the social and economic costs and benefits of the use of non-nutrient food additives
          in food preservation and food enhancement techniques (e.g., sulfites in dried fruit; food colouring;
          MSG) [AI, C]
      - code: D1.2
        text: evaluate the impact of some personal and societal factors (e.g., allergies, disease, body
          image, cultural preferences) on eating behaviours (e.g., the relationship between societal ideals
          of beauty and interest in “fad” diets) [AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate chemical components of
        and energy in food, and the processes by which food is digested'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to nutritional science, including, but not limited
          to: macromolecules, protein, starch, vitamin, carbohydrate, fats, lipids, pepsin, and amylase
          [C]'
      - code: D2.2
        text: plan and conduct chemical tests on a variety of foods to determine their chemical components
          (e.g., protein, starch, fats, lipids, carbohydrates, vitamins) [IP, PR, AI]
      - code: D2.3
        text: investigate how enzymes break down macromolecules (e.g., amylase digests starch; pepsin
          and hydrochloric acid digest protein), and test the products of different types of digestion
          (e.g., use Benedict’s solution to test for the presence of simple sugars produced by the digestion
          of carbohydrates) [PR]
      - code: D2.4
        text: investigate the process of emulsification in fats and lipids (e.g., using commercially obtained
          bile and cooking oil) [PR]
      - code: D2.5
        text: conduct titrations to determine the effects of various antacids on hydrochloric acid [PR,
          AI]
      - code: D2.6
        text: plan and conduct an inquiry to determine the nutrient or energy content in selected food
          samples (e.g., hamburger, bread) [IP, PR, AI]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of chemical components of and
        energy in food, and the processes by which food is digested'
      specific:
      - code: D3.1
        text: describe the basic chemical components of proteins, carbohydrates, fats and lipids, and
          vitamins and minerals, and explain their functions in the body
      - code: D3.2
        text: explain how laboratory methods are used to determine the relative energy content of food
          (e.g., use of a calorimeter)
      - code: D3.3
        text: describe requirements for a balanced diet based on the biochemical and energy needs of the
          average body, and explain how these requirements might vary among people with different lifestyles
          (e.g., young children, the elderly, a person with diabetes, an athlete)
      - code: D3.4
        text: describe the structure and function of the components of the digestive system (e.g., mouth,
          tongue, epiglottis, esophagus, stomach, intestines, liver, gall bladder, pancreas, appendix,
          rectum, anus, salivary glands, saliva, bile) with respect to physical and chemical digestion
      - code: D3.5
        text: describe optimum conditions for the effective functioning of some digestive enzymes found
          within the human body (e.g., amylase, pepsin)
  - code: E
    title: Science and Public Health Issues
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: assess the impact of scientific
        research, technological advances, and government initiatives on public health'
      specific:
      - code: E1.1
        text: assess the impact of scientific research and technological advances on public health around
          the world (e.g., widespread immunization for diseases such as polio, telemedicine for people
          in remote areas, new drug therapies to combat disease) [AI, C]
      - code: E1.2
        text: assess, on the basis of research, the effectiveness of a municipal, provincial, or federal
          government initiative intended to protect the public health of Canadians (e.g., immunization
          programs, smoking bans, Health Canada advisories) [IP, PR, AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate various strategies related
        to contemporary public health issues'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to public health issues, including, but not limited
          to: pandemic, contamination, infectious disease, quarantine, and vaccination [C]'
      - code: E2.2
        text: analyse and interpret, using a case study or research data, scientific evidence regarding
          the effectiveness of a public health program intended to reduce disease transmission (e.g.,
          distribution of bed nets to fight malaria; safe injection sites for intravenous drug users;
          programs to encourage hand washing in hospitals to stop the spread of C. difficile) [AI, C]
      - code: E2.3
        text: use a research process to investigate public health strategies developed to combat a potential
          pandemic (e.g., SARS, C. difficile, avian flu) [IP, PR]
      - code: E2.4
        text: use a research process to locate a media report on a public health issue (e.g., the handling
          of SARS, the banning of bisphenol-A in plastic bottles), summarize its arguments, and assess
          them from a scientific perspective [IP, PR, AI, C]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of major public health issues,
        past and present'
      specific:
      - code: E3.1
        text: describe the characteristics according to which a pandemic is classified (e.g., the strain
          of a virus, its mode of transmission)
      - code: E3.2
        text: explain how pandemics have affected humanity throughout history (e.g., the bubonic plague
          of 1347–1352 in Europe, the cholera pandemic of 1817–1823 in Asia, the global Spanish influenza
          pandemic of 1918–1920, the contemporary AIDS pandemic)
      - code: E3.3
        text: explain the impact of various threats to public health, including infectious diseases (e.g.,
          hepatitis, HIV/AIDS, tuberculosis, malaria, sexually transmitted diseases), chronic diseases
          (e.g., cardiovascular disease, diabetes, asthma), and environmental factors (e.g., climate change,
          air pollution, chemical pollutants, radiation)
      - code: E3.4
        text: explain a variety of social factors that can promote the rapid spread of infectious diseases
          (e.g., global population growth, international travel, poor sanitation, lack of clean drinking
          water)
      - code: E3.5
        text: describe public health measures, including legislation, that are used for the protection
          of the public (e.g., quarantines, vaccinations, water chlorination, regulations on what items
          travellers can bring into a country)
      - code: E3.6
        text: explain why some populations are particularly susceptible to specific health problems (e.g.,
          the risk of diabetes among First Nations populations; the risk of thalassemia among Mediterranean
          populations; the risk of pneumonia and tuberculosis among people with HIV/AIDS)
  - code: F
    title: Biotechnology
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: analyse a variety of social,
        ethical, and legal issues related to applications of biotechnology in the health, agricultural,
        or environmental sector'
      specific:
      - code: F1.1
        text: analyse social issues related to an application of biotechnology in the health, agricultural,
          or environmental sector (e.g., issues related to the uses of genetically modified organisms
          or to the uses and availability of in vitro fertilization) [AI, C]
      - code: F1.2
        text: analyse, on the basis of research, ethical and legal issues related to an application of
          biotechnology in the health, agricultural, or environmental sector (e.g., ethical questions
          related to xenotransplantation; legal issues related to access to an individual’s genetic information)
          [IP, PR, AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate various techniques used
        in biotechnology and how they are applied in the food industry and the health and agricultural
        sectors'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to biotechnology, including, but not limited to: selective
          breeding, hybridization, replication, mutation, genomics, and gene therapy [C]'
      - code: F2.2
        text: plan and conduct an inquiry into various traditional biotechnological techniques used in
          the food industry (e.g., the use of fermentation to produce bread, cheese, yogurt) [IP, PR]
      - code: F2.3
        text: investigate, through laboratory inquiry or computer simulation, a recently developed biotechnological
          method used in the health sector (e.g., the process of electrophoresis to degrade DNA) [PR]
      - code: F2.4
        text: investigate, through laboratory inquiry or computer simulation, a recently developed biotechnological
          method used in the field of agriculture (e.g., bioremediation of a chemical fertilizer spill;
          the cloning of corn; the use of synthetic hormones to promote growth in livestock) [PR]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of biological processes related
        to biotechnology and of applications of biotechnology in the health, agricultural, and environmental
        sectors'
      specific:
      - code: F3.1
        text: explain various methods used, over time, in the field of biotechnology (e.g., use of living
          organisms to make or modify products, selective breeding to create particular breeds of animals,
          manipulation of genes to develop organisms with particular traits)
      - code: F3.2
        text: explain the structure and functions of macromolecules (e.g., DNA, RNA) and the synthesis
          of proteins (e.g., transcription, translation, gene expression)
      - code: F3.3
        text: describe applications of biotechnology in the health (e.g., genomics, gene therapy, xenotransplantation,
          in vitro fertilization), agricultural (e.g., genetically modified crops, biopesticides, cloning),
          and environmental sectors (e.g., bioremediation, phytoremediation)
