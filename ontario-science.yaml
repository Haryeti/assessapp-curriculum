      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places or significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers related to the fields of science under
        study, and describe the contributions of scientists, including Canadians, to those fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., chemical technician, baker, blood laboratory assistant, custodian, public works employee,
          cosmetologist) and the education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Lorne Trottier, David
          Butler-Jones, Francine Décary, Robert G.E. Murray, Susan Barr), to the fields under study
  - code: B
    title: Hazards in the Workplace
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: assess common workplace31 settings
        with respect to hazards, and analyse selected legislation that is in place to protect workers
        and the environment from these hazards'
      specific:
      - code: B1.1
        text: assess a workplace setting, either real or simulated, with respect to hazards that could
          affect workers or the environment, using appropriate criteria (e.g., a checklist for a health
          and safety audit) [AI, C]
      - code: B1.2
        text: analyse and summarize the requirements of selected sections of workplace safety and/or environmental
          protection legislation related to a career of personal interest (e.g., regulations applying
          to mining in the Occupational Health and Safety Act; regulations applying to waste management
          in the Ontario Environmental Protection Act) [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate the nature of workplace32
        hazards and various ways in which workers can protect themselves from these hazards'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to hazards in the workplace, including, but not limited
          to: occupational exposure limits (OEL), designated substance regulation (DSR), personal protective'
      - code: B2.2
        text: plan and conduct an inquiry to determine what factors affect rates of chemical reactions
          (e.g., the concentration of an acid affects its rate of reaction with metals) [IP, PR, AI]
      - code: B2.3
        text: investigate the effectiveness of methods used to reduce the impact of noise in the workplace
          (e.g., use a decibel meter to measure noise level before and after the installation of sound
          insulation; measure the effectiveness of earplugs at different sound levels) [PR]
      - code: B2.4
        text: investigate the effects of workers’ exposure to heat or cold (e.g., the effects of industrial
          heat sources such as molten materials on workers in foundries and factories; the effects of
          seasonal heat and cold, including exposure to solar radiation, on outdoor workers in construction,
          landscaping, agriculture, or hydro line repair; the effects of cold on workers in refrigerated
          warehouses) [PR]
      - code: B2.5
        text: use a research process to investigate procedures for the safe handling of biohazardous and/or
          infectious materials in the workplace, and communicate their findings (e.g., create a webpage
          on the universal precautions for handling biological hazards; create a poster illustrating the
          steps for proper hand washing) [IP, PR, C]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of common biological, chemical,
        and physical workplace33 hazards'
      specific:
      - code: B3.1
        text: describe the ways in which hazardous materials enter the body (i.e., ingestion, inhalation,
          absorption, and injection), and explain the importance of using personal protective equipment
          (e.g., gloves, appropriate eye wear, aprons, self-contained breathing apparatus) to avoid contamination
      - code: B3.2
        text: identify common physical hazards in the workplace (e.g., hazards posed by noise; cutting
          tools; electrical power lines; extreme heat and cold), and describe potentially harmful situations
          and practices (e.g., work at heights on unstable equipment) as well as best safety practices
          (e.g., properly securing ladders and scaffolding) relating to these hazards
      - code: B3.3
        text: identify common biological hazards in the workplace (e.g., bacteria, viruses, fungi), and
          describe potentially harmful situations and practices (e.g., improper disposal of syringes)
          as well as best safety practices (e.g., use of PPE such as gloves and masks) relating to these
          hazards
      - code: B3.4
        text: identify common chemical hazards in the workplace (e.g., oxidizers, acid and base solutions),
          and describe potentially harmful situations and practices (e.g., inadequate venting of fine
          dust particles in
      - code: B3.5
        text: describe ways in which workers can address safety issues in the workplace (e.g., by reporting
          an unsafe condition to a supervisor; by refusing unsafe work)
      - code: B3.6
        text: explain qualitatively how factors such as temperature, concentration, and the size of the
          opening of a container affect storage and disposal of chemicals in the workplace
  - code: C
    title: Chemicals in Consumer Products
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse chemical products used
        in the home and workplace, and issues related to their safe and environmentally responsible use
        and disposal'
      specific:
      - code: C1.1
        text: analyse, on the basis of research, a chemical product used in a particular profession or
          in the home (e.g., pool chemicals, chlorine bleach, hair dye), and prepare guidelines for safe
          and responsible use of the product [IP, PR, AI, C]
      - code: C1.2
        text: assess the environmental consequences of improper disposal of chemical products commonly
          used in the home (e.g., pouring paint down the drain; dumping batteries in garbage destined
          for landfill sites) [AI, C]
      - code: C1.3
        text: evaluate the appropriateness of current disposal practices in their home, at school, or
          in the community, with particular reference to the disposal of chemical waste [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate chemical properties of,
        and chemical reactions used to produce, various consumer products'
      specific:
      - code: C2.1
        text: 'use appropriate terminology relating to chemical reactions and chemical products, including,
          but not limited to: synthesis, decomposition, neutralization, polymerization, combustion, single
          and double displacement, pH, solvent, organic, inorganic, and dilution [C]'
      - code: C2.2
        text: use an inquiry process to determine how various conditions affect a chemical reaction, by
          altering the conditions under which a reaction occurs (e.g., temperature, length of time, amount
          of reactants, pH of a solution), observing the effects of the alterations, and comparing the
          outcome and final product of each reaction (e.g., make borax slime, then alter the proportion
          of the ingredients and measure the impact on properties of the product) [IP, PR, AI]
      - code: C2.3
        text: prepare dilutions using concentrated solutions, and observe or measure the changes in properties
          (e.g., pH, colour, viscosity, density) [PR]
      - code: C2.4
        text: safely conduct a chemical reaction in order to produce a common household or consumer product
          (e.g., taffy, shampoo, toothpaste, nylon, lip balm) [PR]
      - code: C2.5
        text: classify various household products on the pH scale, using pH paper, indicator solutions,
          and/or a pH meter [PR, AI]
      - code: C2.6
        text: investigate a variety of consumer products within a given category (e.g., shampoo, window
          cleaner, disinfectant), focusing on products claiming to be environmentally friendly, and analyse
          them with respect to selected factors (e.g., cost, effectiveness, impact on the environment)
          [PR, AI, C]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of chemical reactions, and of
        properties of chemicals used in common household and workplace products'
      specific:
      - code: C3.1
        text: describe the types of chemical reactions (e.g., synthesis, single displacement, double displacement,
          decomposition, combustion, polymerization, neutralization) and the signs of chemical change
          in each
      - code: C3.2
        text: explain, in qualitative terms, why some chemical substances mix and others do not (e.g.,
          ethanol and vinegar are both polar and therefore miscible)
      - code: C3.3
        text: explain the function of the pH scale and how pH test results are interpreted
      - code: C3.4
        text: 'identify organic and inorganic compounds commonly used in the home and workplace (organic:
          fats, oils, fuels, common solvents; inorganic: acids and bases, mineral solvents, ammonia, baking
          soda), and compare their properties'
  - code: D
    title: Disease and Its Prevention
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the impact of public
        policy initiatives and technological advances intended to control the spread of disease, taking
        into consideration the failure of some people to follow public health regulations or recommendations'
      specific:
      - code: D1.1
        text: evaluate the effectiveness of a public policy measure or technological advance intended
          to control the spread of disease (e.g., mandatory immunization, screening for tuberculosis,
          quarantine) [AI, C]
      - code: D1.2
        text: evaluate the impact, current and/or potential, of an individual’s choice not to participate
          in a public health strategy intended to reduce the spread of disease (e.g., a hospital worker
          who does not follow recommendations regarding hand washing; a worker in a retirement home who
          does not get a flu shot) [AI, C]
      - code: D1.3
        text: analyse, on the basis of research, the advantages and disadvantages of selected technologies
          used to try to control disease (e.g., the effectiveness of pharmaceuticals at combating disease;
          the side effects of a variety of drugs) [IP, PR, AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate the characteristics, growth,
        and spread of bacteria, and the effects of aseptic techniques and antibiotics'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to the prevention of disease, including, but not limited
          to: communicable, non-communicable, microorganism, pathogen, disease, epidemiology, vector,
          immunization record, quarantine, pandemic, vaccine, antiseptic, sterilization, disinfection,
          and pasteurization [C]'
      - code: D2.2
        text: conduct an investigation, using safe practices and aseptic techniques, to compare the characteristics
          and growth of different types of non-pathogenic bacteria [PR, AI]
      - code: D2.3
        text: investigate the effects of various drug therapies (e.g., different antibiotic discs) on
          the growth of bacteria [PR, AI]
      - code: D2.4
        text: use a simulation (e.g., phenolphthalein and sodium hydroxide; a computer simulation) to
          demonstrate how diseases can spread through a community, and analyse the results [PR, AI]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the causes, symptoms, and modes
        of transmission of various diseases, and of strategies to prevent the spread of disease'
      specific:
      - code: D3.1
        text: describe modes of transmission of some communicable diseases, including those that are insect-borne
          (e.g., malaria, encephalitis), airborne (e.g., influenza, tuberculosis), waterborne (e.g., cholera,
          poliomyelitis), sexually transmitted (e.g., HIV/AIDS), and food-borne (e.g., mad cow disease,
          trichinosis, salmonella)
      - code: D3.2
        text: identify the causes and symptoms of various diseases (e.g., AIDS, influenza, salmonella,
          West Nile virus), and describe measures intended to prevent their spread
      - code: D3.3
        text: describe the reasons for immunization against specific diseases, the function of records
          of immunization in Ontario, and the importance of maintaining a personal immunization schedule
      - code: D3.4
        text: describe the use of vaccines, antibiotics, antiseptics, and other medical measures, both
          conventional and alternative, intended to control disease
      - code: D3.5
        text: explain the differences between bacteria and viruses in terms of their size, structure,
          and reproduction, and the methods used to control their spread
      - code: D3.6
        text: explain the importance of the proper use, storage, and disposal of medications (e.g., the
          importance of taking the full course of antibiotics, following directions, keeping medications
          away from children, monitoring side effects, returning expired medication to a pharmacy for
          disposal)
  - code: E
    title: Electricity at Home and Work
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: assess electrical hazards in
        the home and workplace, and the social and environmental impact of electrical technologies'
      specific:
      - code: E1.1
        text: assess the social and environmental impact of electrical technologies, including the impact
          associated with the manufacture and disposal of electronic devices (e.g., the impact of electrical
          devices used in the health care field, such as pacemakers or respirators; the impact of energy
          generation needed to power electrical devices and appliances) [AI, C]
      - code: E1.2
        text: assess electrical hazards that can be found at home and in the workplace (e.g., electrical
          outlets close to areas where spills might occur; overloaded circuits), and propose practical
          courses of action to address the problems [AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate common electrical devices,
        including their energy transformations and consumption'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to electricity, including, but not limited to: energy,
          power, kilowatt-hour, potential difference, current, conductor, short circuit, circuit breaker,
          fuse, and resistance [C]'
      - code: E2.2
        text: 'draw energy flow diagrams and/or write energy transformation equations that illustrate
          the energy transformation occurring in household devices, including the production of waste
          energy (e.g., energy transformations in a digital music player: electrical energy kinetic energy
          + sound energy + light + waste heat energy) [C]'
      - code: E2.3
        text: build a simple electrical device or circuit (e.g., a loudspeaker, an electric motor, a D-cell,
          a circuit containing a 40 W lightbulb and a dimmer switch), following a clear set of instructions
          and diagrams, and using appropriate tools safely [PR]
      - code: E2.4
        text: calculate the electrical energy consumption of two similar appliances (e.g., an old and
          a new refrigerator), using the power ratings that appear on the appliance, and compare the financial
          and environmental costs (e.g., carbon dioxide emissions) of running the two appliances [AI]
      - code: E2.5
        text: analyse changes in household energy consumption over a given time period (e.g., throughout
          the course of a day; between a week in January and a week in May), and give reasons for the
          changes [AI, C]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of electrical circuits, common
        electrical devices, and safety procedures related to electric systems'
      specific:
      - code: E3.1
        text: describe basic electric circuit components, including those that regulate the flow of electricity
          or are used as safety mechanisms (e.g., switches, bimetallic strips, resistors, ground fault
          interrupters [GFIs], surge protectors), and explain their layout in an electric circuit
      - code: E3.2
        text: describe forms of energy (e.g., electrical, mechanical, sound, light, thermal) and the energy
          transformations that occur in common electrical devices, including production of waste energy
          (e.g., heat)
      - code: E3.3
        text: identify situations in which direct current (DC) and alternating current (AC) are used (e.g.,
          DC is used in a portable appliance such as a flashlight; AC is used in a household appliance
          such as a kettle)
      - code: E3.4
        text: explain the difference in voltage requirements, and identify some household appliances that
          require 110 V AC (e.g., microwave oven, blender) and some that require 220 V AC to operate (e.g.,
          conventional oven, clothes dryer)
      - code: E3.5
        text: describe safety procedures to be followed when using electric systems at home or at work
          (e.g., ensuring that tools and appliances are properly grounded; unplugging appliances by pulling
          the plug, not the cord), and explain how dangerous situations can occur (e.g., an overloaded
          circuit can overheat and cause a fire; digging through buried electrical cable can cause a severe
          shock)
  - code: F
    title: Nutritional Science
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: assess the environmental implications
        of a variety of food choices, and evaluate and propose ways to improve the nutritional content
        of a menu'
      specific:
      - code: F1.1
        text: assess the environmental implications of food choices available in a variety of situations
          (e.g., in the school cafeteria, a fast-food restaurant, a supermarket, a local farmers’ market,
          an organic meat shop), and propose ways to minimize the environmental impact of their food choices
          [AI, C]
      - code: F1.2
        text: 'evaluate the nutritional content of a menu (e.g., from the school cafeteria, a fast-food
          restaurant, a coffee shop, a retirement home, a hospital), and propose ways to improve it, using
          information from Eating Well with Canada’s Food Guide or Eating Well with Canada’s Food Guide:
          First Nations, Inuit, and Métis [AI, C]'
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate nutrients and non-nutrient
        additives in a variety of foods'
      specific:
      - code: F2.1
        text: 'use appropriate vocabulary related to nutritional science, including, but not limited to:
          nutrient, lipid, carbohydrate, protein, vitamin, mineral, qualitative test, serving size, food
          additive, trans fat, cholesterol, kilojoule, calorie, saturated, unsaturated, hydrogenated,
          essential amino acid, and preservative [C]'
      - code: F2.2
        text: conduct an investigation to compare commercial food products and home-made foods (e.g.,
          commercial and home-made cookies or cake; a shake from a fast-food restaurant and a home-made
          milk shake; commercial orange drink and freshly squeezed orange juice), with reference to qualitative
          and quantitative differences such as the number of ingredients, types of nutrients, non-nutrient
          additives, texture, and colour [PR, AI]
      - code: F2.3
        text: conduct an investigation to test for the presence of various nutrients in foods (e.g., use
          iodine to test for starch; use Benedict’s solution to test for simple sugar) [PR]
      - code: F2.4
        text: plan and conduct an investigation into the effectiveness of food preservatives (e.g., use
          lemon juice to reduce oxidation of apple slices; compare mould growth on commercial and home-made
          bread) [IP, PR]
      - code: F2.5
        text: modify a recipe or menu to meet a dietary restriction (e.g., reduce the cholesterol content
          by replacing whole eggs with egg whites; reduce the sodium content by cutting salt; replace
          milk with soy milk; replace meat with tofu or legumes), and explain the reasons for the changes
          (e.g., sodium can contribute to high blood pressure; dairy products can cause digestive problems
          for people who are lactose intolerant; non-animal sources of protein are necessary for vegans,
          who do not eat any animal products) [PR, C]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of food components and their effects
        on the human body'
      specific:
      - code: F3.1
        text: identify sources of the principal food nutrients (e.g., carbohydrates, lipids, proteins,
          vitamins, minerals, fibre), with reference to Canada’s Food Guide, and describe the function
          of these nutrients in the body
      - code: F3.2
        text: identify the type of information commonly found on a food label, and describe how the information
          is organized (e.g., serving size, percentage of daily values, amount of each component)
      - code: F3.3
        text: explain the meaning of a variety of descriptors found on food labels (e.g., “fat free”,
          “low fat”, “lite”, “pure”, “organic”, “lean”, “diet”)
      - code: F3.4
        text: describe the function of non-nutrient food additives (e.g., lecithin; monosodium glutamate
          [MSG]; artificial colour, flavour, and sweetener; preservatives), and explain their effects
          on human health
- course: SCH4C
  title: Chemistry, Grade 12, College Preparation
  grade: 12
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate relevant scientific questions about observed relationships, ideas, problems, or
          issues, make informed predictions, and/or formulate educated hypotheses to focus inquiries or
          research
      - code: A1.2
        text: select appropriate instruments (e.g., spectroscope, centrifuge, burettes, meters) and materials
          (e.g., acid/base indicators, solubility tables, galvanic cells), and identify appropriate methods,
          techniques, and procedures, for each inquiry
      - code: A1.3
        text: identify and locate a variety of print and electronic sources that enable them to address
          research topics fully and appropriately
      - code: A1.4
        text: apply knowledge and understanding of safe laboratory practices and procedures when planning
          investigations by correctly interpreting Workplace Hazardous Materials Information System (WHMIS)
          symbols; by using appropriate techniques for handling and storing laboratory equipment and materials
          and disposing of laboratory materials (e.g., safely disposing of organic solutions); and by
          using appropriate personal protection (e.g., wearing safety goggles)
      - code: A1.5
        text: conduct inquiries, controlling relevant variables, adapting or extending procedures as required,
          and using appropriate materials and equipment safely, accurately, and effectively, to collect
          observations and data
      - code: A1.6
        text: compile accurate data from laboratory and other sources, and organize and record the data,
          using appropriate formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from a variety of appropriate
          sources, including electronic, print, and/or human sources, using suitable formats and an accepted
          form of academic documentation
      - code: A1.8
        text: synthesize, analyse, interpret, and evaluate qualitative and/or quantitative data; solve
          problems involving quantitative data; determine whether the evidence supports or refutes the
          initial prediction or hypothesis and whether it is consistent with scientific theory; identify
          sources of bias and/or error; and suggest improvements to the inquiry to reduce the likelihood
          of error
      - code: A1.9
        text: analyse the information gathered from research sources for logic, accuracy, reliability,
          adequacy, and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
          with reference to scientific knowledge
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric, symbolic, and graphic modes of representation (e.g., represent
          ionic and molecular compounds by their accepted formulae and names), and appropriate units of
          measurement (e.g., SI and imperial units)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places or significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers related to the fields of science under
        study, and describe the contributions of scientists, including Canadians, to those fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., environmental technologist, pharmacy technician, electroplating technician, green building
          or renewable energy technician, veterinary technician, biochemical technologist) and the education
          and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Jed Harrison, Louis
          Slotin, Paul Kebarle, James Robert Bolton, Brian Evans Conway, Lee Wilson), to the fields under
          study
  - code: B
    title: Matter and Qualitative Analysis
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the effects of chemical
        substances on the environment, and analyse practical applications of qualitative analysis of matter'
      specific:
      - code: B1.1
        text: evaluate the risks and benefits to the environment of some commonly used chemical substances
          (e.g., substances used in fireworks, fire extinguishers, “green” cleaning products) [AI, C]
      - code: B1.2
        text: analyse, on the basis of research, applications of qualitative analysis of matter in various
          fields of endeavour (e.g., in law enforcement to detect drugs or identify counterfeit money;
          in the manufacture of food products) [IP, PR, AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate matter, using various methods
        of qualitative analysis'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to qualitative analysis of matter, including, but not
          limited to: double displacement, precipitate, and energy level [C]'
      - code: B2.2
        text: use a table of solubility rules to write chemical equations for double displacement reactions
          and to write balanced net ionic equations for chemical reactions [AI, C]
      - code: B2.3
        text: investigate precipitation reactions and flame tests, using qualitative analysis instruments,
          equipment, and techniques (e.g., gas discharge tubes, high-voltage electrical sources, spectroscope,
          centrifuge) [PR, AI]
      - code: B2.4
        text: conduct qualitative analyses of an unknown sample (e.g., a household or workplace chemical),
          using a flow chart and experimental procedures, including flame tests and precipitation reactions,
          to determine the presence of metal ions [PR, AI]
      - code: B2.5
        text: identify an unknown gas sample (e.g., hydrogen, helium, neon) by observing its emission
          spectrum and comparing it to the spectra of known gases [PR, AI]
      - code: B2.6
        text: use a table of solubility rules to predict if a precipitate will form in a given chemical
          reaction, and identify the precipitate formed [AI]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the basic principles of qualitative
        analysis of matter'
      specific:
      - code: B3.1
        text: explain the relationship between the atomic number and the mass number of an element, and
          the difference between isotopes and radioisotopes of an element
      - code: B3.2
        text: describe various types of chemical reactions, including synthesis, decomposition, single
          displacement, and double displacement reactions
      - code: B3.3
        text: explain basic procedures used in qualitative analysis of elements and compounds, including
          flame tests, precipitation reactions, and the observation of emission spectra
      - code: B3.4
        text: relate observations from investigations using flame tests and emission spectra to the concept
          of quanta of energy proposed by Neils Bohr
  - code: C
    title: Organic Chemistry
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the impact on society,
        human health, and the environment of products made using organic compounds'
      specific:
      - code: C1.1
        text: identify various materials and products used in everyday life that are made from organic
          compounds (e.g., synthetic fabrics, drugs, pesticides, cosmetics, organic solvents, car parts,
          artificial hearts), and assess the benefits of those products for society, as well as the health
          hazards they pose [AI, C]
      - code: C1.2
        text: research a useful product made from one or more organic substances (e.g., CDs, made from
          crude oil), and assess the environmental impact of the production, use, and disposal of the
          product [IP, PR, AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate the physical and chemical
        properties of organic compounds, and analyse some common organic chemical reactions'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to organic chemistry, including, but not limited to:
          electronegativity, covalent bond, and functional group [C]'
      - code: C2.2
        text: draw Lewis structures to represent the covalent bonds in some simple organic molecules (e.g.,
          CH4) [AI, C]
      - code: C2.3
        text: build molecular models of, and create structural formulae for, some simple organic molecules
          (e.g., methane, butane, ethyne) [PR, AI, C]
      - code: C2.4
        text: conduct an inquiry to determine the physical and chemical properties of some common organic
          compounds (e.g., solubility [in polar and non-polar solvents], conductivity, odour, combustibility)
          [PR, AI]
      - code: C2.5
        text: conduct an inquiry to demonstrate separation of a mixture of liquids by distillation [PR]
      - code: C2.6
        text: conduct an inquiry to identify some of the products of the combustion of a hydrocarbon and
          an alcohol [PR, AI]
      - code: C2.7
        text: conduct an inquiry to synthesize a common organic compound (e.g., produce an ester, make
          soap) [PR]
      - code: C2.8
        text: predict the nature of a bond (e.g., non-polar covalent or polar covalent), using the electronegativity
          values of atoms (e.g., H2 , Cl2 , O2 , H2O, CH4, CH3OH) [AI]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the structure and the physical
        and chemical properties of organic compounds'
      specific:
      - code: C3.1
        text: describe the unique characteristics of the carbon atom in terms of covalent bonding
      - code: C3.2
        text: identify functional group structures that define common classes of organic compounds (e.g.,
          alkenes, alkanes, alkynes, alcohols, aldehydes, ketones, carboxylic acids, esters, amines)
      - code: C3.3
        text: explain the general properties (e.g., polarity, solubility in water) of molecules that contain
          oxygen or nitrogen
      - code: C3.4
        text: use structural formulae to describe some simple organic chemical reactions (e.g., addition,
          substitution, combustion)
      - code: C3.5
        text: explain how the physical properties of a substance affect the processes used to separate
          organic chemical substances (e.g., distillation of crude oil, distillation of alcohols)
      - code: C3.6
        text: identify the first ten hydrocarbons of the alkanes, the alkenes, and the alkynes by their
          names and structural formulae, using International Union of Pure and Applied Chemistry (IUPAC)
          nomenclature for alkanes, alkenes, and alkynes
      - code: C3.7
        text: explain the dangers associated with the use of organic solvents (e.g., dry-cleaning compounds,
          paint thinners, glue solvents, nail polish remover), and some general precautions related to
          their use
  - code: D
    title: Electrochemistry
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: analyse technological applications
        or processes relating to oxidation-reduction reactions, and assess their impact on the environment'
      specific:
      - code: D1.1
        text: analyse, on the basis of research, a technological application that is based on the oxidation-reduction
          (redox) reaction that occurs in galvanic cells (e.g., in cardiac pacemakers, batteries, electroplating)
          [IP, PR, AI, C]
      - code: D1.2
        text: analyse, on the basis of research, the causes of metal corrosion, and assess the environmental
          impact of some techniques used to protect metals from corrosion (e.g., rustproofing, painting,
          cathodic protection, galvanization) [IP, PR, AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate the oxidation-reduction
        reaction that occurs in a galvanic cell'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to electrochemistry, including, but not limited to:
          oxidation, anode, and electrolyte [C]'
      - code: D2.2
        text: build a galvanic cell and measure its voltage [PR, AI]
      - code: D2.3
        text: analyse the processes in galvanic cells, and draw labelled diagrams of these cells to show
          the oxidation or reduction reaction that occurs in each of the half-cells, the direction of
          electron flow, the location of the electrodes, and the direction of ion movement [AI, C]
      - code: D2.4
        text: design and conduct an inquiry to determine the factors that affect rate of corrosion of
          a metal (e.g., stress on the metal, contact between two metals, surface oxide, the nature of
          the electrolyte, the nature of the metal) [IP, PR, AI]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the concepts of oxidation and
        reduction, and the principles of oxidation-reduction reactions'
      specific:
      - code: D3.1
        text: explain the concepts of oxidation and reduction in terms of the chemical changes that occur
          during redox reactions
      - code: D3.2
        text: describe the components of a galvanic cell, and explain how each component functions in
          a redox reaction
      - code: D3.3
        text: describe the chemical reaction that results in the corrosion of metal
  - code: E
    title: Chemical Calculations
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: analyse processes in the home,
        the workplace, or the environmental sector that use chemical quantities and calculations, and
        assess the importance of accuracy in chemical calculations'
      specific:
      - code: E1.1
        text: analyse processes in the home, the workplace, or the environmental sector that require an
          understanding of accurate chemical calculations (e.g., baking according to a recipe; manufacturing
          items such as fertilizer, paint, pharmaceuticals; testing water quality in a public pool) [AI,
          C]
      - code: E1.2
        text: assess, on the basis of research, the importance of quantitative accuracy in the concentration
          of solutions used for medical purposes or personal care (e.g., cough syrup, intravenous solutions,
          sunscreen) [IP, PR, AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate chemical compounds and
        chemical reactions using appropriate techniques of quantitative analysis, and solve related problems'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to stoichiometry, including, but not limited to: molar
          mass, molar concentration, percentage yield, and Avogadro’s number [C]'
      - code: E2.2
        text: calculate the molar mass of simple compounds with the aid of the periodic table [AI]
      - code: E2.3
        text: convert the quantity of chemicals in simple chemical reactions from number of particles
          to number of moles and mass, using the mole concept [AI]
      - code: E2.4
        text: 'solve problems involving relationships between the following variables in a chemical reaction:
          quantity in moles, number of particles, atomic mass, concentration of solution, and volume of
          solution [AI]'
      - code: E2.5
        text: solve problems involving stoichiometric relationships in balanced chemical equations [AI]
      - code: E2.6
        text: conduct an inquiry to determine the actual yield, theoretical yield, and percentage yield
          of the products of a chemical reaction (e.g., a chemical reaction between steel wool and copper(II)
          sulfate solution), assess the effectiveness of the procedure, and suggest sources of experimental
          error [PR, AI]
      - code: E2.7
        text: use qualitative observations of a chemical reaction to identify the chemical changes, presence
          of limiting reagents, and the products occurring in a chemical reaction (e.g., aluminum reacting
          with copper(II) chloride solution, steel wool reacting with oxygen) [PR, AI]
      - code: E2.8
        text: prepare aqueous solutions of given concentrations (e.g., concentrations expressed in grams
          per litre or moles per litre) by dissolving a solid solute in a solvent or by diluting a concentrated
          solution (e.g., a stock solution) [PR, AI]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the mole concept and its quantitative
        relationships in chemical reactions'
      specific:
      - code: E3.1
        text: describe the relationships between Avogadro’s number, the mole concept, and the molar mass
          of any given substance
      - code: E3.2
        text: describe some possible sources of experimental error in an investigation of a chemical reaction,
          and explain how the errors would affect the percentage yield of products of the reaction
      - code: E3.3
        text: explain the relationships between the mole concept, the values of coefficients, the number
          of particles, and the mass of substances in balanced chemical equations
      - code: E3.4
        text: explain the concept of molar concentration of a solution, using appropriate units of measure
      - code: E3.5
        text: explain the concept of a limiting reagent in a chemical reaction, using examples of chemical
          processes from everyday life (e.g., synthesis of aspirin, synthesis of ammonia)
  - code: F
    title: Chemistry in the Environment
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the importance of
        government regulations, scientific analyses, and individual actions in improving air and water
        quality, and propose a personal plan of action to support these efforts'
      specific:
      - code: F1.1
        text: evaluate, on the basis of research, the effectiveness of government initiatives or regulations
          (e.g., the Great Lakes Action Plan), and the actions of individuals (e.g., use of public transportation),
          intended to improve air and water quality, and propose a personal action plan to support these
          efforts [IP, PR, AI, C]
      - code: F1.2
        text: evaluate the importance of quantitative chemical analysis in assessing air and water quality
          (e.g., the use of Environment Canada’s Air Quality Index to determine when smog advisories need
          to be issued; systems to monitor the quality of drinking water), and explain how these analyses
          contribute to environmental awareness and responsibility [AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate chemical reactions, using
        appropriate techniques of quantitative analysis'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to chemical analysis and chemistry in the environment,
          including, but not limited to: ozone, hard water, titration, pH, ppm, and ppb [C]'
      - code: F2.2
        text: write balanced chemical equations to represent the chemical reactions involved in the neutralization
          of acids and bases [AI, C]
      - code: F2.3
        text: conduct an acid–base titration to determine the concentration of an acid or a base (e.g.,
          the concentration of acetic acid in vinegar) [PR, AI]
      - code: F2.4
        text: conduct an inquiry, using available technology (e.g., probewear) or chemical tests, to detect
          the presence of inorganic substances in various samples of water [PR, AI]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of chemical reactions that occur
        in the environment as a result of both natural processes and human activities'
      specific:
      - code: F3.1
        text: identify major and minor chemical components of Earth’s atmosphere
      - code: F3.2
        text: identify gases and particulates that are commonly found in the atmosphere, and explain how
          they affect air quality (e.g., greenhouse gases, tropospheric and stratospheric ozone, carbon
          monoxide, chlorofluorocarbons, soot)
      - code: F3.3
        text: state and explain the Arrhenius definition of acids and bases
      - code: F3.4
        text: explain the difference between strong and weak acids, and between strong and weak bases,
          in terms of degree of ionization
      - code: F3.5
        text: identify the gas emissions that are the major contributors to acid precipitation, and explain
          the steps in the formation of acid rain
      - code: F3.6
        text: explain the difference between the concepts of strength and concentration when referring
          to solutions of acids and bases
      - code: F3.7
        text: identify inorganic substances that can be found dissolved in water as a result of natural
          processes and human activities (e.g., hard water contains metal ions)
- course: SCH4U
  title: Chemistry, Grade 12, University Preparation
  grade: 12
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate relevant scientific questions about observed relationships, ideas, problems, or
          issues, make informed predictions, and/or formulate educated hypotheses to focus inquiries or
          research
      - code: A1.2
        text: select appropriate instruments (e.g., glassware, calorimeter, thermometer) and materials
          (e.g., chemical compounds and solutions), and identify appropriate methods, techniques, and
          procedures, for each inquiry
      - code: A1.3
        text: identify and locate a variety of print and electronic sources that enable them to address
          research topics fully and appropriately
      - code: A1.4
        text: apply knowledge and understanding of safe laboratory practices and procedures when planning
          investigations by correctly interpreting Workplace Hazardous Materials Information System (WHMIS)
          symbols; by using appropriate techniques for handling and storing laboratory equipment and materials
          and disposing of laboratory materials; and by using appropriate personal protection (e.g., wearing
          safety goggles)
      - code: A1.5
        text: conduct inquiries, controlling relevant variables, adapting or extending procedures as required,
          and using appropriate materials and equipment safely, accurately, and effectively, to collect
          observations and data
      - code: A1.6
        text: compile accurate data from laboratory and other sources, and organize and record the data,
          using appropriate formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from a variety of appropriate
          sources, including electronic, print, and human sources, using suitable formats and an accepted
          form of academic documentation
      - code: A1.8
        text: synthesize, analyse, interpret, and evaluate qualitative and/or quantitative data; solve
          problems involving quantitative data; determine whether the evidence supports or refutes the
          initial prediction or hypothesis and whether it is consistent with scientific theory; identify
          sources of bias and error; and suggest improvements to the inquiry to reduce the likelihood
          of error
      - code: A1.9
        text: analyse the information gathered from research sources for logic, accuracy, reliability,
          adequacy, and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
          with reference to scientific knowledge
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric, symbolic, and graphic modes of representation, and appropriate
          units of measurement (e.g., SI units, imperial units)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places and significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers related to the fields of science under
        study, and describe the contributions of scientists, including Canadians, to those fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., food and drug analyst, chemical safety officer, nurse practitioner, consumer protection
          specialist, metallurgy technologist, environmental and waste management technician, geochemist)
          and the education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Robert G. Ackman, Alice
          Wilson, Carol Ann Budd, Norman L. Bowen, Brian Evans Conway), to the fields under study
  - code: B
    title: Organic Chemistry
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: assess the social and environmental
        impact of organic compounds used in everyday life, and propose a course of action to reduce the
        use of compounds that are harmful to human health and the environment'
      specific:
      - code: B1.1
        text: assess the impact on human health, society, and the environment of organic compounds used
          in everyday life (e.g., polymers, nutritional supplements, food additives, pharmaceuticals,
          pesticides) [AI, C]
      - code: B1.2
        text: propose a personal course of action to reduce the use of compounds that are harmful to human
          health and the environment (e.g., weed lawns by hand rather than using herbicides, use cloth
          bags for shopping to reduce the number of plastic bags in landfill sites, choose fuel-efficient
          or hybrid vehicles to reduce fossil fuel emissions) [AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate organic compounds and organic
        chemical reactions, and use various methods to represent the compounds'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to organic chemistry, including, but not limited to:
          organic compound, functional group, saturated hydrocarbon, unsaturated hydrocarbon, structural
          isomer, stereoisomer, and polymer [C]'
      - code: B2.2
        text: use International Union of Pure and Applied Chemistry (IUPAC) nomenclature conventions to
          identify names, write chemical formulae, and create structural formulae for the different classes
          of organic compounds, including hydrocarbons, alcohols, aldehydes, ketones, carboxylic acids,
          esters, ethers, amines, amides, and simple aromatic compounds [AI, C]
      - code: B2.3
        text: build molecular models for a variety of simple organic compounds [PR, AI, C]
      - code: B2.4
        text: analyse, on the basis of inquiry, various organic chemical reactions (e.g., production of
          esters, polymerization, oxidation of alcohols, multiple bonds in an organic compound, combustion
          reactions, addition reactions) [PR, AI]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the structure, properties,
        and chemical behaviour of compounds within each class of organic compounds'
      specific:
      - code: B3.1
        text: compare the different classes of organic compounds, including hydrocarbons, alcohols, aldehydes,
          ketones, carboxylic acids, esters, ethers, amines, and amides, by describing the similarities
          and differences in names and structural formulae of the compounds within each class
      - code: B3.2
        text: describe the similarities and differences in physical properties (e.g., solubility in different
          solvents, odour, melting point, boiling point) within each class of organic compounds
      - code: B3.3
        text: explain the chemical changes that occur during various types of organic chemical reactions,
          including substitution, addition, elimination, oxidation, esterification, and hydrolysis
      - code: B3.4
        text: explain the difference between an addition reaction and a condensation polymerization reaction
      - code: B3.5
        text: explain the concept of isomerism in organic compounds, and how variations in the properties
          of isomers relate to their structural and molecular formulae
  - code: C
    title: Structure and Properties Of Matter
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: assess the benefits to society
        and evaluate the environmental impact of products and technologies that apply principles related
        to the structure and properties of matter'
      specific:
      - code: C1.1
        text: assess the benefits to society of technologies that are based on the principles of atomic
          and molecular structures (e.g., magnetic resonance imaging [MRI], infrared spectroscopy, X-ray
          crystallography, nuclear energy, medical applications of spectroscopy and mass spectrometry)
          [AI, C]
      - code: C1.2
        text: evaluate the benefits to society, and the impact on the environment, of specialized materials
          that have been created on the basis of scientific research into the structure of matter and
          chemical bonding (e.g., bulletproof fabric, nanotechnologies, superconductors, instant adhesives)
          [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate the molecular shapes and
        physical properties of various types of matter'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to structure and properties of matter, including, but
          not limited to: orbital, emission spectrum, energy level, photon, and dipole [C]'
      - code: C2.2
        text: use the Pauli exclusion principle, Hund’s rule, and the aufbau principle to write electron
          configurations for a variety of elements in the periodic table [AI, C]
      - code: C2.3
        text: pedict the shapes of simple molecules and ions (e.g., CH4, SO3, O2, H2O, NH4 + ), using
          the valence shell electron pair repulsion (VSEPR) model, and draw diagrams to represent their
          molecular shapes [AI, C]
      - code: C2.4
        text: predict the polarity of various chemical compounds, based on their molecular shapes and
          the difference in the electronegativity values of the atoms [AI]
      - code: C2.5
        text: predict the type of solid (ionic, molecular, covalent network, metallic) formed by a given
          substance in a chemical reaction, and describe the properties of that solid [AI]
      - code: C2.6
        text: conduct an inquiry to observe and analyse the physical properties of various substances
          (e.g., salts, metals) and to determine the type of chemical bonding present in each substance
          [PR, AI]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of atomic structure and chemical
        bonding, and how they relate to the physical properties of ionic, molecular, covalent network,
        and metallic substances'
      specific:
      - code: C3.1
        text: explain how experimental observations and inferences made by Ernest Rutherford and Niels
          Bohr contributed to the development of the planetary model of the hydrogen atom
      - code: C3.2
        text: describe the electron configurations of a variety of elements in the periodic table, using
          the concept of energy levels in shells and subshells, as well as the Pauli exclusion principle,
          Hund’s rule, and the aufbau principle
      - code: C3.3
        text: identify the characteristic properties of elements in each of the s, p, and d blocks of
          the periodic table, and explain the relationship between the position of an element in the periodic
          table, its properties, and its electron configuration
      - code: C3.4
        text: explain how the physical properties of a solid or liquid (e.g., solubility, boiling point,
          melting point, melting point suppression, hardness, electrical conductivity, surface tension)
          depend on the particles present and the types of intermolecular and intramolecular forces (e.g.,
          covalent bonding, ionic bonding, Van der Waals forces, hydrogen bonding, metallic bonding)
      - code: C3.5
        text: describe a Canadian contribution to the field of atomic and molecular theory (e.g., the
          work of Richard F.W. Bader of McMaster University on electronic density in small molecules;
          the work of Robert J. LeRoy of the University of Waterloo on the mathematical technique to determine
          the atomic radius of molecules known as the LeRoy Radius; the work of Ronald J. Gillespie of
          McMaster University on the VSEPR model)
  - code: D
    title: Energy Changes and Rates of Reaction
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: analyse technologies and chemical
        processes that are based on energy changes, and evaluate them in terms of their efficiency and
        their effects on the environment'
      specific:
      - code: D1.1
        text: analyse some conventional and alternative energy technologies (e.g., fossil fuel–burning
          power plants, hydro-powered generators, solar panels, wind turbines, fuel cells), and evaluate
          them in terms of their efficiency and impact on the environment [AI, C]
      - code: D1.2
        text: analyse the conditions (e.g., temperature, pressure, presence of a catalyst) required to
          maximize the efficiency of some common natural or industrial chemical reactions (e.g., decomposition,
          combustion, neutralization), and explain how the improved efficiency of the reaction contributes
          to environmental sustainability [AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate and analyse energy changes
        and rates of reaction in physical and chemical processes, and solve related problems'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to energy changes and rates of reaction, including,
          but not limited to: enthalpy, activation energy, endothermic, exothermic, potential energy,
          and specific heat capacity [C]'
      - code: D2.2
        text: write thermochemical equations, expressing the energy change as a ΔH value or as a heat
          term in the equation [AI, C]
      - code: D2.3
        text: solve problems involving analysis of heat transfer in a chemical reaction, using the equation
          Q = mcΔT (e.g., calculate the energy released in the combustion of an organic compound, and
          express the results in energy per mole of fuel [J/mol]) [AI, C]
      - code: D2.4
        text: plan and conduct an inquiry to calculate, using a calorimeter, the heat of reaction of a
          substance (e.g., the heat of solution of ammonium nitrate, or of combustion of a hydrocarbon),
          compare the actual heat of reaction to the theoretical value, and suggest sources of experimental
          error [IP, PR, AI, C]
      - code: D2.5
        text: solve problems related to energy changes in a chemical reaction, using Hess’s law [AI]
      - code: D2.6
        text: conduct an inquiry to test Hess’s law (e.g., measure heats of reaction from the combustion
          of magnesium, and combine them to yield the ΔH value of the reaction) [PR, AI]
      - code: D2.7
        text: calculate the heat of reaction for a formation reaction, using a table of standard enthalpies
          of formation and applying Hess’s law [AI]
      - code: D2.8
        text: plan and conduct an inquiry to determine how various factors (e.g., change in temperature,
          addition of a catalyst, increase in surface area of a solid reactant) affect the rate of a chemical
          reaction [IP, PR, AI]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of energy changes and rates of
        reaction'
      specific:
      - code: D3.1
        text: compare the energy changes resulting from physical change (e.g., boiling water), chemical
          reactions (e.g., bleaching a stain), and nuclear reactions (e.g., fission, fusion), in terms
          of whether energy is released or absorbed
      - code: D3.2
        text: compare the energy change from a reaction in which bonds are formed to one in which bonds
          are broken, and explain these changes in terms of endothermic and exothermic reactions
      - code: D3.3
        text: explain how mass, heat capacity, and change in temperature of a substance determine the
          amount of heat gained or lost by the substance
      - code: D3.4
        text: state Hess’s law, and explain, using examples, how it is applied to find the enthalpy changes
          of a reaction
      - code: D3.5
        text: explain, using collision theory and potential energy diagrams, how factors such as temperature,
          the surface area of the reactants, the nature of the reactants, the addition of catalysts, and
          the concentration of the solution control the rate of a chemical reaction
      - code: D3.6
        text: describe simple potential energy diagrams of chemical reactions (e.g., the relationships
          between the relative energies of reactants and products and the activation energy of the reaction)
      - code: D3.7
        text: explain, with reference to a simple chemical reaction (e.g., combustion), how the rate of
          a reaction is determined by the series of elementary steps that make up the overall reaction
          mechanism
  - code: E
    title: Chemical Systems and Equilibrium
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: analyse chemical equilibrium
        processes, and assess their impact on biological, biochemical, and technological systems'
      specific:
      - code: E1.1
        text: analyse the optimal conditions for a specific chemical process related to the principles
          of equilibrium that takes place in nature or is used in industry (e.g., the production of sulfuric
          acid, electrolyte balance in the human body, sedimentation in water systems) [AI, C]
      - code: E1.2
        text: assess the impact of chemical equilibrium processes on various biological, biochemical,
          and technological systems (e.g., remediation in areas of heavy metal contamination, development
          of gallstones, use of buffering in medications, use of barium sulfate in medical diagnosis)
          [AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate the qualitative and quantitative
        nature of chemical systems at equilibrium, and solve related problems'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to chemical systems and equilibrium, including, but
          not limited to: homogeneous, closed system, reversible reaction, equilibrium constant, equilibrium
          concentration, molar solubility, and buffer [C]'
      - code: E2.2
        text: predict, applying Le Châtelier’s principle or the reaction quotient for a given reaction,
          how various factors (e.g., changes in volume, temperature, or concentration of reactants or
          products in a solution) would affect a chemical system at equilibrium, and conduct an inquiry
          to test those predictions [PR, AI]
      - code: E2.3
        text: conduct an inquiry to determine the value of an equilibrium constant for a chemical reaction
          (e.g., Keq for iron(III) thiocyanate, Ksp for calcium hydroxide, Ka for acetic acid) [PR, AI]
      - code: E2.4
        text: solve problems related to equilibrium by performing calculations involving concentrations
          of reactants and products (e.g., Keq, Ksp, Ka, pH, pOH, Kp, Kb) [AI]
      - code: E2.5
        text: solve problems related to acid–base equilibrium, using acid–base titration data and the
          pH at the equivalence point [AI]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the concept of dynamic equilibrium
        and the variables that cause shifts in the equilibrium of chemical systems'
      specific:
      - code: E3.1
        text: explain the concept of dynamic equilibrium, using examples of physical and chemical equilibrium
          systems (e.g., liquid–vapour equilibrium, weak electrolytes in solution, reversible chemical
          reactions)
      - code: E3.2
        text: explain the concept of chemical equilibrium and how it applies to the concentration of reactants
          and products in a chemical reaction at equilibrium
      - code: E3.3
        text: explain Le Châtelier’s principle and how it applies to changes to a chemical reaction at
          equilibrium
      - code: E3.4
        text: identify common equilibrium constants, including Keq, Ksp, Kw, Ka, Kb, and Kp, and write
          the expressions for each
      - code: E3.5
        text: use the ionization constant of water (Kw) to calculate pH, pOH, [H3O+ ], and [OH– ] for
          chemical reactions
      - code: E3.6
        text: explain the Brønsted-Lowry theory of acids and bases
      - code: E3.7
        text: compare the properties of strong and weak acids, and strong and weak bases, using the concept
          of dynamic equilibrium
      - code: E3.8
        text: describe the chemical characteristics of buffer solutions
  - code: F
    title: Electrochemistry
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: analyse technologies and processes
        relating to electrochemistry, and their implications for society, health and safety, and the environment'
      specific:
      - code: F1.1
        text: assess, on the basis of research, the viability of using electrochemical technologies as
          alternative sources of energy (e.g., fuel cells for emergency power generation or as power sources
          in remote locations), and explain their potential impact on society and the environment [IP,
          PR, AI, C]
      - code: F1.2
        text: analyse health and safety issues involving electrochemistry (e.g., corrosion of metal pipes
          in drinking water systems) [AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate oxidation-reduction reactions
        using a galvanic cell, and analyse electrochemical reactions in qualitative and quantitative terms'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to electrochemistry, including, but not limited to:
          half-reaction, electrochemical cell, reducing agent, oxidizing agent, redox reaction, and oxidation
          number [C]'
      - code: F2.2
        text: conduct an inquiry to analyse, in qualitative terms, an oxidation-reduction (redox) reaction
          [PR, AI, C]
      - code: F2.3
        text: write balanced chemical equations for oxidation-reduction reactions, using various methods
          including oxidation numbers of atoms and the half-reaction method of balancing [AI, C]
      - code: F2.4
        text: build a galvanic cell and measure its cell potential [PR, AI]
      - code: F2.5
        text: analyse the processes in galvanic cells, and draw labelled diagrams of these cells to show
          the oxidation or reduction reaction that occurs in each of the half-cells, the direction of
          electron flow, the electrode polarity (anode and cathode), the cell potential, and the direction
          of ion movement [AI, C]
      - code: F2.6
        text: predict the spontaneity of redox reactions, based on overall cell potential as determined
          using a table of standard reduction potentials for redox half-reactions [AI]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the principles of oxidation-reduction
        reactions and the many practical applications of electrochemistry'
      specific:
      - code: F3.1
        text: explain redox reactions in terms of the loss and gain of electrons and the associated change
          in oxidation number
      - code: F3.2
        text: identify the components of a galvanic cell, and explain how each component functions in
          a redox reaction
      - code: F3.3
        text: describe galvanic cells in terms of oxidation and reduction half-cells whose voltages can
          be used to determine overall cell potential
      - code: F3.4
        text: explain how the hydrogen half-cell is used as a standard reference to determine the voltages
          of another half-cell
      - code: F3.5
        text: explain some applications of electrochemistry in common industrial processes (e.g., in refining
          metals such as aluminum and zinc; in the production of hydrogen)
      - code: F3.6
        text: explain the corrosion of metals in terms of an electrochemical process, and describe some
          common corrosion-inhibiting techniques (e.g., painting, galvanizing, cathodic protection)
- course: SBI4U
  title: Biology, Grade 12, University Preparation
  grade: 12
  strands:
  - code: A
    title: Scientific Investigation Skills and Career Exploration
    overall:
    - code: A1
      text: 'Scientific Investigation Skills: demonstrate scientific investigation skills (related to
        both inquiry and research) in the four areas of skills (initiating and planning, performing and
        recording, analysing and interpreting, and communicating)'
      specific:
      - code: A1.1
        text: formulate relevant scientific questions about observed relationships, ideas, problems, or
          issues, make informed predictions, and/or formulate educated hypotheses to focus inquiries or
          research
      - code: A1.2
        text: select appropriate instruments (e.g., dialysis tubing, glassware, sphygmomanometer) and
          materials (e.g., DNA models, plants, plant cuttings, molecular models), and identify appropriate
          methods, techniques, and procedures, for each inquiry
      - code: A1.3
        text: identify and locate a variety of print and electronic sources that enable them to address
          research topics fully and appropriately
      - code: A1.4
        text: apply knowledge and understanding of safe laboratory practices and procedures when planning
          investigations by correctly interpreting Workplace Hazardous Materials Information System (WHMIS)
          symbols; by using appropriate techniques for handling and storing laboratory equipment and materials
          and disposing of laboratory and biological materials (e.g., plants and invertebrates); and by
          using appropriate personal protection
      - code: A1.5
        text: conduct inquiries, controlling relevant variables, adapting or extending procedures as required,
          and using appropriate materials and equipment safely, accurately, and effectively, to collect
          observations and data
      - code: A1.6
        text: compile accurate data from laboratory and other sources, and organize and record the data,
          using appropriate formats, including tables, flow charts, graphs, and/or diagrams
      - code: A1.7
        text: select, organize, and record relevant information on research topics from a variety of appropriate
          sources, including electronic, print, and/or human sources, using suitable formats and an accepted
          form of academic documentation
      - code: A1.8
        text: synthesize, analyse, interpret, and evaluate qualitative and/or quantitative data to determine
          whether the evidence supports or refutes the initial prediction or hypothesis and whether it
          is consistent with scientific theory; identify sources of bias and/or error; and suggest improvements
          to the inquiry to reduce the likelihood of error
      - code: A1.9
        text: analyse the information gathered from research sources for logic, accuracy, reliability,
          adequacy, and bias
      - code: A1.10
        text: draw conclusions based on inquiry results and research findings, and justify their conclusions
          with reference to scientific knowledge
      - code: A1.11
        text: communicate ideas, plans, procedures, results, and conclusions orally, in writing, and/or
          in electronic presentations, using appropriate language and a variety of formats (e.g., data
          tables, laboratory reports, presentations, debates, simulations, models)
      - code: A1.12
        text: use appropriate numeric, symbolic, and graphic modes of representation (e.g., biological
          diagrams, three-dimensional molecular models), and appropriate units of measurement (e.g., SI
          and imperial units)
      - code: A1.13
        text: express the results of any calculations involving data accurately and precisely, to the
          appropriate number of decimal places or significant figures
    - code: A2
      text: 'Career Exploration: identify and describe careers related to the fields of science under
        study, and describe contributions of scientists, including Canadians, to those fields'
      specific:
      - code: A2.1
        text: identify and describe a variety of careers related to the fields of science under study
          (e.g., scientific journalist, fisheries and wildlife officer, physician, infectious disease
          researcher, geneticist) and the education and training necessary for these careers
      - code: A2.2
        text: describe the contributions of scientists, including Canadians (e.g., Evelyn Roden Nelson,
          Maude Menten, Albert Juan Aguayo, Kimberley J. Fernie, Michael Archer), to the fields under
          study
  - code: B
    title: Biochemistry
    overall:
    - code: B1
      text: 'Relating Science to Technology, Society, and the Environment: analyse technological applications
        of enzymes in some industrial processes, and evaluate technological advances in the field of cellular
        biology'
      specific:
      - code: B1.1
        text: analyse technological applications related to enzyme activity in the food and pharmaceutical
          industries (e.g., the production of dairy products; breadmaking; the use of enzymes to control
          reaction rates in pharmaceuticals) [AI, C]
      - code: B1.2
        text: evaluate, on the basis of research, some advances in cellular biology and related technological
          applications (e.g., new treatments for cancer, HIV/AIDS, and hepatitis C; radioisotopic labelling
          to study the function of internal organs; fluorescence to study genetic material within cells;
          forensic biological techniques to aid in crime resolution) [IP, PR, AI, C]
    - code: B2
      text: 'Developing Skills of Investigation and Communication: investigate the chemical structures,
        functions, and chemical properties of biological molecules involved in some common cellular processes
        and biochemical reactions'
      specific:
      - code: B2.1
        text: 'use appropriate terminology related to biochemistry, including, but not limited to: active
          and passive transport, covalent and ionic bond, allosteric site, substrate, substrate-enzyme
          complex, and inhibition [C]'
      - code: B2.2
        text: plan and conduct an investigation to demonstrate the movement of substances across a membrane
          (e.g., the effects of salt water and distilled water on a potato) [IP, PR]
      - code: B2.3
        text: construct and draw three-dimensional molecular models of important biochemical compounds,
          including carbohydrates, proteins, lipids, and nucleic acids [PR, C]
      - code: B2.4
        text: conduct biological tests to identify biochemical compounds found in various food samples
          (e.g., use Benedict’s solution to test for carbohydrates in food samples), and compare the biochemical
          compounds found in each food to those found in the others [PR, AI, C]
      - code: B2.5
        text: plan and conduct an investigation related to a cellular process (e.g., factors that affect
          enzyme activity; factors that affect transport of substances across cell membranes), using appropriate
          laboratory equipment and techniques, and report the results in an appropriate format [IP, PR,
          C]
    - code: B3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the structures and functions
        of biological molecules, and the biochemical reactions required to maintain normal cellular function'
      specific:
      - code: B3.1
        text: explain the roles of various organelles, such as lysosomes, vacuoles, mitochondria, internal
          cell membranes, ribosomes, smooth and rough endoplasmic reticulum, and Golgi bodies, in cellular
          processes
      - code: B3.2
        text: describe the structure of important biochemical compounds, including carbohydrates, proteins,
          lipids, and nucleic acids, and explain their function within cells
      - code: B3.3
        text: identify common functional groups within biological molecules (e.g., hydroxyl, carbonyl,
          carboxyl, amino, phosphate), and explain how they contribute to the function of each molecule
      - code: B3.4
        text: describe the chemical structures and mechanisms of various enzymes
      - code: B3.5
        text: identify and describe the four main types of biochemical reactions (oxidation-reduction
          [redox], hydrolysis, condensation, and neutralization)
      - code: B3.6
        text: describe the structure of cell membranes according to the fluid mosaic model, and explain
          the dynamics of passive transport, facilitated diffusion, and the movement of large particles
          across the cell membrane by the processes of endocytosis and exocytosis
  - code: C
    title: Metabolic Processes
    overall:
    - code: C1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the role of metabolic
        processes in the functioning of biotic and abiotic systems, and evaluate the importance of an
        understanding of these processes and related technologies to personal choices made in everyday
        life'
      specific:
      - code: C1.1
        text: analyse the role of metabolic processes in the functioning of and interactions between biotic
          and abiotic systems (e.g., specialized microbes and enzymes in biotechnological applications
          to treat wastewater in the pulp and paper industry; microbes and enzymes in bioremediation,
          such as in the cleanup of oil spills; energy transfer from producers to consumers) [AI, C]
      - code: C1.2
        text: assess the relevance, to their personal lives and to the community, of an understanding
          of cell biology and related technologies (e.g., knowledge of metabolic processes is relevant
          to personal choices about exercise, diet, and the use of pharmacological substances; knowledge
          of cellular processes aids in our understanding and treatment of mitochondrial diseases [a group
          of neuromuscular diseases]) [AI, C]
    - code: C2
      text: 'Developing Skills of Investigation and Communication: investigate the products of metabolic
        processes such as cellular respiration and photosynthesis'
      specific:
      - code: C2.1
        text: 'use appropriate terminology related to metabolism, including, but not limited to: energy
          carriers, glycolysis, Krebs cycle, electron transport chain, ATP synthase, oxidative phosphorylation,
          chemiosmosis, proton pump, photolysis, Calvin cycle, light and dark reactions, and cyclic and
          noncyclic phosphorylation [C]'
      - code: C2.2
        text: conduct a laboratory investigation into the process of cellular respiration to identify
          the products of the process, interpret the qualitative observations, and display them in an
          appropriate format [PR, AI, C]
      - code: C2.3
        text: conduct a laboratory investigation of the process of photosynthesis to identify the products
          of the process, interpret the qualitative observations, and display them in an appropriate format
          [PR, AI, C]
    - code: C3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the chemical changes and energy
        conversions that occur in metabolic processes'
      specific:
      - code: C3.1
        text: explain the chemical changes and energy conversions associated with the processes of aerobic
          and anaerobic cellular respiration (e.g., in aerobic cellular respiration, glucose and oxygen
          react to produce carbon dioxide, water, and energy in the form of heat and ATP; in anaerobic
          cellular respiration, yeast reacts with glucose in the absence of oxygen to produce carbon dioxide
          and ethanol)
      - code: C3.2
        text: explain the chemical changes and energy conversions associated with the process of photosynthesis
          (e.g., carbon dioxide and water react with sunlight to produce oxygen and glucose)
      - code: C3.3
        text: use the laws of thermodynamics to explain energy transfer in the cell during the processes
          of cellular respiration and photosynthesis
      - code: C3.4
        text: describe, compare, and illustrate (e.g., using flow charts) the matter and energy transformations
          that occur during the processes of cellular respiration (aerobic and anaerobic) and photosynthesis,
          including the roles of oxygen and organelles such as mitochondria and chloroplasts
  - code: D
    title: Molecular Genetics
    overall:
    - code: D1
      text: 'Relating Science to Technology, Society, and the Environment: analyse some of the social,
        ethical, and legal issues associated with genetic research and biotechnology'
      specific:
      - code: D1.1
        text: analyse, on the basis of research, some of the social, ethical, and legal implications of
          biotechnology (e.g., the bioengineering of animal species, especially those intended for human
          consumption; the cultivation of transgenic crops; the patenting of life forms; cloning) [IP,
          PR, AI, C]
      - code: D1.2
        text: analyse, on the basis of research, some key aspects of Canadian regulations pertaining to
          biotechnology (e.g., current or potential legislation for mandatory DNA fingerprinting, human
          cloning, ownership of a genome, patenting of genetically modified organisms), and compare them
          to regulations from another jurisdiction [IP, PR, AI, C]
    - code: D2
      text: 'Developing Skills of Investigation and Communication: investigate, through laboratory activities,
        the structures of cell components and their roles in processes that occur within the cell'
      specific:
      - code: D2.1
        text: 'use appropriate terminology related to molecular genetics, including, but not limited to:
          polymerase I, II, and III, DNA ligase, helicase, Okazaki fragment, mRNA, rRNA, tRNA, codon,
          anticodon, translation, transcription, and ribosome subunits [C]'
      - code: D2.2
        text: analyse a simulated strand of DNA to determine the genetic code and base pairing of DNA
          (e.g., determine base sequences of DNA for a protein; analyse base sequences in DNA to recognize
          an anomaly) [AI]
      - code: D2.3
        text: conduct an investigation to extract DNA from a specimen of plant or animal protein [PR]
      - code: D2.4
        text: investigate and analyse the cell components involved in the process of protein synthesis,
          using appropriate laboratory equipment and techniques, or a computer simulation [PR, AI]
    - code: D3
      text: 'Understanding Basic Concepts: demonstrate an understanding of concepts related to molecular
        genetics, and how genetic modification is applied in industry and agriculture'
      specific:
      - code: D3.1
        text: explain the current model of DNA replication, and describe the different repair mechanisms
          that can correct mistakes in DNA sequencing
      - code: D3.2
        text: compare the structures and functions of RNA and DNA, and explain their roles in the process
          of protein synthesis
      - code: D3.3
        text: explain the steps involved in the process of protein synthesis and how genetic expression
          is controlled in prokaryotes and eukaryotes by regulatory proteins (e.g., the role of operons
          in prokaryotic cells; the mechanism of gene expression in eukaryotic cells)
      - code: D3.4
        text: explain how mutagens, such as radiation and chemicals, can cause mutations by changing the
          genetic material in cells (e.g., the mechanisms and effects of point mutations and frameshift
          mutations)
      - code: D3.5
        text: describe some examples of genetic modification, and explain how it is applied in industry
          and agriculture (e.g., the processes involved in cloning, or in the sequencing of DNA bases;
          the processes involved in the manipulation of genetic material and protein synthesis; the development
          and mechanisms of the polymerization chain reaction)
      - code: D3.6
        text: describe the functions of some of the cell components used in biotechnology (e.g., the roles
          of plasmids, restriction enzymes, recombinant DNA, and vectors in genetic engineering)
      - code: D3.7
        text: describe, on the basis of research, some of the historical scientific contributions that
          have advanced our understanding of molecular genetics (e.g., discoveries made by Frederick Griffith,
          Watson and Crick, Hershey and Chase)
  - code: E
    title: Homeostasis
    overall:
    - code: E1
      text: 'Relating Science to Technology, Society, and the Environment: evaluate the impact on the
        human body of selected chemical substances and of environmental factors related to human activity'
      specific:
      - code: E1.1
        text: assess, on the basis of findings from a case study, the effects on the human body of taking
          chemical substances to enhance performance or improve health (e.g., the risks and benefits of
          taking large quantities of vitamins or amino acids; the effects on the human body of substances
          that people use to cope with stress) [PR, AI, C]
      - code: E1.2
        text: evaluate, on the basis of research, some of the human health issues that arise from the
          impact of human activities on the environment (e.g., the effects of synthetic estrogen compounds
          released into our water systems; the effects of leaching of compounds from plastic products
          into soil and water) [IP, PR, AI, C]
    - code: E2
      text: 'Developing Skills of Investigation and Communication: investigate the feedback mechanisms
        that maintain homeostasis in living organisms'
      specific:
      - code: E2.1
        text: 'use appropriate terminology related to homeostasis, including, but not limited to: insulin,
          testosterone, estrogen, nephron, dialysis, pituitary, synapse, and acetylcholine [C]'
      - code: E2.2
        text: plan and construct a model to illustrate the essential components of the homeostatic process
          (e.g., create a flow chart that illustrates representative feedback mechanisms in living things)
          [IP, AI, C]
      - code: E2.3
        text: plan and conduct an investigation to study a feedback system (e.g., stimulus response loop)
          [IP, PR, AI]
      - code: E2.4
        text: plan and conduct an investigation to study the response mechanism of an invertebrate to
          external stimuli (e.g., the instinctive behaviour of an invertebrate in response to a stimulus
          such as light), using appropriate laboratory equipment and techniques [IP, PR, AI]
    - code: E3
      text: 'Understanding Basic Concepts: demonstrate an understanding of the anatomy and physiology
        of human body systems, and explain the mechanisms that enable the body to maintain homeostasis'
      specific:
      - code: E3.1
        text: describe the anatomy and physiology of the endocrine, excretory, and nervous systems, and
          explain how these systems interact to maintain homeostasis
      - code: E3.2
        text: explain how reproductive hormones act in human feedback mechanisms to maintain homeostasis
          (e.g., the actions of male and female reproductive hormones on their respective body systems)
      - code: E3.3
        text: describe the homeostatic processes involved in maintaining water, ionic, thermal, and acid–base
          equilibrium, and explain how these processes help body systems respond to both a change in environment
          and the effects of medical treatments (e.g., the role of feedback mechanisms in water balance
          or thermoregulation; how the buffering system of blood maintains the body’s pH balance; the
          effect of medical treatments on the endocrine system; the effects of chemotherapy on homeostasis)
  - code: F
    title: Population Dynamics
    overall:
    - code: F1
      text: 'Relating Science to Technology, Society, and the Environment: analyse the relationships between
        population growth, personal consumption, technological development, and our ecological footprint,
        and assess the effectiveness of some Canadian initiatives intended to assist expanding populations'
      specific:
      - code: F1.1
        text: analyse the effects of human population growth, personal consumption, and technological
          development on our ecological footprint (e.g., the deforestation resulting from expanding development
          and demand for wood products causes the destruction of habitats that support biological diversity;
          the acidification of lakes associated with some industrial processes causes a decrease in fish
          populations) [AI, C]
      - code: F1.2
        text: assess, on the basis of research, the effectiveness of some Canadian technologies and projects
          intended to nourish expanding populations (e.g., the risks and benefits of growing genetically
          modified canola; some of the sustainable development projects funded by the Canadian International
          Development Agency [CIDA]) [IP, PR, AI, C]
    - code: F2
      text: 'Developing Skills of Investigation and Communication: investigate the characteristics of
        population growth, and use models to calculate the growth of populations within an ecosystem'
      specific:
      - code: F2.1
        text: 'use appropriate terminology related to population dynamics, including, but not limited
          to: carrying capacity, population growth, population cycle, fecundity, and mortality [C]'
      - code: F2.2
        text: use conceptual and mathematical population growth models to calculate the growth of populations
          of various species in an ecosystem (e.g., use the concepts of exponential, sigmoid, and sinusoidal
          growth to estimate the sizes of various populations) [PR, AI, C]
      - code: F2.3
        text: determine, through laboratory inquiry or using computer simulations, the characteristics
          of population growth of two different populations (e.g., the different population cycles of
          a predator and its prey; the population cycles of two populations that compete for food; the
          increase of Aboriginal compared to non-Aboriginal populations and the significant difference
          in average age between the two groups) [PR, AI, C]
    - code: F3
      text: 'Understanding Basic Concepts: demonstrate an understanding of concepts related to population
        growth, and explain the factors that affect the growth of various populations of species'
      specific:
      - code: F3.1
        text: explain the concepts of interaction (e.g., competition, predation, defence mechanism, symbiotic
          relationship, parasitic relationship) between different species
      - code: F3.2
        text: describe the characteristics of a given population, such as its growth, density (e.g., fecundity,
          mortality), distribution, and minimum viable size
      - code: F3.3
        text: explain factors such as carrying capacity, fecundity, density, and predation that cause
          fluctuation in populations, and analyse the fluctuation in the population of a species of plant,
          wild animal, or microorganism
      - code: F3.4
        text: explain the concept of energy transfer in a human population in terms of the flow of food
          energy in the production, distribution, and use of food resources
      - code: F3.5
        text: explain how a change in one population in an aquatic or terrestrial ecosystem can affect
          the entire hierarchy of living things in that system (e.g., how the disappearance of crayfish
          from a lake causes a decrease in the bass population of the lake; how the disappearance of beaver
          from an ecosystem causes a decrease in the wolf population in that ecosystem)
